<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>规则 · HIDS AI 研判平台</title>
<meta name="description" content="HIDS AI 研判平台规则配置页设计稿。" />
<link rel="stylesheet" href="assets/theme.css" />
<link rel="stylesheet" href="assets/fonts/fonts.css" />
<script src="assets/theme.js"></script>
<style>
@layer od-layout {
  [hidden]:not([hidden="until-found" i]) { display: none !important; }
  dialog:not([open]) { display: none !important; }

  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }

  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }

  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }

  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }

  .od-icon { display: inline-block; inline-size: var(--od-icon-size, 1em); block-size: var(--od-icon-size, 1em); flex: none; }

  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-lines-2 { min-height: calc(2 * 1.4em); }
  .od-nowrap  { white-space: nowrap; }
  .od-keep    { word-break: keep-all; overflow-wrap: anywhere; }

  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }

  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
             padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
  :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }

  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch  { min-width: 44px; min-height: 44px; }
}
:root [hidden]:where(:not([hidden="until-found" i])) { display: none; }

:root {
  --font-ui: "SpaceGrotesk", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --font-mono: "JetBrainsMono", ui-monospace, SFMono-Regular, Menlo, Consolas, "PingFang SC", "Microsoft YaHei", monospace;
  --dur: 160ms;
  --ease: cubic-bezier(.2, .7, .3, 1);
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 13px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

::selection { background: var(--selection-bg); color: var(--selection-text); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-feature-settings: "tnum" 1; }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0;
}

.app { display: grid; grid-template-columns: 196px minmax(0, 1fr); height: 100dvh; }

.rail {
  height: 100dvh; display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
  background: var(--bg-rail); border-right: 1px solid var(--line);
}
.rail-brand {
  display: flex; align-items: center; gap: 9px; height: 52px;
  padding: 0 16px; border-bottom: 1px solid var(--line); min-width: 0;
}
.rail-mark { width: 22px; height: 22px; color: var(--accent); flex: none; }
.rail-name { font-size: 13px; font-weight: 700; letter-spacing: .16em; color: var(--text); }
.rail-sub { font-size: 10px; letter-spacing: .04em; color: var(--text-3); white-space: nowrap; }

.nav { padding: 10px 0; overflow-y: auto; }
.nav-item {
  display: flex; align-items: center; gap: 9px; height: 34px; padding: 0 16px;
  color: var(--text-2); font-size: 12.5px; text-decoration: none; white-space: nowrap;
  transition: color var(--dur) var(--ease), background-color var(--dur) var(--ease);
}
.nav-item .od-icon { --od-icon-size: 15px; color: var(--text-3); }
.nav-item:hover { color: var(--text); background: var(--bg-hover); }
.nav-item:hover .od-icon { color: var(--text-2); }
.nav-item.is-active { color: var(--text); background: var(--bg-active); }
.nav-item.is-active .od-icon { color: var(--accent); }

.rail-foot { border-top: 1px solid var(--line); }
.who { display: flex; align-items: center; gap: 9px; padding: 12px 16px; min-width: 0; }
.avatar {
  display: grid; place-items: center; width: 22px; height: 22px; flex: none;
  border: 1px solid var(--line-2); border-radius: 50%; color: var(--text-2); font-size: 10.5px;
}
.who-name { display: block; font-size: 12px; color: var(--text); }
.who-role { display: block; font-size: 10px; color: var(--text-3); }

.main { min-width: 0; height: 100dvh; display: grid; grid-template-rows: 52px minmax(0, 1fr); }

.bar {
  display: flex; align-items: center; justify-content: space-between; gap: 24px;
  height: 52px; padding: 0 24px; border-bottom: 1px solid var(--line);
}
.bar h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
.bar-right { display: flex; align-items: center; gap: 12px; }

.textbtn {
  display: inline-flex; align-items: center; gap: 5px; min-height: 26px;
  padding: 0; border: 0; background: none; color: var(--text-2);
  font-family: inherit; font-size: 11.5px; cursor: pointer; text-decoration: none;
  transition: color var(--dur) var(--ease);
}
.textbtn:hover:not(:disabled) { color: var(--accent); }
.textbtn:disabled { color: var(--text-3); cursor: default; }
.textbtn .od-icon { --od-icon-size: 13px; }
.sep-v { width: 1px; height: 16px; background: var(--line); }

.rules-shell {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 320px;
  gap: 0 28px;
  padding: 0 24px 20px;
  min-height: 0;
}

/* ---------- editor ---------- */
.editor-pane { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0; }

.pane-head {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 12px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap;
}
.title-block { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; min-width: 0; }
.title-block h2 { margin: 0; font-size: 13px; font-weight: 600; }
.rev { font-size: 10.5px; color: var(--text-3); }
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 7px; border: 1px solid var(--line-2); border-radius: 2px;
  font-size: 10px; color: var(--text-2);
}
.badge::before { content: ""; width: 5px; height: 5px; background: var(--text-3); }
.badge.is-writable { color: var(--accent); border-color: var(--accent-line); }
.badge.is-writable::before { background: var(--accent); }
.dirty {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 7px; border-radius: 2px;
  background: var(--warn-soft); border: 1px solid var(--warn-line);
  font-size: 10px; color: var(--warn); white-space: nowrap;
}
.pane-actions { display: flex; align-items: center; gap: 14px; }

.view-switch { display: flex; border: 1px solid var(--line-2); border-radius: 2px; overflow: hidden; }
.view-switch button {
  height: 26px; padding: 0 10px;
  border: 0; background: none; color: var(--text-3);
  font-family: inherit; font-size: 11.5px; cursor: pointer;
}
.view-switch button[aria-pressed="true"] { background: var(--bg-active); color: var(--text); }

.form-wrap { overflow-y: auto; min-height: 0; border-bottom: 1px solid var(--line); padding: 8px 0 16px; }
.form { min-width: 0; }
.form-row {
  display: grid;
  grid-template-columns: 180px minmax(0, 1fr) auto;
  gap: 12px;
  align-items: start;
  padding: 5px 0;
  border-bottom: 1px solid var(--line);
}
.form-row:last-child { border-bottom: 0; }
.key-input {
  width: 100%; height: 28px; padding: 0 6px;
  border: 1px solid transparent; border-radius: 2px;
  background: none; color: var(--text-2);
  font-family: var(--font-mono); font-size: 11px;
}
.key-input:hover { border-color: var(--line-2); }
.key-input:focus { outline: none; border-color: var(--accent); background: var(--bg-input); }
.val-input {
  width: 100%; height: 28px; padding: 0 8px;
  border: 1px solid var(--line); border-radius: 2px;
  background: var(--bg-input); color: var(--text);
  font-family: var(--font-mono); font-size: 11px;
}
.val-input:focus { outline: none; border-color: var(--accent); }
.bool-field { display: inline-flex; align-items: center; gap: 7px; height: 28px; font-size: 11px; color: var(--text-2); }
.bool-field input { width: 14px; height: 14px; accent-color: var(--accent); }
.null-val { display: inline-flex; align-items: center; height: 28px; font-size: 11px; color: var(--text-3); font-family: var(--font-mono); }
.row-actions { display: flex; align-items: center; gap: 8px; padding-top: 4px; }
.row-actions button {
  padding: 0; border: 0; background: none; color: var(--text-3);
  font-family: inherit; font-size: 10.5px; cursor: pointer;
}
.row-actions button:hover { color: var(--accent); }
.row-actions button.is-danger:hover { color: var(--danger); }
.nested { border-top: 1px solid var(--line); }
.nested summary {
  padding: 5px 0; cursor: pointer; list-style: none;
  font-size: 10.5px; color: var(--text-3);
}
.nested summary::-webkit-details-marker { display: none; }
.nested summary::after { content: "›"; float: right; transform: rotate(90deg); transition: transform var(--dur) var(--ease); }
.nested[open] summary::after { transform: rotate(-90deg); }
.nested-body { padding: 0 0 4px 8px; }
.array-item {
  display: grid;
  grid-template-columns: 26px minmax(0, 1fr) auto;
  gap: 10px;
  align-items: start;
  padding: 4px 0;
  border-bottom: 1px solid var(--line);
}
.array-item:last-child { border-bottom: 0; }
.idx { font-size: 10px; color: var(--text-3); padding-top: 8px; }
.add-row { display: flex; align-items: center; gap: 6px; padding: 8px 0; flex-wrap: wrap; }
.add-row .key-input { width: 180px; border-color: var(--line-2); }
.add-row select {
  height: 28px; padding: 0 6px;
  border: 1px solid var(--line-2); border-radius: 2px;
  background: var(--bg); color: var(--text-2);
  font-family: inherit; font-size: 11px;
}
.add-row button {
  height: 28px; padding: 0 9px;
  border: 1px solid var(--line-2); border-radius: 2px;
  background: none; color: var(--text-2);
  font-family: inherit; font-size: 11px; cursor: pointer;
}
.add-row button:hover { color: var(--accent); border-color: var(--accent-line); }
.form-empty { padding: 14px 0; font-size: 11.5px; color: var(--text-3); }
.form-wrap.is-readonly { opacity: .65; pointer-events: none; }
.form-wrap.is-readonly .row-actions { visibility: hidden; }

.editor-wrap {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  min-height: 0;
  border-bottom: 1px solid var(--line);
  background: var(--bg-soft);
}
.gutter {
  margin: 0; padding: 12px 10px 12px 14px;
  text-align: right; overflow: hidden;
  font-family: var(--font-mono); font-size: 11px; line-height: 1.75;
  color: var(--text-3); background: var(--bg-rail);
  border-right: 1px solid var(--line);
  user-select: none; white-space: pre;
}
#config {
  width: 100%; height: 100%;
  padding: 12px 16px;
  border: 0; resize: none;
  background: transparent; color: var(--text);
  font-family: var(--font-mono); font-size: 11.5px; line-height: 1.75;
  tab-size: 2;
}
#config:focus { outline: none; }
#config[readonly] { color: var(--text-2); cursor: default; }

.editor-foot {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 8px 0;
  font-size: 10.5px; color: var(--text-3);
}
.syntax { display: inline-flex; align-items: center; gap: 6px; }
.syntax::before { content: ""; width: 5px; height: 5px; background: var(--accent); }
.syntax.is-error { color: var(--danger); }
.syntax.is-error::before { background: var(--danger); }

/* ---------- side ---------- */
.side { overflow-y: auto; min-height: 0; padding-top: 2px; }
.panel { padding: 14px 0; border-bottom: 1px solid var(--line); }
.panel:first-child { padding-top: 14px; }
.panel h3 { margin: 0 0 8px; font-size: 10px; font-weight: 500; letter-spacing: .06em; color: var(--text-3); }
.kv { margin: 0; padding: 0; }
.kv-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 5px 0; font-size: 11.5px; }
.kv-row dt { color: var(--text-3); }
.kv-row dd { margin: 0; color: var(--text); font-family: var(--font-mono); font-size: 11px; overflow-wrap: anywhere; text-align: right; }

.btn {
  display: flex; align-items: center; justify-content: center;
  width: 100%; height: 34px;
  border: 1px solid var(--line-2); border-radius: 2px;
  background: none; color: var(--text-2);
  font-family: inherit; font-size: 12px; cursor: pointer;
}
.btn:hover:not(:disabled) { color: var(--text); border-color: var(--line-hover); }
.btn:disabled { color: var(--text-3); cursor: default; opacity: .55; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover:not(:disabled) { background: var(--accent-hover); }
.btn.primary:disabled { background: transparent; border-color: var(--line-2); color: var(--text-3); }
.btn + .btn { margin-top: 8px; }

.field-note { margin: 8px 0 0; font-size: 10px; line-height: 1.55; color: var(--text-3); }
.token-field { display: grid; gap: 5px; margin-top: 10px; }
.token-field label { font-size: 10px; color: var(--text-3); }
.token-field input {
  height: 32px; padding: 0 9px;
  border: 1px solid var(--line-2); border-radius: 2px;
  background: var(--bg-input); color: var(--text);
  font-family: var(--font-mono); font-size: 11.5px;
}
.token-field input:focus { outline: none; border-color: var(--accent); }

.log { padding: 12px 0; }
.log-entry { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 8px; padding: 5px 0; font-size: 10.5px; line-height: 1.55; }
.log-entry time { color: var(--text-3); font-family: var(--font-mono); font-size: 10px; }
.log-entry span { color: var(--text-2); }
.log-entry.is-error span { color: var(--danger); }
.log-entry.is-ok span { color: var(--accent); }

.result {
  margin-top: 8px; padding: 7px 9px;
  border: 1px solid var(--line-2); border-radius: 2px;
  font-size: 10.5px; line-height: 1.55; color: var(--text-3);
}
.result.is-ok { border-color: var(--accent-line); color: var(--accent); }
.result.is-error { border-color: var(--danger-line); color: var(--danger); }

.placeholder { padding: 80px 0; text-align: center; }
.placeholder h2 { margin: 0; font-size: 14px; font-weight: 600; }
.placeholder p { margin: 6px 0 0; font-size: 12px; color: var(--text-3); }
.placeholder .textbtn { margin-top: 18px; font-size: 12px; }

@media (max-width: 1100px) {
  .app { grid-template-columns: 56px minmax(0, 1fr); }
  .rail-brand { justify-content: center; padding: 0; }
  .rail-name, .rail-sub, .nav-item .label, .who-meta { display: none; }
  .nav-item { justify-content: center; padding: 0; }
  .who { justify-content: center; padding: 12px 0; }
  .bar { padding: 0 20px; }
  .rules-shell { grid-template-columns: minmax(0, 1fr) 280px; padding: 0 20px 16px; gap: 0 20px; }
}

@media (max-width: 900px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100dvh; grid-template-columns: minmax(0, 1fr); }
  .rail {
    display: flex; align-items: center; gap: 14px; height: auto;
    padding: 0 16px; border-right: 0; border-bottom: 1px solid var(--line);
  }
  .rail-brand { height: 46px; border-bottom: 0; }
  .nav { display: flex; gap: 0; padding: 0; overflow-x: auto; scrollbar-width: none; }
  .nav::-webkit-scrollbar { display: none; }
  .nav-item { height: 46px; padding: 0 11px; flex: none; }
  .nav-item.is-active { background: var(--bg-active); }
  .nav-item .label { display: inline; }
  .rail-foot { display: flex; align-items: center; margin-left: auto; border-top: 0; }
  .who { display: none; }
  .rail-foot .nav-item { height: 46px; }
  .main { height: auto; grid-template-rows: 46px minmax(0, 1fr); }
  .bar { height: 46px; padding: 0 14px; }
  .rules-shell { grid-template-columns: minmax(0, 1fr); gap: 0; padding: 0 14px 24px; }
  .editor-pane { min-height: 52vh; }
  .side { overflow: visible; }
  .panel:first-child { padding-top: 12px; }
}

@media (max-width: 620px) {
  .form-row { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .form-row .key-input { border-color: var(--line); background: var(--bg-rail); }
  .row-actions { padding-top: 0; }
  .array-item { grid-template-columns: 20px minmax(0, 1fr) auto; }
  .add-row .key-input { width: 100%; }
  .editor-wrap { grid-template-columns: minmax(0, 1fr); }
  .gutter { display: none; }
  .textbtn { min-height: 40px; }
  .pane-head { gap: 8px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .001ms !important; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="rail-brand">
      <svg class="rail-mark" viewBox="0 0 28 28" aria-hidden="true" focusable="false">
        <path d="M14 2.6 24 8.3v11.4L14 25.4 4 19.7V8.3z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />

      </svg>
      <span class="od-field">
        <span class="rail-name">HIDS</span>
        <span class="rail-sub">AI 研判平台</span>
      </span>
    </div>

    <nav class="nav" aria-label="主导航">
      <a class="nav-item" href="overview.html">
        <svg class="od-icon" viewBox="0 0 20 20" aria-hidden="true">
          <rect x="2.8" y="2.8" width="6" height="6" rx=".8" fill="none" stroke="currentColor" stroke-width="1.4" />
          <rect x="11.2" y="2.8" width="6" height="6" rx=".8" fill="none" stroke="currentColor" stroke-width="1.4" />
          <rect x="2.8" y="11.2" width="6" height="6" rx=".8" fill="none" stroke="currentColor" stroke-width="1.4" />
          <rect x="11.2" y="11.2" width="6" height="6" rx=".8" fill="none" stroke="currentColor" stroke-width="1.4" />
        </svg>
        <span class="label">总览</span>
      </a>
      <a class="nav-item" href="alerts.html">
        <svg class="od-icon" viewBox="0 0 20 20" aria-hidden="true">
          <path d="M10 2.9 18 16.6H2z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" />
          <path d="M10 7.6v3.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
          <circle cx="10" cy="13.9" r=".9" fill="currentColor" />
        </svg>
        <span class="label">告警</span>
      </a>
      <a class="nav-item" href="trace.html">
        <svg class="od-icon" viewBox="0 0 20 20" aria-hidden="true">
          <circle cx="5" cy="5.4" r="2.2" fill="none" stroke="currentColor" stroke-width="1.4" />
          <circle cx="15" cy="8" r="2.2" fill="none" stroke="currentColor" stroke-width="1.4" />
          <circle cx="8" cy="15" r="2.2" fill="none" stroke="currentColor" stroke-width="1.4" />
          <path d="M6.9 6.7 13 7.3M6 7.4l1.4 5.3M13.6 9.6l-3.7 3.6" stroke="currentColor" stroke-width="1.3" />
        </svg>
        <span class="label">深度溯源</span>
      </a>
      <a class="nav-item is-active" href="rules.html" aria-current="page">
        <svg class="od-icon" viewBox="0 0 20 20" aria-hidden="true">

  <div class="main">
    <header class="bar">
      <h1 id="page-title">规则</h1>
      <div class="bar-right">
        <button type="button" class="textbtn" id="refresh">
          <svg class="od-icon" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M13.2 8a5.2 5.2 0 1 1-1.6-3.7" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
            <path d="M13.4 2.6v2.9h-2.9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />

        </button>
        <span class="sep-v" aria-hidden="true"></span>
        <button type="button" class="theme-toggle" data-theme-toggle>
          <svg class="icon-sun" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.3" />
            <path d="M8 1.6v1.6M8 12.8v1.6M1.6 8h1.6M12.8 8h1.6M3.5 3.5l1.1 1.1M11.4 11.4l1.1 1.1M12.5 3.5l-1.1 1.1M4.6 11.4l-1.1 1.1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />

            <path d="M13.2 9.6A5.6 5.6 0 0 1 6.4 2.8a5.6 5.6 0 1 0 6.8 6.8z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" />

          <p class="field-note" style="margin: 0 0 8px;">config 的结构由后端定义，页面只按 JSON 原样编辑，不做字段假设。</p>
          <dl class="kv">
            <div class="kv-row"><dt>revision</dt><dd id="rev-value">—</dd></div>
            <div class="kv-row"><dt>可写</dt><dd id="writable-value">—</dd></div>

          </dl>
        </section>

          <h3>校验</h3>
          <button type="button" class="btn" id="validate">校验配置</button>
          <div class="result" id="validate-result" hidden></div>
        </section>

          <h3>保存</h3>
          <dl class="kv">
            <div class="kv-row"><dt>expected_revision</dt><dd id="expected-rev">—</dd></div>

            <label for="token">管理令牌（X-Rule-Admin-Token）</label>
            <input id="token" type="password" autocomplete="off" placeholder="输入令牌后保存" />
          </div>
          <button type="button" class="btn primary" id="save" disabled>保存规则</button>
          <p class="field-note">令牌只保存在当前页面内存中，刷新即清除；保存时以当前 revision 作为版本前置条件。</p>

      <h2 id="ph-title">知识库</h2>
      <p>该页面尚未定稿，将在后续设计中补齐。</p>
      <button type="button" class="textbtn" id="ph-back">返回规则</button>

    <p class="sr-only" id="sr-status" role="status" aria-live="polite"></p>

<script>
(function () {
  "use strict";

  /*
   * 文档只定义 /api/triage/rules 返回 config 这个自由对象，没有字段说明。
   * 表单按真实 config 递归生成，不预设任何规则字段；示例配置为空对象。
   */
  var RULES = {
    revision: "rev-2026-1113",
    writable: true,
    config: {}
  };

  var $ = function (id) { return document.getElementById(id); };
  var editor = $("config");
  var gutter = $("gutter");
  var formHost = $("form");
  var model = clone(RULES.config);
  var savedSnapshot = JSON.stringify(model);
  var view = "form";
  var validating = false;

  function clone(value) {
    return JSON.parse(JSON.stringify(value));
  }

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function isObject(value) {
    return value !== null && typeof value === "object" && !Array.isArray(value);
  }

  function pretty(value) {
    return JSON.stringify(value, null, 2);
  }

  function pathAttr(path) {
    return escapeHtml(JSON.stringify(path));
  }

  function parsePath(element) {
    try { return JSON.parse(element.dataset.path || "[]"); }
    catch (error) { return []; }
  }

  function getAt(path) {
    var current = model;
    path.forEach(function (key) { current = current[key]; });
    return current;
  }

  function setAt(path, value) {
    if (!path.length) { model = value; return; }
    var parent = getAt(path.slice(0, -1));
    parent[path[path.length - 1]] = value;
  }

  function deleteAt(path) {
    if (!path.length) return;
    var parent = getAt(path.slice(0, -1));
    delete parent[path[path.length - 1]];
  }

  function renameAt(path, nextKey) {
    var parentPath = path.slice(0, -1);
    var oldKey = path[path.length - 1];
    var parent = getAt(parentPath);
    if (!nextKey || nextKey === oldKey) return false;
    if (Object.prototype.hasOwnProperty.call(parent, nextKey)) return false;

    var rebuilt = {};
    Object.keys(parent).forEach(function (key) {
      if (key === oldKey) rebuilt[nextKey] = parent[oldKey];
      else rebuilt[key] = parent[key];
    });
    setAt(parentPath, rebuilt);
    return true;
  }

  function moveItem(path, delta) {
    var parent = getAt(path.slice(0, -1));
    var index = path[path.length - 1];
    var next = index + delta;
    if (next < 0 || next >= parent.length) return;
    var tmp = parent[index];
    parent[index] = parent[next];
    parent[next] = tmp;
  }

  function defaultValue(type) {
    if (type === "number") return 0;
    if (type === "boolean") return false;
    if (type === "object") return {};
    if (type === "array") return [];
    return "";
  }

  function typeOptions() {
    return '<option value="string">字符串</option>' +
      '<option value="number">数字</option>' +
      '<option value="boolean">布尔</option>' +
      '<option value="object">对象</option>' +
      '<option value="array">数组</option>';
  }

  function addFieldRow(path) {
    return '<div class="add-row" data-path="' + pathAttr(path) + '">' +
      '<input class="key-input" data-role="new-key" placeholder="新字段名" aria-label="新字段名" />' +
      '<select data-role="new-type" aria-label="新字段类型">' + typeOptions() + '</select>' +
      '<button type="button" data-act="add-key">添加字段</button></div>';
  }

  function addItemRow(path) {
    return '<div class="add-row" data-path="' + pathAttr(path) + '">' +
      '<select data-role="item-type" aria-label="新项目类型">' + typeOptions() + '</select>' +
      '<button type="button" data-act="add-item">添加一项</button></div>';
  }

  function valueHtml(value, path) {
    if (Array.isArray(value)) {
      var items = value.map(function (item, index) {
        var itemPath = path.concat(index);
        return '<div class="array-item" data-path="' + pathAttr(itemPath) + '">' +
          '<span class="idx mono">' + index + '</span>' +
          '<div class="value-cell">' + valueHtml(item, itemPath) + '</div>' +
          '<div class="row-actions">' +
            '<button type="button" data-act="up" data-path="' + pathAttr(itemPath) + '">↑</button>' +
            '<button type="button" data-act="down" data-path="' + pathAttr(itemPath) + '">↓</button>' +
            '<button type="button" class="is-danger" data-act="del-item" data-path="' + pathAttr(itemPath) + '">×</button>' +
          '</div></div>';
      }).join("");

      return '<details class="nested" open data-path="' + pathAttr(path) + '">' +
        '<summary>数组 · ' + value.length + ' 项</summary>' +
        '<div class="nested-body">' + (items || '<p class="form-empty">空数组</p>') + addItemRow(path) + '</div></details>';
    }

    if (isObject(value)) {
      var rows = Object.keys(value).map(function (key) {
        return rowHtml(key, value[key], path.concat(key));
      }).join("");
      return '<details class="nested" data-path="' + pathAttr(path) + '">' +
        '<summary>对象 · ' + Object.keys(value).length + ' 个字段</summary>' +
        '<div class="nested-body">' + (rows || '<p class="form-empty">空对象</p>') + addFieldRow(path) + '</div></details>';
    }

    if (typeof value === "boolean") {
      return '<label class="bool-field"><input type="checkbox" data-act="bool" data-path="' + pathAttr(path) + '"' +
        (value ? " checked" : "") + ' /><span data-role="bool-text">' + (value ? "true" : "false") + '</span></label>';
    }
    if (typeof value === "number") {
      return '<input class="val-input" type="number" step="any" data-act="number" data-path="' + pathAttr(path) + '" value="' + value + '" />';
    }
    if (value === null) {
      return '<span class="null-val">null</span>';
    }
    return '<input class="val-input" type="text" data-act="string" data-path="' + pathAttr(path) + '" value="' + escapeHtml(value) + '" />';
  }

  function rowHtml(key, value, path) {
    return '<div class="form-row">' +
      '<input class="key-input" data-role="key" data-path="' + pathAttr(path) + '" value="' + escapeHtml(key) + '" aria-label="字段名" />' +
      '<div class="value-cell">' + valueHtml(value, path) + '</div>' +
      '<div class="row-actions"><button type="button" data-act="del" data-path="' + pathAttr(path) + '">删除</button></div>' +
      '</div>';
  }

  function renderForm() {
    if (!isObject(model)) {
      formHost.innerHTML = '<p class="form-empty">config 不是对象，请在 JSON 视图里改为对象。</p>';
      return;
    }
    var keys = Object.keys(model);
    var html = keys.map(function (key) { return rowHtml(key, model[key], [key]); }).join("");
    if (!keys.length) html = '<p class="form-empty">当前 config 为空对象。添加字段，或切到 JSON 粘贴配置。</p>';
    formHost.innerHTML = html + addFieldRow([]);
  }

  function setSyntax(state, message) {
    var el = $("syntax");
    el.textContent = message;
    el.classList.toggle("is-error", state === "error");
  }

  function updateDirty() {
    var dirty = JSON.stringify(model) !== savedSnapshot;
    $("dirty").hidden = !dirty;
    $("reset").disabled = !dirty || !RULES.writable;
    $("save").disabled = !dirty || !RULES.writable || !$("token").value.trim();
  }

  function changed() {
    updateDirty();
    setSyntax("ok", "JSON 有效");
    $("count-value").textContent = "未校验";
  }

  function renderGutter() {
    var lines = editor.value.split("\n").length;
    var text = "";
    for (var i = 1; i <= lines; i++) text += i + (i < lines ? "\n" : "");
    gutter.textContent = text;
    gutter.scrollTop = editor.scrollTop;
  }

  function updateCursor() {
    if (view !== "json") {
      $("cursor-info").textContent = "表单视图";
      return;
    }
    var upto = editor.value.slice(0, editor.selectionStart);
    var lines = upto.split("\n");
    $("cursor-info").textContent = "第 " + lines.length + " 行 · 第 " + (lines[lines.length - 1].length + 1) + " 列";
  }

  function log(message, tone) {
    var now = new Date();
    var time = String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
    var entry = document.createElement("div");
    entry.className = "log-entry" + (tone ? " is-" + tone : "");
    var t = document.createElement("time");
    t.textContent = time;
    var span = document.createElement("span");
    span.textContent = message;
    entry.appendChild(t);
    entry.appendChild(span);
    $("log").prepend(entry);
  }

  function setResult(message, tone) {
    var el = $("validate-result");
    if (!message) { el.hidden = true; return; }
    el.hidden = false;
    el.className = "result" + (tone ? " is-" + tone : "");
    el.textContent = message;
  }

  function renderMeta() {
    $("rev-label").textContent = RULES.revision || "无 revision";
    $("rev-value").textContent = RULES.revision || "null";
    $("expected-rev").textContent = RULES.revision || "null";
    $("writable-value").textContent = RULES.writable ? "可用" : "只读";
    var badge = $("writable-badge");
    badge.textContent = RULES.writable ? "可写" : "只读";
    badge.classList.toggle("is-writable", RULES.writable);
    editor.readOnly = !RULES.writable;
    $("form-wrap").classList.toggle("is-readonly", !RULES.writable);
    $("validate").disabled = validating;
    updateDirty();
  }

  function setView(next) {
    if (next === "json") {
      editor.value = pretty(model);
      renderGutter();
      $("json-wrap").hidden = false;
      $("form-wrap").hidden = true;
      view = "json";
      updateCursor();
    } else {
      var parsed;
      try {
        parsed = JSON.parse(editor.value);
      } catch (error) {
        setSyntax("error", "JSON 语法错误，修正后才能切回表单");
        return;
      }
      model = parsed;
      $("form-wrap").hidden = false;
      $("json-wrap").hidden = true;
      view = "form";
      renderForm();
      updateCursor();
      changed();
    }

    document.querySelectorAll("[data-view]").forEach(function (button) {
      button.setAttribute("aria-pressed", String(button.dataset.view === view));
    });
    setSyntax("ok", "JSON 有效");
    updateDirty();
  }

  document.querySelectorAll("[data-view]").forEach(function (button) {
    button.addEventListener("click", function () {
      if (view === button.dataset.view) return;
      setView(button.dataset.view);
    });
  });

  /* 表单事件 */
  formHost.addEventListener("click", function (event) {
    if (!RULES.writable) return;
    var button = event.target.closest("[data-act]");
    if (!button) return;
    var act = button.dataset.act;
    var path = parsePath(button);

    if (act === "del") {
      deleteAt(path);
      changed();
      renderForm();
    } else if (act === "del-item") {
      var parent = getAt(path.slice(0, -1));
      parent.splice(path[path.length - 1], 1);
      changed();
      renderForm();
    } else if (act === "up" || act === "down") {
      moveItem(path, act === "up" ? -1 : 1);
      changed();
      renderForm();
    } else if (act === "add-key") {
      var addRow = button.closest(".add-row");
      var keyInput = addRow.querySelector('[data-role="new-key"]');
      var typeSelect = addRow.querySelector('[data-role="new-type"]');
      var parentPath = parsePath(addRow);
      var target = getAt(parentPath);
      var key = keyInput.value.trim();
      if (!key) { keyInput.focus(); return; }
      if (Object.prototype.hasOwnProperty.call(target, key)) {
        log("字段 " + key + " 已存在", "error");
        return;
      }
      target[key] = defaultValue(typeSelect.value);
      changed();
      renderForm();
    } else if (act === "add-item") {
      var itemRow = button.closest(".add-row");
      var itemType = itemRow.querySelector('[data-role="item-type"]');
      var arrayPath = parsePath(itemRow);
      getAt(arrayPath).push(defaultValue(itemType.value));
      changed();
      renderForm();
    }
  });

  formHost.addEventListener("input", function (event) {
    if (!RULES.writable) return;
    var target = event.target;
    var act = target.dataset.act;
    if (act !== "string" && act !== "number") return;
    var path = parsePath(target);
    if (act === "number") {
      if (target.value === "") return;
      var number = Number(target.value);
      if (Number.isNaN(number)) return;
      setAt(path, number);
    } else {
      setAt(path, target.value);
    }
    changed();
  });

  formHost.addEventListener("change", function (event) {
    if (!RULES.writable) return;
    var target = event.target;

    if (target.dataset.act === "bool") {
      setAt(parsePath(target), target.checked);
      var text = target.parentElement.querySelector('[data-role="bool-text"]');
      if (text) text.textContent = target.checked ? "true" : "false";
      changed();
      return;
    }

    if (target.dataset.role === "key") {
      var path = parsePath(target);
      var nextKey = target.value.trim();
      if (!renameAt(path, nextKey)) {
        log("字段名不能为空或与已有字段重复", "error");
      }
      changed();
      renderForm();
    }
  });

  /* JSON 视图 */
  editor.addEventListener("input", function () {
    renderGutter();
    try {
      model = JSON.parse(editor.value);
      setSyntax("ok", "JSON 有效");
      $("count-value").textContent = "未校验";
    } catch (error) {
      setSyntax("error", "JSON 语法错误");
    }
    updateDirty();
    updateCursor();
  });

  editor.addEventListener("scroll", function () {
    gutter.scrollTop = editor.scrollTop;
  });

  editor.addEventListener("keyup", updateCursor);
  editor.addEventListener("click", updateCursor);

  editor.addEventListener("keydown", function (event) {
    if ((event.metaKey || event.ctrlKey) && event.key === "s") {
      event.preventDefault();
      if (!$("save").disabled) $("save").click();
    }
  });

  function ensureObjectModel() {
    if (isObject(model)) return true;
    setResult("config 必须是 JSON 对象。", "error");
    log("config 不是对象，操作已阻止", "error");
    return false;
  }

  function readModelFromView() {
    if (view !== "json") return true;
    try {
      model = JSON.parse(editor.value);
      renderForm();
      return true;
    } catch (error) {
      setSyntax("error", "JSON 语法错误，无法继续");
      return false;
    }
  }

  $("validate").addEventListener("click", function () {
    if (!readModelFromView()) {
      setResult("JSON 语法错误，无法校验。", "error");
      log("校验失败：JSON 语法错误", "error");
      return;
    }
    if (!ensureObjectModel()) return;

    validating = true;
    $("validate").disabled = true;
    setResult("正在校验…", "");
    setTimeout(function () {
      validating = false;
      $("validate").disabled = false;
      /* 示例只模拟 valid；count 由真实接口返回，前端不编造 */
      $("count-value").textContent = "—";
      setResult("校验通过（示例未返回条目数）", "ok");
      log("校验通过（示例未返回条目数）", "ok");
      $("sr-status").textContent = "规则校验通过";
    }, 420);
  });

  $("save").addEventListener("click", function () {
    if (!RULES.writable || $("save").disabled) return;
    if (!readModelFromView()) {
      setResult("JSON 语法错误，无法保存。", "error");
      log("保存失败：JSON 语法错误", "error");
      return;
    }
    if (!ensureObjectModel()) return;

    var token = $("token").value.trim();
    if (!token) {
      log("保存失败：缺少管理令牌", "error");
      $("token").focus();
      return;
    }

    $("save").disabled = true;
    setResult("正在保存…", "");
    setTimeout(function () {
      if (token !== "admin-token") {
        setResult("保存失败：管理令牌无效（403）。", "error");
        log("保存失败：令牌无效（403）", "error");
        $("sr-status").textContent = "保存失败，令牌无效";
        updateDirty();
        return;
      }

      savedSnapshot = JSON.stringify(model);
      RULES.config = clone(model);
      RULES.revision = "rev-2026-1113-" + Math.random().toString(16).slice(2, 6);
      renderMeta();
      if (view === "json") {
        editor.value = pretty(model);
        renderGutter();
      }
      updateDirty();
      setResult("已保存 · " + RULES.revision, "ok");
      log("保存成功，revision 更新为 " + RULES.revision, "ok");
      $("sr-status").textContent = "规则已保存";
    }, 520);
  });

  $("reset").addEventListener("click", function () {
    if (JSON.stringify(model) === savedSnapshot) return;
    model = JSON.parse(savedSnapshot);
    if (view === "json") {
      editor.value = pretty(model);
      renderGutter();
      updateCursor();
    } else {
      renderForm();
    }
    setResult("");
    changed();
    log("已撤销未保存修改");
    $("sr-status").textContent = "已撤销修改";
  });

  $("copy").addEventListener("click", function () {
    var text = pretty(model);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        log("JSON 已复制到剪贴板");
      }).catch(function () {
        log("复制失败，请手动选择", "error");
      });
    } else {
      log("当前环境不支持复制，请手动选择", "error");
    }
  });

  $("token").addEventListener("input", function () {
    updateDirty();
    setResult("");
  });

  $("refresh").addEventListener("click", function () {
    var button = $("refresh");
    button.disabled = true;
    setTimeout(function () {
      savedSnapshot = JSON.stringify(RULES.config);
      model = clone(RULES.config);
      if (view === "json") {
        editor.value = pretty(model);
        renderGutter();
        updateCursor();
      } else {
        renderForm();
      }
      renderMeta();
      changed();
      button.disabled = false;
      log("已重新读取规则配置");
      $("sr-status").textContent = "已刷新";
    }, 380);
  });

  document.querySelectorAll(".nav-item[data-page]").forEach(function (item) {
    item.addEventListener("click", function (event) {
      event.preventDefault();
      var name = item.dataset.page;
      $("page-title").textContent = name;
      $("ph-title").textContent = name;
      $("rules-shell").hidden = true;
      $("view-placeholder").hidden = false;
      document.querySelectorAll(".nav-item").forEach(function (nav) {
        nav.classList.toggle("is-active", nav === item);
        if (nav === item) nav.setAttribute("aria-current", "page");
        else nav.removeAttribute("aria-current");
      });
    });
  });

  $("ph-back").addEventListener("click", function () {
    $("page-title").textContent = "规则";
    $("rules-shell").hidden = false;
    $("view-placeholder").hidden = true;
    document.querySelectorAll(".nav-item").forEach(function (nav) {
      var active = nav.getAttribute("href") === "rules.html";
      nav.classList.toggle("is-active", active);
      if (active) {
        nav.setAttribute("aria-current", "page");
        nav.focus();
      } else {
        nav.removeAttribute("aria-current");
      }
    });
  });

  renderForm();
  renderMeta();
  updateCursor();
  log("已加载前置规则配置（示例 config 为空对象）· 演示令牌 admin-token");
})();
</script>
</body>
</html>
