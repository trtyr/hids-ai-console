<link rel="stylesheet" href="assets/fonts/fonts.css" />
<script src="assets/theme.js"></script>
<style>
/* ============================================================
   布局基础（结构层，勿改优先级）
   ============================================================ */
@layer od-layout {
  [hidden]:not([hidden="until-found" i]) { display: none !important; }
  dialog:not([open]) { display: none !important; }

  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }

  /* containers */
  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }

  /* stacked information: each piece is its own line — never sibling inline spans */
  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }

  /* media keeps its intrinsic ratio by default; never a distorted or cropped
     cover by accident. height:auto lets the ratio win over an <img height="…">
     attribute. Cropping to a uniform box is an explicit opt-in: set --od-ratio
     AND add .od-media-cover together (per the core rule, only where a crop is
     deliberate — tile thumbs, decorative fills — never on full-frame content). */
  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }

  /* functional inline SVG icons opt into bounded geometry; content SVGs keep their own */
  .od-icon { display: inline-block; inline-size: var(--od-icon-size, 1em); block-size: var(--od-icon-size, 1em); flex: none; }

  /* data text only — authored copy is rewritten to its budget instead */
  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-lines-2 { min-height: calc(2 * 1.4em); }   /* block-level reservation for a shared baseline */
  .od-nowrap  { white-space: nowrap; }           /* 数字+单位 · 价格+起 · 日期+星期 */
  .od-keep    { word-break: keep-all; overflow-wrap: anywhere; } /* CJK labels break at spaces / <wbr> first */

  /* screen skeleton (optional): bars take their own space, the middle scrolls — no padding guessed for chrome */
  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }

  /* horizontal rail: the next item peeks at the edge; trailing room survives overflow */
  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
             padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
  :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }

  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch  { min-width: 44px; min-height: 44px; }
}
:root [hidden]:where(:not([hidden="until-found" i])) { display: none; }
/* /OD-LAYOUT-PRIMITIVES v1 */

/* ============================================================
   Design tokens
   ============================================================ */
:root {





  --font-ui: "SpaceGrotesk", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --font-mono: "JetBrainsMono", ui-monospace, SFMono-Regular, Menlo, Consolas, "PingFang SC", "Microsoft YaHei", monospace;

  --dur: 160ms;
  --ease: cubic-bezier(.2, .7, .3, 1);
}

* { box-sizing: border-box; }

html { height: 100%; }

body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 13px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

::selection { background: var(--selection-bg); color: var(--selection-text); }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.mono { font-family: var(--font-mono); font-feature-settings: "tnum" 1; }

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

/* ---------- frame ---------- */
.app {
  display: grid;
  grid-template-columns: 196px minmax(0, 1fr);
  min-height: 100dvh;
}

/* ---------- left rail ---------- */
.rail {
  position: sticky;
  top: 0;
  height: 100dvh;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  background: var(--bg-rail);
  border-right: 1px solid var(--line);
}
.rail-brand {
  display: flex;
  align-items: center;
  gap: 9px;
  height: 52px;
  padding: 0 16px;
  border-bottom: 1px solid var(--line);
  min-width: 0;
}
.rail-mark { width: 22px; height: 22px; color: var(--accent); flex: none; }
.rail-name { font-size: 13px; font-weight: 700; letter-spacing: .16em; color: var(--text); }
.rail-sub { font-size: 10px; letter-spacing: .04em; color: var(--text-3); white-space: nowrap; }

.nav { padding: 10px 0; overflow-y: auto; }
.nav-item {
  display: flex;
  align-items: center;
  gap: 9px;
  height: 34px;
  padding: 0 16px;
  color: var(--text-2);
  font-size: 12.5px;
  text-decoration: none;
  white-space: nowrap;
  transition: color var(--dur) var(--ease), background-color var(--dur) var(--ease);
}
.nav-item .od-icon { --od-icon-size: 15px; color: var(--text-3); }
.nav-item:hover { color: var(--text); background: var(--bg-hover); }
.nav-item:hover .od-icon { color: var(--text-2); }
.nav-item.is-active {
  color: var(--text);
  background: var(--bg-active);
}
.nav-item.is-active .od-icon { color: var(--accent); }

.rail-foot { border-top: 1px solid var(--line); }
.who {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 12px 16px;
  min-width: 0;
}
.avatar {
  display: grid;
  place-items: center;
  width: 22px;
  height: 22px;
  flex: none;
  border: 1px solid var(--line-2);
  border-radius: 50%;
  color: var(--text-2);
  font-size: 10.5px;
}
.who-name { display: block; font-size: 12px; color: var(--text); }
.who-role { display: block; font-size: 10px; color: var(--text-3); }

/* ---------- main ---------- */
.main { min-width: 0; }

.bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  height: 52px;
  padding: 0 28px;
  border-bottom: 1px solid var(--line);
}
.bar h1 {
  margin: 0;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -.01em;
}
.bar-right { display: flex; align-items: center; gap: 18px; }
.stamp { font-size: 10.5px; color: var(--text-3); letter-spacing: .02em; }
.stamp b { color: var(--text-2); font-weight: 500; }

.textbtn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 26px;
  padding: 0;
  border: 0;
  background: none;
  color: var(--text-2);
  font-family: inherit;
  font-size: 11.5px;
  cursor: pointer;
  transition: color var(--dur) var(--ease);
}
.textbtn:hover { color: var(--accent); }
.textbtn .od-icon { --od-icon-size: 13px; }
.textbtn.is-loading .od-icon { animation: spin .8s linear infinite; }
.textbtn:disabled { color: var(--text-3); cursor: default; }

.sep-v { width: 1px; height: 16px; background: var(--line); }

.content { padding: 0 28px 32px; transition: opacity var(--dur) var(--ease); }
.content.is-busy { opacity: .55; }

/* ---------- summary ---------- */
.summary {
  display: flex;
  align-items: center;
  gap: 32px;
  padding: 18px 0;
  border-bottom: 1px solid var(--line);
  flex-wrap: wrap;
}
.nums {
  display: flex;
  align-items: stretch;
  min-width: 0;
}
.num {
  display: grid;
  gap: 1px;
  margin: 0;
  padding: 0 22px;
  border-left: 1px solid var(--line);
}
.num:first-child { padding-left: 0; border-left: 0; }
.num dt { font-size: 10.5px; color: var(--text-3); }
.num dd {
  margin: 0;
  font-size: 23px;
  font-weight: 500;
  line-height: 1.2;
  letter-spacing: -.025em;
  font-variant-numeric: tabular-nums;
  color: var(--text);
}
.num.is-warn dd { color: var(--warn); }
.num.is-danger dd { color: var(--danger); }

.compose { margin-left: auto; flex: 1 1 320px; max-width: 520px; display: grid; gap: 6px; }
.compose-label { font-size: 10px; letter-spacing: .06em; color: var(--text-3); }
.compose-bar { display: flex; gap: 2px; height: 8px; }
.compose-seg { flex: 1 1 0; min-width: 2px; background: var(--accent); border-radius: 1px; }
.compose-meta { margin: 0; font-size: 10.5px; color: var(--text-3); font-variant-numeric: tabular-nums; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

/* ---------- layout ---------- */
.layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 300px;
  column-gap: 56px;
  align-items: start;
}

/* ---------- section head ---------- */
.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
  padding: 22px 0 8px;
  flex-wrap: wrap;
}
.section-head h2 {
  margin: 0;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .02em;
  color: var(--text-2);
}
.section-head .meta { font-size: 10.5px; color: var(--text-3); }
.module-head .meta { font-size: 10.5px; color: var(--text-3); }

/* ---------- type table ---------- */
.type-table { width: 100%; border-collapse: collapse; }
.type-table thead th {
  padding: 7px 0;
  border-bottom: 1px solid var(--line);
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: .04em;
  color: var(--text-3);
  text-align: left;
}
.type-table thead th.col-num,
.type-table thead th.col-share { text-align: right; }
.type-table td {
  padding: 8px 0;
  border-bottom: 1px solid var(--line);
  font-size: 12px;
  color: var(--text-2);
}
.type-table td.col-name { color: var(--text); }
.col-num { text-align: right; font-variant-numeric: tabular-nums; color: var(--text); width: 72px; }
.col-share { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-3); width: 60px; }
.col-bar { width: 38%; padding-left: 28px; }

.bar-track {
  display: block;
  height: 4px;
  background: var(--bar-track);
}
.bar-fill {
  display: block;
  height: 100%;
  background: var(--accent);
  opacity: .6;
}

/* ---------- progress band ---------- */
.progress-band {
  margin-top: 20px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
}
.progress-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  padding-bottom: 8px;
}
.progress-head h2 { margin: 0; font-size: 12px; font-weight: 600; color: var(--text-2); }
.progress-head .meta { font-size: 10.5px; color: var(--text-3); }
.progress-bar { display: flex; gap: 2px; height: 10px; }
.progress-seg { flex: 1 1 0; min-width: 3px; border-radius: 1px; }
.progress-seg.is-done { background: var(--accent); opacity: .45; }
.progress-seg.is-queued { background: var(--warn); opacity: .8; }
.progress-seg.is-running { background: var(--accent); }
.progress-seg.is-failed { background: var(--danger); }
.progress-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 24px;
  margin: 10px 0 0;
  padding: 0;
  list-style: none;
  font-size: 11px;
  color: var(--text-3);
}
.progress-legend li { display: flex; align-items: center; gap: 6px; }
.progress-legend .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; background: var(--text-3); }
.progress-legend .dot.is-done { background: var(--accent); opacity: .45; }
.progress-legend .dot.is-queued { background: var(--warn); opacity: .8; }
.progress-legend .dot.is-running { background: var(--accent); }
.progress-legend .dot.is-failed { background: var(--danger); }
.progress-legend b { font-weight: 500; color: var(--text); font-variant-numeric: tabular-nums; }
.progress-legend .share { color: var(--text-3); font-variant-numeric: tabular-nums; }

/* ---------- side modules ---------- */
.side { padding-top: 4px; }
.module + .module { margin-top: 30px; }

.module-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line);
}
.module-head h2 {
  margin: 0;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .02em;
  color: var(--text-2);
}
.module-head .textbtn { font-size: 11px; }

.kv { margin: 0; padding: 0; }
.kv-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
  padding: 8px 0;
  border-bottom: 1px solid var(--line);
  font-size: 12px;
}
.kv-row dt { color: var(--text-3); }
.kv-row dd { margin: 0; color: var(--text); font-variant-numeric: tabular-nums; }
.kv-row dd strong { font-weight: 500; }
.kv-row.is-strong dd { font-size: 14px; }

.state {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--text);
}
.state::before {
  content: "";
  width: 5px;
  height: 5px;
  background: var(--accent);
  flex: none;
}
.state.is-paused { color: var(--warn); }
.state.is-paused::before { background: var(--warn); }

/* ---------- notice ---------- */
.notice {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 9px 0;
  border-bottom: 1px solid var(--line);
  color: var(--text-2);
  font-size: 11.5px;
  line-height: 1.6;
}
.notice .od-icon { --od-icon-size: 13px; color: var(--warn); margin-top: 2px; }
.notice strong { color: var(--text); font-weight: 600; }

/* ---------- placeholder ---------- */
.placeholder {
  display: grid;
  place-items: center;
  min-height: 46vh;
  text-align: center;
}
.placeholder h2 { margin: 0; font-size: 14px; font-weight: 600; }
.placeholder p { margin: 6px 0 0; font-size: 12px; color: var(--text-3); }
.placeholder .textbtn { margin-top: 18px; font-size: 12px; }

/* ---------- motion ---------- */
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- responsive ---------- */
@media (max-width: 1100px) {
  .app { grid-template-columns: 56px minmax(0, 1fr); }
  .rail-brand { justify-content: center; padding: 0; }
  .rail-name, .rail-sub, .nav-item .label, .who-meta { display: none; }
  .nav-item { justify-content: center; padding: 0; }
  .who { justify-content: center; padding: 12px 0; }
  .content { padding: 0 20px 24px; }
  .bar { padding: 0 20px; }
  .layout { grid-template-columns: minmax(0, 1fr) 260px; column-gap: 36px; }
}

@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail {
    position: static;
    height: auto;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 16px;
    border-right: 0;
    border-bottom: 1px solid var(--line);
    overflow: visible;
  }
  .rail-brand { height: 46px; border-bottom: 0; }
  .nav { display: flex; gap: 0; padding: 0; overflow-x: auto; scrollbar-width: none; }
  .nav::-webkit-scrollbar { display: none; }
  .nav-item { height: 46px; padding: 0 11px; border-bottom: 2px solid transparent; flex: none; }
  .nav-item.is-active { border-bottom-color: var(--accent); background: var(--bg-active); }
  .nav-item .label { display: inline; }
  .rail-foot { display: flex; align-items: center; margin-left: auto; border-top: 0; }
  .who { display: none; }
  .rail-foot .nav-item { height: 46px; }
  .bar { height: 46px; }
}

@media (max-width: 820px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .side { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 32px; }
  .module + .module { margin-top: 0; }
}

@media (max-width: 760px) {
  .summary { gap: 14px; padding: 14px 0; }
  .num { padding: 0 16px; }
  .num dd { font-size: 20px; }
  .col-bar { display: none; }
  .bar-right { gap: 12px; }
  .stamp { display: none; }
  .textbtn { min-height: 40px; }
}

@media (max-width: 620px) {
  .content { padding: 0 14px 24px; }
  .bar { padding: 0 14px; }
  .nums { width: 100%; display: grid; grid-template-columns: 1fr 1fr; row-gap: 12px; }
  .num { padding: 0 14px; }
  .num:nth-child(odd) { padding-left: 0; border-left: 0; }
  .side { grid-template-columns: minmax(0, 1fr); row-gap: 26px; }
  .type-table td, .type-table thead th { font-size: 11.5px; }
  .col-num { width: 56px; }
  .col-share { width: 52px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    transition-duration: .001ms !important;
  }
}
</style>
</head>

      </a>
      <a class="nav-item" href="alerts.html">
        <svg class="od-icon" viewBox="0 0 20 20" aria-hidden="true">

      <a class="nav-item" href="wiki.html">
        <svg class="od-icon" viewBox="0 0 20 20" aria-hidden="true">
          <path d="M3.4 4.4c2.6-1 4.8-.7 6.6.7 1.8-1.4 4-1.7 6.6-.7v10.3c-2.6-1-4.8-.7-6.6.7-1.8-1.4-4-1.7-6.6-.7z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" />
          <path d="M10 5.4v9.6" stroke="currentColor" stroke-width="1.3" />
        </svg>
        <span class="label">知识库</span>
      </a>
    </nav>

    <div class="rail-foot">
      <div class="who">
        <span class="avatar" aria-hidden="true">H</span>
        <span class="who-meta">
          <span class="who-name mono">hids</span>
          <span class="who-role">值守账号</span>
        </span>
      </div>
      <a class="nav-item" href="index.html">
        <svg class="od-icon" viewBox="0 0 20 20" aria-hidden="true">
          <path d="M8 3.4H4.6v13.2H8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M11.4 10h5.2M14 7.4 16.6 10 14 12.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span class="label">退出登录</span>
      </a>
    </div>
  </aside>

  <div class="main">
    <header class="bar">
      <h1 id="page-title">总览</h1>
      <div class="bar-right">
        <span class="stamp"><b class="mono" id="checked-at">—</b> 更新</span>
        <span class="sep-v" aria-hidden="true"></span>
        <button type="button" class="textbtn" id="refresh">
          <svg class="od-icon" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M13.2 8a5.2 5.2 0 1 1-1.6-3.7" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
            <path d="M13.4 2.6v2.9h-2.9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          刷新
        </button>
        <span class="sep-v" aria-hidden="true"></span>
        <button type="button" class="theme-toggle" data-theme-toggle>
          <svg class="icon-sun" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.3" />
            <path d="M8 1.6v1.6M8 12.8v1.6M1.6 8h1.6M12.8 8h1.6M3.5 3.5l1.1 1.1M11.4 11.4l1.1 1.1M12.5 3.5l-1.1 1.1M4.6 11.4l-1.1 1.1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
          </svg>
          <svg class="icon-moon" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M13.2 9.6A5.6 5.6 0 0 1 6.4 2.8a5.6 5.6 0 1 0 6.8 6.8z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" />
          </svg>
          <span data-theme-label>浅色</span>
        </button>
      </div>
    </header>

    <div class="content" id="content">
      <div id="view-dashboard">
        <div id="partial-notice" class="notice" hidden>
          <svg class="od-icon" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M8 2.4 14.4 13.6H1.6z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" />
            <path d="M8 6.4v3.1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
            <circle cx="8" cy="11.6" r=".7" fill="currentColor" />
          </svg>
          <span><strong>部分类型查询失败</strong>，总数只合计成功的类型；<span id="partial-reason">—</span></span>
        </div>

        <section class="summary" aria-label="告警概况">
          <div class="nums">
            <dl class="num">
              <dt>告警总数</dt>
              <dd id="stat-total">—</dd>
            </dl>
            <dl class="num is-warn">
              <dt>待研判</dt>
              <dd id="stat-queued">—</dd>
            </dl>
            <dl class="num">
              <dt>研判中</dt>
              <dd id="stat-running">—</dd>
            </dl>
            <dl class="num is-danger">
              <dt>失败</dt>
              <dd id="stat-failed">—</dd>
            </dl>
          </div>

          <div class="compose">
            <span class="compose-label">类型构成</span>
            <div class="compose-bar" id="compose-bar" aria-hidden="true"></div>
            <p class="compose-meta" id="compose-meta">—</p>
          </div>
        </section>

        <div class="layout">
          <section aria-labelledby="types-title">
            <div class="section-head">
              <h2 id="types-title">事件类型</h2>
              <span class="meta" id="types-meta">—</span>
            </div>
            <table class="type-table">
              <caption class="sr-only">按事件类型统计的告警数量与占比</caption>
              <thead>
                <tr>
                  <th scope="col">类型</th>
                  <th scope="col" class="col-num">数量</th>
                  <th scope="col" class="col-share">占比</th>
                  <th scope="col" class="col-bar">分布</th>
                </tr>
              </thead>
              <tbody id="types-body"></tbody>
            </table>
          </section>

          <aside class="side">
            <section class="module" aria-labelledby="queue-title">
              <div class="module-head">
                <h2 id="queue-title">自动研判</h2>
                <button type="button" class="textbtn" id="queue-toggle">暂停</button>
              </div>
              <dl class="kv">
                <div class="kv-row"><dt>状态</dt><dd><span class="state" id="queue-state-text">运行中</span></dd></div>
                <div class="kv-row"><dt>输入方式</dt><dd id="queue-mode">—</dd></div>
                <div class="kv-row"><dt>最近轮询</dt><dd class="mono" id="queue-poll">—</dd></div>
                <div class="kv-row is-strong"><dt>待研判</dt><dd id="q-queued">—</dd></div>
                <div class="kv-row"><dt>研判中</dt><dd id="q-running">—</dd></div>
                <div class="kv-row"><dt>已完成</dt><dd id="q-done">—</dd></div>
                <div class="kv-row"><dt>失败</dt><dd id="q-failed">—</dd></div>
                <div class="kv-row"><dt>最近错误</dt><dd id="queue-error">—</dd></div>
              </dl>
            </section>

            <section class="module" aria-labelledby="env-title">
              <div class="module-head">
                <h2 id="env-title">运行状态</h2>
                <span class="meta" id="version">—</span>
              </div>
              <dl class="kv">
                <div class="kv-row"><dt>牧云连接</dt><dd id="sys-cloud">—</dd></div>
                <div class="kv-row"><dt>研判模型</dt><dd id="sys-agent">—</dd></div>
                <div class="kv-row"><dt>规则版本</dt><dd class="mono" id="sys-rules">—</dd></div>
                <div class="kv-row"><dt>取证工具</dt><dd id="sys-tools">—</dd></div>
                <div class="kv-row"><dt>提示词版本</dt><dd class="mono" id="sys-prompt">—</dd></div>
              </dl>
            </section>
          </aside>
        </div>

        <section class="progress-band" aria-label="研判进度">
          <div class="progress-head">
            <h2>研判进度</h2>
            <span class="meta" id="progress-meta">—</span>
          </div>
          <div class="progress-bar" id="progress-bar" aria-hidden="true"></div>
          <ul class="progress-legend" id="progress-legend"></ul>
        </section>
      </div>

      <div id="view-placeholder" hidden>
        <div class="placeholder">
          <div>
            <h2 id="ph-title">告警</h2>
            <p>该页面尚未定稿，将在后续设计中补齐。</p>
            <button type="button" class="textbtn" id="ph-back">返回总览</button>
          </div>
        </div>
      </div>

      <p class="sr-only" id="sr-status" role="status" aria-live="polite"></p>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var TYPE_LABELS = {
    webshell: "网站后门",
    malware: "恶意程序",
    revshell: "反弹 Shell",
    memory_webshell: "内存马",
    brute_force: "暴力破解",
    abnormal_login: "异常登录",
    elevation_process: "提权进程",
    network_audit: "网络审计",
    suspicious_operation: "可疑操作",
    honeypot: "蜜罐",
    memory_security: "内存安全"
  };

  /* 示例数据：字段与 /api/overview 对齐，接真实接口时整体替换 */
  /* 接口响应形状：/api/status、/api/agent/status、/api/triage/rules、/api/updates */
  var SYSTEM = {
    status: { configured: true, connected: true },
    agent: { configured: true, prompt_version: "p-2026.11" },
    tools: { provider: "cloudwalker", readOnly: true, count: 28 },
    rules: { revision: "rev-2026-1113", writable: false },
    updates: { revision: "v2026-11-13" }
  };

  var DATA = {
    partial: false,
    failedTypes: [],
    totals: {
      webshell: 42,
      malware: 17,
      revshell: 9,
      memory_webshell: 6,
      brute_force: 128,
      abnormal_login: 24,
      elevation_process: 11,
      network_audit: 63,
      suspicious_operation: 31,
      honeypot: 12,
      memory_security: 4
    },
    triage: {
      enabled: true,
      input_mode: "syslog",
      last_poll_at: "2026-11-13 09:38:52",
      counts: { queued: 12, running: 3, done: 331, failed: 1 },
      last_error: null
    }
  };

  var $ = function (id) { return document.getElementById(id); };

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  var typesBody = $("types-body");
  var checkedAt = $("checked-at");
  var content = $("content");
  var refreshBtn = $("refresh");
  var pageTitle = $("page-title");
  var viewDashboard = $("view-dashboard");
  var viewPlaceholder = $("view-placeholder");
  var srStatus = $("sr-status");

  function pad(n) { return n < 10 ? "0" + n : String(n); }

  function stamp() {
    var d = new Date();
    return pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
  }

  function totalOf(totals) {
    var sum = 0;
    Object.keys(totals).forEach(function (key) {
      if (typeof totals[key] === "number") sum += totals[key];
    });
    return sum;
  }

  function sortedTypes() {
    return Object.keys(DATA.totals).map(function (key) {
      return { key: key, label: TYPE_LABELS[key] || key, count: DATA.totals[key] };
    }).filter(function (item) {
      return typeof item.count === "number";
    }).sort(function (a, b) {
      return b.count - a.count;
    });
  }

  function renderSummary() {
    var c = DATA.triage.counts;
    $("stat-total").textContent = String(totalOf(DATA.totals));
    $("stat-queued").textContent = String(c.queued);
    $("stat-running").textContent = String(c.running);
    $("stat-failed").textContent = String(c.failed);

    $("partial-notice").hidden = !DATA.partial;
    if (DATA.partial) {
      $("partial-reason").textContent = DATA.failedTypes.length
        ? DATA.failedTypes.join("、")
        : "接口未返回具体原因";
    }
  }

  function renderCompose() {
    var entries = sortedTypes();
    var total = totalOf(DATA.totals);
    var max = entries.length ? entries[0].count : 1;
    $("compose-bar").innerHTML = entries.map(function (item) {
      var opacity = (0.35 + (item.count / (max || 1)) * 0.55).toFixed(2);
      return '<span class="compose-seg" style="flex:' + item.count + ' 1 0;opacity:' + opacity + '" title="' +
        escapeHtml(item.label) + " " + item.count + '"></span>';
    }).join("");
    $("compose-meta").textContent = total
      ? entries.slice(0, 3).map(function (item) { return item.label + " " + item.count; }).join(" · ")
      : "接口未返回类型统计。";
  }

  function renderProgress() {
    var c = DATA.triage.counts;
    var total = c.done + c.queued + c.running + c.failed;
    var items = [
      { key: "done", label: "已完成", count: c.done },
      { key: "queued", label: "待研判", count: c.queued },
      { key: "running", label: "研判中", count: c.running },
      { key: "failed", label: "失败", count: c.failed }
    ];
    $("progress-meta").textContent = total
      ? "共 " + total + " 个任务 · 完成率 " + Math.round((c.done / total) * 100) + "%"
      : "接口未返回队列计数。";
    $("progress-bar").innerHTML = items.map(function (item) {
      if (!item.count) return "";
      return '<span class="progress-seg is-' + item.key + '" style="flex:' + item.count + ' 1 0"></span>';
    }).join("");
    $("progress-legend").innerHTML = items.map(function (item) {
      var share = total ? Math.round((item.count / total) * 100) : 0;
      return '<li><span class="dot is-' + item.key + '"></span>' + item.label +
        ' <b>' + item.count + '</b> <span class="share">' + share + '%</span></li>';
    }).join("");
  }

  function renderTypes() {
    var total = totalOf(DATA.totals);
    var list = sortedTypes();
    var max = list.length ? list[0].count : 1;

    $("types-meta").textContent = list.length + " 类 · 合计 " + total;

    typesBody.innerHTML = list.map(function (item) {
      var share = total ? Math.round((item.count / total) * 100) : 0;
      var width = max ? Math.max(2, Math.round((item.count / max) * 100)) : 0;
      return '<tr>' +
        '<td class="col-name">' + item.label + '</td>' +
        '<td class="col-num">' + item.count + '</td>' +
        '<td class="col-share">' + share + '%</td>' +
        '<td class="col-bar"><span class="bar-track"><span class="bar-fill" style="width:' + width + '%"></span></span></td>' +
        '</tr>';
    }).join("");
  }

  function renderQueue() {
    var q = DATA.triage;
    var paused = !q.enabled;
    var stateEl = $("queue-state-text");

    stateEl.textContent = paused ? "已暂停" : "运行中";
    stateEl.classList.toggle("is-paused", paused);
    $("queue-toggle").textContent = paused ? "恢复" : "暂停";

    $("queue-mode").textContent = q.input_mode === "poll" ? "轮询拉取" : "Syslog 推入";
    $("queue-poll").textContent = q.last_poll_at || "—";
    $("queue-error").textContent = q.last_error || "无";
    $("q-queued").textContent = String(q.counts.queued);
    $("q-running").textContent = String(q.counts.running);
    $("q-done").textContent = String(q.counts.done);
    $("q-failed").textContent = String(q.counts.failed);
  }

  function renderSystem() {
    var cloud = SYSTEM.status.connected ? "已连接" : "未连接";
    var agent = SYSTEM.agent.configured ? "已就绪" : "未配置";
    $("sys-cloud").textContent = cloud;
    $("sys-agent").textContent = agent;
    $("sys-rules").textContent = SYSTEM.rules.revision || "—";
    $("sys-tools").textContent = SYSTEM.tools && SYSTEM.tools.count ? SYSTEM.tools.count + " 个" : "—";
    $("sys-prompt").textContent = SYSTEM.agent.prompt_version || "—";
    $("version").textContent = SYSTEM.updates.revision || "—";
  }

  function renderAll() {
    checkedAt.textContent = stamp();
    renderSystem();
    renderSummary();
    renderCompose();
    renderTypes();
    renderQueue();
    renderProgress();
  }

  function showPage(name) {
    var isOverview = name === "总览";
    pageTitle.textContent = isOverview ? "总览" : name;
    viewDashboard.hidden = !isOverview;
    viewPlaceholder.hidden = isOverview;

    if (!isOverview) $("ph-title").textContent = name;

    document.querySelectorAll(".nav-item[data-page]").forEach(function (item) {
      var active = item.dataset.page === name;
      item.classList.toggle("is-active", active);
      if (active) {
        item.setAttribute("aria-current", "page");
      } else {
        item.removeAttribute("aria-current");
      }
    });
  }

  document.querySelectorAll(".nav-item[data-page]").forEach(function (item) {
    item.addEventListener("click", function (event) {
      if (item.getAttribute("href") === "overview.html") {
        showPage("总览");
        return;
      }
      event.preventDefault();
      showPage(item.dataset.page);
    });
  });

  $("ph-back").addEventListener("click", function () {
    showPage("总览");
    document.querySelector('.nav-item[data-page="总览"]').focus();
  });

  refreshBtn.addEventListener("click", function () {
    if (refreshBtn.disabled) return;
    refreshBtn.disabled = true;
    refreshBtn.classList.add("is-loading");
    content.classList.add("is-busy");
    srStatus.textContent = "正在刷新";

    setTimeout(function () {
      renderAll();
      refreshBtn.disabled = false;
      refreshBtn.classList.remove("is-loading");
      content.classList.remove("is-busy");
      srStatus.textContent = "已更新，时间 " + checkedAt.textContent;
    }, 520);
  });

  $("queue-toggle").addEventListener("click", function () {
    DATA.triage.enabled = !DATA.triage.enabled;
    renderQueue();
    srStatus.textContent = DATA.triage.enabled ? "自动研判已恢复" : "自动研判已暂停";
  });

  renderAll();
})();
</script>
</body>
</html>
