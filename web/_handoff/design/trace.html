<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>深度溯源 · HIDS AI 研判平台</title>
<meta name="description" content="HIDS AI 研判平台深度溯源白板设计稿。" />
<link rel="stylesheet" href="assets/theme.css" />
<link rel="stylesheet" href="assets/fonts/fonts.css" />
<script src="assets/theme.js"></script>
<style>
@layer od-layout {
  [hidden]:not([hidden="until-found" i]) { display: none !important; }
  dialog:not([open]) { display: none !important; }

  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }

  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }

  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }

  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }

  .od-icon { display: inline-block; inline-size: var(--od-icon-size, 1em); block-size: var(--od-icon-size, 1em); flex: none; }

  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-lines-2 { min-height: calc(2 * 1.4em); }
  .od-nowrap  { white-space: nowrap; }
  .od-keep    { word-break: keep-all; overflow-wrap: anywhere; }

  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }

  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
             padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
  :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }

  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch  { min-width: 44px; min-height: 44px; }
}
:root [hidden]:where(:not([hidden="until-found" i])) { display: none; }

:root {
  --font-ui: "SpaceGrotesk", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --font-mono: "JetBrainsMono", ui-monospace, SFMono-Regular, Menlo, Consolas, "PingFang SC", "Microsoft YaHei", monospace;
  --dur: 160ms;
  --ease: cubic-bezier(.2, .7, .3, 1);
  --node-w: 220px;
  --node-h: 118px;
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 13px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

::selection { background: var(--selection-bg); color: var(--selection-text); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-feature-settings: "tnum" 1; }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0;
}

.app { display: grid; grid-template-columns: 196px minmax(0, 1fr); height: 100dvh; }

.rail {
  position: relative; height: 100dvh;
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
  background: var(--bg-rail); border-right: 1px solid var(--line);
}
.rail-brand {
  display: flex; align-items: center; gap: 9px; height: 52px;
  padding: 0 16px; border-bottom: 1px solid var(--line); min-width: 0;
}
.rail-mark { width: 22px; height: 22px; color: var(--accent); flex: none; }
.rail-name { font-size: 13px; font-weight: 700; letter-spacing: .16em; color: var(--text); }
.rail-sub { font-size: 10px; letter-spacing: .04em; color: var(--text-3); white-space: nowrap; }

.nav { padding: 10px 0; overflow-y: auto; }
.nav-item {
  display: flex; align-items: center; gap: 9px; height: 34px; padding: 0 16px;
  color: var(--text-2); font-size: 12.5px; text-decoration: none; white-space: nowrap;
  transition: color var(--dur) var(--ease), background-color var(--dur) var(--ease);
}
.nav-item .od-icon { --od-icon-size: 15px; color: var(--text-3); }
.nav-item:hover { color: var(--text); background: var(--bg-hover); }
.nav-item:hover .od-icon { color: var(--text-2); }
.nav-item.is-active { color: var(--text); background: var(--bg-active); }
.nav-item.is-active .od-icon { color: var(--accent); }

.rail-foot { border-top: 1px solid var(--line); }
.who { display: flex; align-items: center; gap: 9px; padding: 12px 16px; min-width: 0; }
.avatar {
  display: grid; place-items: center; width: 22px; height: 22px; flex: none;
  border: 1px solid var(--line-2); border-radius: 50%; color: var(--text-2); font-size: 10.5px;
}
.who-name { display: block; font-size: 12px; color: var(--text); }
.who-role { display: block; font-size: 10px; color: var(--text-3); }

.main { min-width: 0; height: 100dvh; display: grid; grid-template-rows: 52px minmax(0, 1fr); }

.bar {
  display: flex; align-items: center; justify-content: space-between; gap: 24px;
  height: 52px; padding: 0 24px; border-bottom: 1px solid var(--line);
}
.bar h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
.bar-right { display: flex; align-items: center; gap: 12px; }

.textbtn {
  display: inline-flex; align-items: center; gap: 5px; min-height: 26px;
  padding: 0; border: 0; background: none; color: var(--text-2);
  font-family: inherit; font-size: 11.5px; cursor: pointer; text-decoration: none;
  transition: color var(--dur) var(--ease);
}
.textbtn:hover:not(:disabled) { color: var(--accent); }
.textbtn:disabled { color: var(--text-3); cursor: default; }
.textbtn .od-icon { --od-icon-size: 13px; }
.sep-v { width: 1px; height: 16px; background: var(--line); }

.trace-shell {
  display: grid;
  grid-template-columns: 236px minmax(0, 1fr);
  min-height: 0;
}

/* ---------- board list ---------- */
.side {
  display: grid;
  grid-template-rows: auto auto minmax(0, 1fr) auto;
  border-right: 1px solid var(--line);
  min-height: 0;
}
.side-head {
  display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
  padding: 14px 16px 8px;
}
.side-head h2 { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .06em; color: var(--text-2); }
.side-head span { font-size: 10px; color: var(--text-3); }

.new-board { display: flex; gap: 6px; padding: 0 12px 12px; border-bottom: 1px solid var(--line); }
.new-board input {
  min-width: 0; flex: 1 1 auto; height: 30px; padding: 0 8px;
  border: 1px solid var(--line-2); border-radius: 2px;
  background: var(--bg-input); color: var(--text);
  font-family: inherit; font-size: 11.5px;
}
.new-board input::placeholder { color: var(--input-placeholder); }
.new-board input:focus { outline: none; border-color: var(--accent); }
.new-board button {
  flex: none; height: 30px; padding: 0 10px;
  border: 1px solid var(--line-2); border-radius: 2px;
  background: var(--accent); color: var(--accent-ink);
  font-family: inherit; font-size: 11.5px; font-weight: 600; cursor: pointer;
}
.new-board button:hover { background: var(--accent-hover); }

.board-list { list-style: none; margin: 0; padding: 6px 0; overflow-y: auto; min-height: 0; }
.board-list .muted { padding: 0 16px; }
.board-item {
  display: block; width: 100%; text-align: left; padding: 9px 16px;
  border: 0; border-left: 2px solid transparent; background: none;
  color: var(--text-2); font-family: inherit; cursor: pointer;
}
.board-item:hover { background: var(--bg-hover); }
.board-item.is-active { background: var(--bg-active); }
.board-id { display: block; font-size: 11.5px; color: var(--text); font-family: var(--font-mono); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.board-meta { display: flex; align-items: center; gap: 7px; margin-top: 2px; font-size: 10px; color: var(--text-3); }
.board-summary { display: block; margin-top: 2px; font-size: 10px; color: var(--text-3); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

.state { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.state::before { content: ""; width: 5px; height: 5px; background: var(--text-3); flex: none; }
.state.is-running { color: var(--accent); }
.state.is-running::before { background: var(--accent); }
.state.is-done { color: var(--text-2); }
.state.is-failed { color: var(--danger); }
.state.is-failed::before { background: var(--danger); }

.side-note {
  margin: 0; padding: 10px 16px 14px; border-top: 1px solid var(--line);
  font-size: 10.5px; line-height: 1.5; color: var(--text-3); min-height: 40px;
}

/* ---------- stage ---------- */
.stage { display: grid; grid-template-rows: auto minmax(0, 1fr); min-width: 0; min-height: 0; }

.stage-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 10px 20px; border-bottom: 1px solid var(--line); min-width: 0;
}
.stage-title { display: flex; align-items: baseline; gap: 12px; min-width: 0; flex-wrap: wrap; }
.stage-title h2 { margin: 0; font-size: 14px; font-weight: 600; font-family: var(--font-mono); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.stage-title .meta { font-size: 10.5px; color: var(--text-3); }

.playback { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.playback .progress { font-size: 10.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.playback button {
  height: 26px; padding: 0 8px;
  border: 1px solid var(--line-2); border-radius: 2px;
  background: none; color: var(--text-2);
  font-family: inherit; font-size: 11px; cursor: pointer;
}
.playback button:hover:not(:disabled) { color: var(--text); border-color: var(--line-hover); }
.playback button:disabled { color: var(--text-3); cursor: default; opacity: .5; }
.playback button[aria-pressed="true"] { color: var(--accent); border-color: var(--accent-line); }

.zoom { display: flex; align-items: center; gap: 4px; flex: none; }
.zoom button {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 26px; height: 26px; padding: 0 6px;
  border: 1px solid var(--line-2); border-radius: 2px;
  background: none; color: var(--text-2);
  font-family: inherit; font-size: 11.5px; cursor: pointer;
}
.zoom button:hover { color: var(--text); border-color: var(--line-hover); }
.zoom .level { display: inline-flex; align-items: center; justify-content: center; min-width: 44px; height: 26px; padding: 0 6px; color: var(--text-3); font-size: 11.5px; font-variant-numeric: tabular-nums; }

.canvas-wrap {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 280px;
  min-height: 0;
}

.canvas {
  position: relative;
  overflow: hidden;
  background-color: var(--bg);
  background-image: radial-gradient(var(--line) 1px, transparent 1px);
  background-size: 24px 24px;
  cursor: grab;
  touch-action: none;
  min-height: 0;
}
.canvas.is-panning { cursor: grabbing; }

.world {
  position: absolute;
  left: 0;
  top: 0;
  transform-origin: 0 0;
  will-change: transform;
}

.edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.edges line.edge {
  stroke: var(--line-2);
  stroke-width: 1.2;
  pointer-events: none;
}
.edges line.edge.is-active { stroke: var(--accent); stroke-width: 1.8; }
.edges line.edge.is-new { animation: edgeIn 280ms var(--ease) both; }
.edges line.edge-hit {
  stroke: transparent;
  stroke-width: 12;
  pointer-events: stroke;
  cursor: pointer;
}
.edges polygon.edge-arrow { fill: var(--line-2); }
.edges polygon.edge-arrow.is-active { fill: var(--accent); }
.edges text.edge-label {
  fill: var(--text-3);
  font-family: var(--font-ui);
  font-size: 10px;
  paint-order: stroke;
  stroke: var(--bg);
  stroke-width: 4px;
  pointer-events: none;
}
.edges text.edge-label.is-active { fill: var(--accent); }

.gnode {
  position: absolute;
  left: 0;
  top: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0;
  border: 0;
  background: none;
  transform: translateY(-50%);
  color: var(--text-2);
  font-family: inherit;
  cursor: grab;
  white-space: nowrap;
}
.gnode-dot {
  width: 9px;
  height: 9px;
  flex: none;
  border-radius: 50%;
  background: var(--text-3);
  transition: background-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.gnode-label { font-size: 11px; color: var(--text-2); transition: color var(--dur) var(--ease); }
.gnode:hover .gnode-dot { background: var(--text); }
.gnode:hover .gnode-label { color: var(--text); }
.gnode.is-active .gnode-dot { background: var(--accent); box-shadow: 0 0 0 4px var(--accent-ring); }
.gnode.is-active .gnode-label { color: var(--accent); }
.gnode.is-dragging { cursor: grabbing; }
.gnode.is-new { animation: nodeIn 280ms var(--ease) both; }
@keyframes nodeIn {
  from { opacity: 0; transform: translateY(-50%) scale(.5); }
  to { opacity: 1; transform: translateY(-50%) scale(1); }
}
@keyframes edgeIn { from { opacity: 0; } to { opacity: 1; } }

.canvas-empty {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  text-align: center;
  pointer-events: none;
  padding: 24px;
}
.canvas-empty h3 { margin: 0; font-size: 13px; font-weight: 600; color: var(--text-2); }
.canvas-empty p { margin: 6px 0 0; font-size: 11.5px; color: var(--text-3); max-width: 36ch; }

/* inspector */
.inspector {
  border-left: 1px solid var(--line);
  overflow-y: auto;
  min-height: 0;
  background: var(--bg-rail);
}
.inspector-head {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 16px; border-bottom: 1px solid var(--line);
}
.inspector-head h2 { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .06em; color: var(--text-2); }
.inspector-body { padding: 12px 16px 20px; }
.inspector h3 { margin: 0; font-size: 13px; font-weight: 600; color: var(--text); overflow-wrap: anywhere; }
.inspector .kind { display: block; margin-top: 3px; font-size: 10px; color: var(--text-3); }
.inspector .summary { margin: 10px 0 0; font-size: 11.5px; line-height: 1.65; color: var(--text-2); }

.kv { margin: 10px 0 0; padding: 0; }
.kv-row { display: grid; grid-template-columns: 82px minmax(0, 1fr); gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 11px; }
.kv-row dt { color: var(--text-3); overflow-wrap: anywhere; }
.kv-row dd { margin: 0; color: var(--text); overflow-wrap: anywhere; }

.section-label { display: block; margin: 16px 0 6px; font-size: 10px; letter-spacing: .06em; color: var(--text-3); }
.gaps { list-style: none; margin: 0; padding: 0; }
.gaps li { padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 11px; color: var(--text-2); }
.gaps li:last-child { border-bottom: 0; }
.activity-list { list-style: none; margin: 0; padding: 0; }
.activity-list li { padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 11px; color: var(--text-2); }
.activity-list li:last-child { border-bottom: 0; }
.activity-list b { font-weight: 400; color: var(--text-3); margin-right: 8px; font-family: var(--font-mono); font-size: 10px; }

.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { border-bottom: 1px solid var(--line); }
.timeline li:last-child { border-bottom: 0; }
.timeline button {
  display: grid; grid-template-columns: 50px minmax(0, 1fr); gap: 8px;
  width: 100%; padding: 7px 0; border: 0; background: none;
  color: var(--text-2); font-family: inherit; font-size: 11px; text-align: left; cursor: pointer;
}
.timeline button:hover:not(:disabled) { color: var(--text); }
.timeline button:disabled { color: var(--text-3); opacity: .5; cursor: default; }
.timeline time { font-family: var(--font-mono); font-size: 10px; color: var(--text-3); }
.timeline .is-latest { color: var(--accent); }
.muted { color: var(--text-3); font-size: 11px; }

.placeholder { padding: 80px 0; text-align: center; }
.placeholder h2 { margin: 0; font-size: 14px; font-weight: 600; }
.placeholder p { margin: 6px 0 0; font-size: 12px; color: var(--text-3); }
.placeholder .textbtn { margin-top: 18px; font-size: 12px; }

@media (max-width: 1100px) {
  .app { grid-template-columns: 56px minmax(0, 1fr); }
  .rail-brand { justify-content: center; padding: 0; }
  .rail-name, .rail-sub, .nav-item .label, .who-meta { display: none; }
  .nav-item { justify-content: center; padding: 0; }
  .who { justify-content: center; padding: 12px 0; }
  .trace-shell { grid-template-columns: 210px minmax(0, 1fr); }
  .canvas-wrap { grid-template-columns: minmax(0, 1fr) 240px; }
}

@media (max-width: 900px) {
  body { overflow: auto; }
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); height: auto; min-height: 100dvh; }
  .rail {
    display: flex; align-items: center; gap: 14px; height: auto;
    padding: 0 16px; border-right: 0; border-bottom: 1px solid var(--line);
  }
  .rail-brand { height: 46px; border-bottom: 0; }
  .nav { display: flex; gap: 0; padding: 0; overflow-x: auto; scrollbar-width: none; }
  .nav::-webkit-scrollbar { display: none; }
  .nav-item { height: 46px; padding: 0 11px; flex: none; }
  .nav-item.is-active { background: var(--bg-active); }
  .nav-item .label { display: inline; }
  .rail-foot { display: flex; align-items: center; margin-left: auto; border-top: 0; }
  .who { display: none; }
  .rail-foot .nav-item { height: 46px; }
  .main { height: auto; grid-template-rows: 46px minmax(0, 1fr); }
  .bar { height: 46px; padding: 0 14px; }
  .trace-shell { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto; }
  .side { border-right: 0; border-bottom: 1px solid var(--line); grid-template-rows: auto auto auto; }
  .board-list { display: flex; gap: 6px; overflow-x: auto; padding: 6px 12px 10px; }
  .board-item { flex: 0 0 200px; border: 1px solid var(--line); border-radius: 2px; border-left-width: 1px; }
  .canvas-wrap { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(320px, 60vh) auto; }
  .canvas { min-height: 320px; }
  .inspector { border-left: 0; border-top: 1px solid var(--line); max-height: 320px; }
}

@media (max-width: 620px) {
  .bar { padding: 0 12px; }
  .stage-bar { padding: 8px 12px; }
  .canvas-wrap { grid-template-rows: minmax(280px, 52vh) auto; }
  .textbtn { min-height: 40px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .001ms !important; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="rail-brand">
      <svg class="rail-mark" viewBox="0 0 28 28" aria-hidden="true" focusable="false">
        <path d="M14 2.6 24 8.3v11.4L14 25.4 4 19.7V8.3z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
        <path d="M9.4 11.4h9.2M9.4 14.6h9.2M11 17.8h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity=".85" />
      </svg>
      <span class="od-field">
        <span class="rail-name">HIDS</span>
        <span class="rail-sub">AI 研判平台</span>
      </span>
    </div>

    <nav class="nav" aria-label="主导航">
      <a class="nav-item" href="overview.html">
        <svg class="od-icon" viewBox="0 0 20 20" aria-hidden="true">
          <rect x="2.8" y="2.8" width="6" height="6" rx=".8" fill="none" stroke="currentColor" stroke-width="1.4" />
          <rect x="11.2" y="2.8" width="6" height="6" rx=".8" fill="none" stroke="currentColor" stroke-width="1.4" />
          <rect x="2.8" y="11.2" width="6" height="6" rx=".8" fill="none" stroke="currentColor" stroke-width="1.4" />
          <rect x="11.2" y="11.2" width="6" height="6" rx=".8" fill="none" stroke="currentColor" stroke-width="1.4" />
        </svg>
        <span class="label">总览</span>

<script>
(function () {
  "use strict";

  /* 示例数据按 TraceBoard 形状组织；节点/关系的字段未定义，画布按通用规则解析 */
  var BOARDS = [
    {
      id: "revshell:1",
      status: "done",
      summary: "从牧云事件 revshell:1 展开，命中 3 台主机、2 个账号与 4 条对外连接。",
      gaps: ["账号 deploy 的使用人未确认", "横向移动目标仅覆盖同网段"],
      nodes: [

        { id: "proc-bash", type: "进程", label: "bash", pid: "28471" },

      ],
      edges: [
        { source: "host-03", target: "acct-deploy", label: "登录" },
        { source: "acct-deploy", target: "proc-bash", label: "启动" },

      ],

        { time: "09:42:18", text: "发现主机 web-prod-03", node: "host-03" },
        { time: "09:42:40", text: "账号 deploy 登录", node: "acct-deploy" },
        { time: "09:43:05", text: "进程 bash 被拉起", node: "proc-bash" },
        { time: "09:44:10", text: "发现外联地址 45.32.118.7", node: "ip-ext" }
      ]
    },
    {
      id: "webshell:42",
      status: "running",
      summary: "站点头马写入，正在扩展同入口的其他上传记录。",
      gaps: [],
      nodes: [
        { id: "host-api", type: "主机", label: "api-gateway-01", ip: "172.16.221.18" },
        { id: "file-shell", type: "文件", label: "/var/www/html/uploads/shell.php", hash: "a71f3c…8d02" },
        { id: "src-ip", type: "IP", label: "45.32.118.7", note: "访问来源" },
        { id: "acct-www", type: "账号", label: "www-data", role: "服务账号" }
      ],
      edges: [
        { source: "host-api", target: "file-shell", label: "写入" },
        { source: "src-ip", target: "file-shell", label: "访问" }
      ],
      activity: [
        { time: "09:50:10", text: "任务创建" },
        { time: "09:50:42", text: "发现主机 api-gateway-01", node: "host-api" },
        { time: "09:51:03", text: "发现写入文件 shell.php", node: "file-shell" },
        { time: "09:51:40", text: "发现访问来源 45.32.118.7", node: "src-ip" },
        { time: "09:52:10", text: "发现服务账号 www-data（暂无关联）", node: "acct-www" }
      ]
    },
    {
      id: "172.16.221.41",
      status: "failed",
      summary: "按 IP 溯源失败：目标主机不在当前资产范围内。",
      gaps: ["资产未登记"],
      nodes: [],
      edges: [],
      activity: [
        { time: "08:10:02", text: "任务创建" },
        { time: "08:10:05", text: "失败：资产不存在" }
      ]
    }
  ];

  var LABEL_PAD_RIGHT = 160;
  var LABEL_PAD_LEFT = 30;
  var view = { x: 40, y: 40, k: 1 };
  var selected = 0;
  var selectedNode = null;
  var selectedEdge = null;
  var drag = null;
  var pan = null;
  var reveal = { count: 0, timer: null, playing: false };
  var follow = true;

  var $ = function (id) { return document.getElementById(id); };
  var canvas = $("canvas");
  var world = $("world");
  var edgesLayer = $("edges");
  var nodesLayer = $("nodes");

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function text(value) {
    if (value === null || value === undefined) return "—";
    if (typeof value === "object") return JSON.stringify(value);
    return String(value);
  }

  function statusClass(status) {
    if (status === "running") return "is-running";
    if (status === "done") return "is-done";
    if (status === "failed") return "is-failed";
    return "";
  }

  function labelOf(node, index) {
    return node.label || node.name || node.title || node.id || ("节点 " + (index + 1));
  }

  function keyOf(node, index) {
    return node.id || node.key || node.uuid || ("n" + index);
  }

  function fieldRows(node) {
    var skip = ["id", "key", "uuid", "label", "name", "title", "type", "kind", "x", "y"];
    return Object.keys(node).filter(function (key) {
      return skip.indexOf(key) === -1;
    }).slice(0, 3);
  }

  function layout(board) {
    if (!board || board._laid) return;
    var nodes = board.nodes || [];
    if (!nodes.length) { board._laid = true; return; }

    nodes.forEach(function (node, index) {
      node._key = keyOf(node, index);
      if (typeof node.x !== "number" || typeof node.y !== "number") {
        var angle = (Math.PI * 2 * index) / nodes.length;
        var radius = 200 + (index % 3) * 30;
        node.x = Math.cos(angle) * radius;
        node.y = Math.sin(angle) * radius;
      }
    });

    var links = [];
    (board.edges || []).forEach(function (edge) {
      var ends = edgeEnds(edge, nodes);
      if (ends.source !== null && ends.target !== null) links.push([ends.source, ends.target]);
    });

    var minDist = 130;
    for (var step = 0; step < 320; step++) {
      var i, j;
      for (i = 0; i < nodes.length; i++) {
        for (j = i + 1; j < nodes.length; j++) {
          var a = nodes[i];
          var b = nodes[j];
          var dx = b.x - a.x;
          var dy = b.y - a.y;
          var dist = Math.max(1, Math.sqrt(dx * dx + dy * dy));
          var push = 9000 / (dist * dist);
          var ux = dx / dist;
          var uy = dy / dist;
          a.x -= ux * push;
          a.y -= uy * push;
          b.x += ux * push;
          b.y += uy * push;
        }
      }

      links.forEach(function (link) {
        var a = nodes[link[0]];
        var b = nodes[link[1]];
        var dx = b.x - a.x;
        var dy = b.y - a.y;
        var dist = Math.max(1, Math.sqrt(dx * dx + dy * dy));
        var pull = (dist - minDist) * 0.012;
        var ux = dx / dist;
        var uy = dy / dist;
        a.x += ux * pull;
        a.y += uy * pull;
        b.x -= ux * pull;
        b.y -= uy * pull;
      });

      nodes.forEach(function (node) {
        node.x *= 0.996;
        node.y *= 0.996;
      });
    }

    var minX = Infinity, minY = Infinity;
    nodes.forEach(function (node) {
      minX = Math.min(minX, node.x);
      minY = Math.min(minY, node.y);
    });
    nodes.forEach(function (node) {
      node.x += 80 - minX;
      node.y += 80 - minY;
    });

    board._laid = true;
  }

  function setSelection(nodeIndex, edgeIndex) {
    selectedNode = nodeIndex;
    selectedEdge = edgeIndex;
    Array.prototype.forEach.call(nodesLayer.querySelectorAll(".gnode"), function (el) {
      el.classList.toggle("is-active", Number(el.dataset.index) === selectedNode);
    });
    renderEdges();
    renderInspector();
  }

  function activeBoard() { return BOARDS[selected] || null; }

  function renderList() {
    $("board-count").textContent = BOARDS.length + " 个";
    if (!BOARDS.length) {
      $("board-list").innerHTML = '<li><p class="muted">还没有白板。</p></li>';
      return;
    }
    $("board-list").innerHTML = BOARDS.map(function (item, index) {
      return '<li><button type="button" class="board-item' + (index === selected ? " is-active" : "") + '" data-index="' + index + '">' +
        '<span class="board-id">' + escapeHtml(item.id) + '</span>' +
        '<span class="board-meta"><span class="state ' + statusClass(item.status) + '">' + escapeHtml(item.status || "—") + '</span>' +
        '<span>' + (item.nodes || []).length + ' 节点 · ' + (item.edges || []).length + ' 关系</span></span>' +
        (item.summary ? '<span class="board-summary">' + escapeHtml(item.summary) + '</span>' : '') +
        '</button></li>';
    }).join("");
  }

  function nodeMarkup(node, index) {
    return '<button type="button" class="gnode' + (selectedNode === index ? " is-active" : "") + '" data-index="' + index + '"' +
      ' style="left:' + (node.x - 4.5) + 'px;top:' + node.y + 'px">' +
      '<span class="gnode-dot"></span>' +
      '<span class="gnode-label">' + escapeHtml(labelOf(node, index)) + '</span>' +
      '</button>';
  }

  function activityNode(entry, nodes) {
    var keys = ["node", "node_id", "nodeId", "节点"];
    for (var i = 0; i < keys.length; i++) {
      if (entry[keys[i]] === null || entry[keys[i]] === undefined) continue;
      return resolveKey(entry[keys[i]], nodes);
    }
    return null;
  }

  function discoveryOrder(board) {
    var nodes = board.nodes || [];
    var order = [];
    var used = {};
    (board.activity || []).forEach(function (entry) {
      var index = activityNode(entry, nodes);
      if (index !== null && !used[index]) {
        used[index] = true;
        order.push(index);
      }
    });
    nodes.forEach(function (_, index) {
      if (!used[index]) order.push(index);
    });
    return order;
  }

  function revealState(board) {
    var order = discoveryOrder(board);
    var count = Math.min(reveal.count, order.length);
    var visible = {};
    order.slice(0, count).forEach(function (index) { visible[index] = true; });
    return { order: order, visible: visible, count: count };
  }

  function edgeEnds(edge, nodes) {
    var sourceKeys = ["source", "from", "fromNode", "src", "start"];
    var targetKeys = ["target", "to", "toNode", "dst", "end"];
    var source = null;
    var target = null;
    sourceKeys.some(function (key) {
      source = resolveKey(edge[key], nodes);
      return source !== null;
    });
    targetKeys.some(function (key) {
      target = resolveKey(edge[key], nodes);
      return target !== null;
    });
    return { source: source, target: target };
  }

  function visibleEdgeCount(board, visible) {
    var nodes = board.nodes || [];
    return (board.edges || []).filter(function (edge) {
      var ends = edgeEnds(edge, nodes);
      return ends.source !== null && ends.target !== null &&
        visible[ends.source] && visible[ends.target];
    }).length;
  }

  function renderNodes() {
    var board = activeBoard();
    if (!board) {
      nodesLayer.innerHTML = "";
      return;
    }
    var state = revealState(board);
    var latest = state.order[state.count - 1];
    nodesLayer.innerHTML = (board.nodes || []).map(function (node, index) {
      if (!state.visible[index]) return "";
      var html = nodeMarkup(node, index);
      if (index === latest) html = html.replace('class="gnode', 'class="gnode is-new');
      return html;
    }).join("");
  }

  function resolveKey(value, nodes) {
    if (value === null || value === undefined) return null;
    var target = String(value);
    for (var i = 0; i < nodes.length; i++) {
      var node = nodes[i];
      if (node._key === target || node.id === target || labelOf(node, i) === target) {
        return i;
      }
    }
    return null;
  }

  function edgeMarkup(edge, index, state, latest) {
    var board = activeBoard();
    var nodes = board.nodes || [];
    var ends = edgeEnds(edge, nodes);
    var source = ends.source;
    var target = ends.target;

    if (source === null || target === null) return "";
    if (!state.visible[source] || !state.visible[target]) return "";

    var a = nodes[source];
    var b = nodes[target];
    var fresh = source === latest || target === latest;
    var active = selectedEdge === index;
    var cls = "edge" + (active ? " is-active" : "") + (fresh ? " is-new" : "");
    var suffix = active ? " is-active" : "";

    var dx = b.x - a.x;
    var dy = b.y - a.y;
    var dist = Math.max(1, Math.sqrt(dx * dx + dy * dy));
    var ux = dx / dist;
    var uy = dy / dist;
    var angle = Math.atan2(dy, dx);
    var tipX = b.x - ux * 9;
    var tipY = b.y - uy * 9;
    var size = 7;
    var spread = 0.42;
    var leftX = tipX - size * Math.cos(angle - spread);
    var leftY = tipY - size * Math.sin(angle - spread);
    var rightX = tipX - size * Math.cos(angle + spread);
    var rightY = tipY - size * Math.sin(angle + spread);

    var label = edge.label || edge.relation || edge.relationship || edge.type || edge.kind || "";
    var midX = (a.x + b.x) / 2;
    var midY = (a.y + b.y) / 2 - 7;

    return '<line class="' + cls + '" x1="' + a.x + '" y1="' + a.y + '" x2="' + b.x + '" y2="' + b.y + '" />' +
      '<polygon class="edge-arrow' + suffix + '" points="' +
        tipX + "," + tipY + " " + leftX + "," + leftY + " " + rightX + "," + rightY + '" />' +
      (label ? '<text class="edge-label' + suffix + '" x="' + midX + '" y="' + midY + '" text-anchor="middle">' +
        escapeHtml(label) + '</text>' : '') +
      '<line class="edge-hit" data-edge="' + index + '" x1="' + a.x + '" y1="' + a.y + '" x2="' + b.x + '" y2="' + b.y + '" />';
  }

  function renderEdges() {
    var board = activeBoard();
    if (!board) {
      edgesLayer.innerHTML = "";
      return;
    }
    var state = revealState(board);
    var latest = state.order[state.count - 1];
    var maxX = 1, maxY = 1;
    (board.nodes || []).forEach(function (node, index) {
      if (!state.visible[index]) return;
      maxX = Math.max(maxX, node.x + LABEL_PAD_RIGHT);
      maxY = Math.max(maxY, node.y + 60);
    });
    edgesLayer.setAttribute("width", maxX);
    edgesLayer.setAttribute("height", maxY);
    edgesLayer.setAttribute("viewBox", "0 0 " + maxX + " " + maxY);
    edgesLayer.innerHTML = (board.edges || []).map(function (edge, index) {
      return edgeMarkup(edge, index, state, latest);
    }).join("");
  }

  function applyView() {
    world.style.transform = "translate(" + view.x + "px," + view.y + "px) scale(" + view.k + ")";
    $("zoom-level").textContent = Math.round(view.k * 100) + "%";
  }

  function fitView() {
    var board = activeBoard();
    if (!board || !(board.nodes || []).length) {
      view = { x: 40, y: 40, k: 1 };
      applyView();
      return;
    }
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    board.nodes.forEach(function (node) {
      minX = Math.min(minX, node.x - LABEL_PAD_LEFT);
      minY = Math.min(minY, node.y - 30);
      maxX = Math.max(maxX, node.x + LABEL_PAD_RIGHT);
      maxY = Math.max(maxY, node.y + 30);
    });
    var pad = 60;
    var w = maxX - minX + pad * 2;
    var h = maxY - minY + pad * 2;
    var rect = canvas.getBoundingClientRect();
    var k = Math.min(rect.width / w, rect.height / h, 1.2);
    k = Math.max(0.25, k);
    view.k = k;
    view.x = (rect.width - (maxX - minX) * k) / 2 - minX * k;
    view.y = (rect.height - (maxY - minY) * k) / 2 - minY * k;
    applyView();
  }

  function renderStage() {
    var board = activeBoard();
    if (!board) {
      $("board-id").textContent = "—";
      $("board-state-text").textContent = "—";
      $("board-counts").textContent = "—";
      $("progress").textContent = "—";
      $("canvas-empty").hidden = false;
      $("canvas-empty-title").textContent = "没有白板";
      $("canvas-empty-text").textContent = "在左侧输入告警 ID 或 IPv4 新建。";
      return;
    }

    $("board-id").textContent = board.id;
    $("board-state").className = "state " + statusClass(board.status);
    $("board-state-text").textContent = board.status || "—";
    var state = revealState(board);
    $("board-counts").textContent = (board.nodes || []).length + " 节点 · " + (board.edges || []).length + " 关系";
    $("progress").textContent = "已发现 " + state.count + " / " + state.order.length + " 节点 · " +
      visibleEdgeCount(board, state.visible) + " / " + (board.edges || []).length + " 关系";

    var empty = !(board.nodes || []).length;
    $("canvas-empty").hidden = !empty;
    if (empty) {
      $("canvas-empty-title").textContent = board.status === "failed" ? "任务失败" : "白板为空";
      $("canvas-empty-text").textContent = board.status === "failed"
        ? (board.summary || "接口未返回失败原因。")
        : "接口未返回节点，等待任务生成。";
    }
  }

  function renderInspector() {
    var board = activeBoard();
    var host = $("inspector");
    var clear = $("clear-select");

    if (selectedNode !== null && board && board.nodes[selectedNode]) {
      var node = board.nodes[selectedNode];
      var rows = Object.keys(node).filter(function (key) { return key.charAt(0) !== "_"; }).map(function (key) {
        return '<div class="kv-row"><dt>' + escapeHtml(key) + '</dt><dd>' + escapeHtml(text(node[key])) + '</dd></div>';
      }).join("");
      host.innerHTML = '<h3>' + escapeHtml(labelOf(node, selectedNode)) + '</h3>' +
        '<span class="kind">' + escapeHtml(node.type || node.kind || "节点") + '</span>' +
        '<dl class="kv">' + rows + '</dl>';
      clear.hidden = false;
      return;
    }

    if (selectedEdge !== null && board && board.edges[selectedEdge]) {
      var edge = board.edges[selectedEdge];
      var eRows = Object.keys(edge).map(function (key) {
        return '<div class="kv-row"><dt>' + escapeHtml(key) + '</dt><dd>' + escapeHtml(text(edge[key])) + '</dd></div>';
      }).join("");
      host.innerHTML = '<h3>关系</h3><span class="kind">edge #' + selectedEdge + '</span><dl class="kv">' + eRows + '</dl>';
      clear.hidden = false;
      return;
    }

    clear.hidden = true;
    if (!board) {
      host.innerHTML = '<p class="muted">没有选中的白板。</p>';
      return;
    }

    var state = revealState(board);
    var latest = state.order[state.count - 1];
    var nodes = board.nodes || [];
    var gaps = (board.gaps || []).map(function (gap) { return "<li>" + escapeHtml(gap) + "</li>"; }).join("");
    var timeline = (board.activity || []).map(function (item) {
      var nodeIndex = activityNode(item, nodes);
      var visible = nodeIndex === null ? true : Boolean(state.visible[nodeIndex]);
      var isLatest = nodeIndex !== null && nodeIndex === latest;
      return "<li><button type=\"button\" data-node=\"" + (nodeIndex === null ? "" : nodeIndex) + "\"" +
        (visible && nodeIndex !== null ? "" : " disabled") + (isLatest ? ' class="is-latest"' : "") + ">" +
        "<time>" + escapeHtml(item.time || "") + "</time>" +
        "<span>" + escapeHtml(item.text || item.action || "") + "</span></button></li>";
    }).join("");

    host.innerHTML =
      '<h3>白板概览</h3>' +
      '<span class="kind">' + escapeHtml(board.status || "—") + '</span>' +
      '<p class="summary">' + escapeHtml(board.summary || "接口未返回摘要。") + '</p>' +
      '<span class="section-label">缺口 · ' + (board.gaps || []).length + '</span>' +
      '<ul class="gaps">' + (gaps || '<li class="muted">接口未返回缺口。</li>') + '</ul>' +
      '<span class="section-label">调研过程 · 已发现 ' + state.count + ' / ' + state.order.length + '</span>' +
      '<ul class="timeline">' + (timeline || '<li class="muted">接口未返回活动记录。</li>') + '</ul>';
  }

  function renderAll() {
    renderList();
    renderStage();
    renderNodes();
    renderEdges();
    applyView();
    renderInspector();
    updatePlayback();
  }

  function selectBoard(index) {
    selected = index;
    selectedNode = null;
    selectedEdge = null;
    reveal.count = 0;
    stopReveal();
    layout(activeBoard());
    renderAll();
    fitView();
    startReveal();
  }

  function stopReveal() {
    if (reveal.timer) {
      clearInterval(reveal.timer);
      reveal.timer = null;
    }
    reveal.playing = false;
    updatePlayback();
  }

  function tickReveal() {
    var board = activeBoard();
    if (!board) { stopReveal(); return; }
    var order = discoveryOrder(board);
    if (reveal.count >= order.length) {
      stopReveal();
      renderAll();
      if (follow) fitView();
      return;
    }
    reveal.count += 1;
    renderAll();
    if (follow) centerOnLatest();
    updatePlayback();
  }

  function startReveal() {
    var board = activeBoard();
    if (!board) return;
    stopReveal();
    var order = discoveryOrder(board);
    reveal.count = order.length ? 1 : 0;
    renderAll();
    if (!order.length) return;
    if (follow) centerOnLatest();
    reveal.playing = true;
    reveal.timer = setInterval(tickReveal, 900);
    updatePlayback();
  }

  function resumeReveal() {
    var board = activeBoard();
    if (!board) return;
    var order = discoveryOrder(board);
    if (!order.length) return;
    reveal.count = Math.max(1, reveal.count);
    renderAll();
    reveal.playing = true;
    reveal.timer = setInterval(tickReveal, 900);
    updatePlayback();
  }

  function updatePlayback() {
    var board = activeBoard();
    var has = Boolean(board && (board.nodes || []).length);
    var order = board ? discoveryOrder(board) : [];
    $("replay").disabled = !has;
    $("latest").disabled = !has || reveal.count >= order.length;
    $("pause").disabled = !has || (!reveal.playing && reveal.count >= order.length);
    $("pause").textContent = reveal.playing ? "暂停" : "继续";
    $("follow").setAttribute("aria-pressed", String(follow));
  }

  function centerOnLatest() {
    var board = activeBoard();
    if (!board) return;
    var state = revealState(board);
    var index = state.order[state.count - 1];
    if (index === undefined) return;
    var node = board.nodes[index];
    var rect = canvas.getBoundingClientRect();
    view.x = rect.width / 2 - node.x * view.k;
    view.y = rect.height / 2 - node.y * view.k;
    applyView();
  }

  function focusNode(index) {
    var board = activeBoard();
    var node = board && board.nodes[index];
    if (!node) return;
    setSelection(index, null);
    var rect = canvas.getBoundingClientRect();
    view.x = rect.width / 2 - node.x * view.k;
    view.y = rect.height / 2 - node.y * view.k;
    applyView();
  }

  $("board-list").addEventListener("click", function (event) {
    var button = event.target.closest("[data-index]");
    if (!button) return;
    selectBoard(Number(button.dataset.index));
  });

  $("start").addEventListener("click", function () {
    var input = $("target");
    var target = input.value.trim();
    if (!target) {
      $("start-note").textContent = "请输入告警 ID 或 IPv4 地址。";
      input.focus();
      return;
    }
    var existing = BOARDS.findIndex(function (item) { return item.id === target; });
    if (existing >= 0) {
      selectBoard(existing);
      $("start-note").textContent = "该目标已有白板，已切换。";
      return;
    }

    BOARDS.unshift({ id: target, status: "running", summary: "", gaps: [], nodes: [], edges: [], activity: [] });
    selectBoard(0);
    $("start-note").textContent = "已提交溯源任务（202），等待后端返回进度。";
    $("sr-status").textContent = "已提交溯源任务 " + target;
    input.value = "";
  });

  /* 画布交互：拖拽平移、滚轮缩放、拖动节点 */
  canvas.addEventListener("pointerdown", function (event) {
    var nodeEl = event.target.closest(".gnode");
    if (nodeEl) {
      var index = Number(nodeEl.dataset.index);
      var board = activeBoard();
      var node = board.nodes[index];
      drag = {
        index: index,
        startX: event.clientX,
        startY: event.clientY,
        nodeX: node.x,
        nodeY: node.y,
        moved: false
      };
      stopReveal();
      nodeEl.classList.add("is-dragging");
      nodeEl.setPointerCapture(event.pointerId);
      setSelection(index, null);
      event.preventDefault();
      return;
    }

    if (event.target.closest("[data-edge]")) return;

    pan = { startX: event.clientX, startY: event.clientY, x: view.x, y: view.y };
    canvas.classList.add("is-panning");
    setSelection(null, null);
  });

  canvas.addEventListener("pointermove", function (event) {
    if (drag) {
      var dx = (event.clientX - drag.startX) / view.k;
      var dy = (event.clientY - drag.startY) / view.k;
      if (Math.abs(dx) + Math.abs(dy) > 2) drag.moved = true;
      var node = activeBoard().nodes[drag.index];
      node.x = drag.nodeX + dx;
      node.y = drag.nodeY + dy;
      var el = nodesLayer.querySelector('[data-index="' + drag.index + '"]');
      if (el) {
        el.style.left = (node.x - 4.5) + "px";
        el.style.top = node.y + "px";
      }
      renderEdges();
      return;
    }

    if (pan) {
      view.x = pan.x + (event.clientX - pan.startX);
      view.y = pan.y + (event.clientY - pan.startY);
      applyView();
    }
  });

  function endPointer(event) {
    if (drag) {
      drag.moved && renderInspector();
      drag = null;
      var el = nodesLayer.querySelector(".gnode.is-dragging");
      if (el) el.classList.remove("is-dragging");
    }
    if (pan) {
      pan = null;
      canvas.classList.remove("is-panning");
    }
  }

  canvas.addEventListener("pointerup", endPointer);
  canvas.addEventListener("pointercancel", endPointer);
  canvas.addEventListener("pointerleave", function () { /* keep capture */ });

  canvas.addEventListener("wheel", function (event) {
    if (!activeBoard()) return;
    event.preventDefault();
    var rect = canvas.getBoundingClientRect();
    var mx = event.clientX - rect.left;
    var my = event.clientY - rect.top;
    var factor = event.deltaY < 0 ? 1.1 : 0.9;
    var nextK = Math.min(2.5, Math.max(0.25, view.k * factor));
    view.x = mx - (mx - view.x) * (nextK / view.k);
    view.y = my - (my - view.y) * (nextK / view.k);
    view.k = nextK;
    applyView();
  }, { passive: false });

  canvas.addEventListener("click", function (event) {
    var nodeEl = event.target.closest(".gnode");
    if (nodeEl) {
      setSelection(Number(nodeEl.dataset.index), null);
      return;
    }
    var edgeEl = event.target.closest("[data-edge]");
    if (edgeEl) setSelection(null, Number(edgeEl.dataset.edge));
  });

  $("clear-select").addEventListener("click", function () {
    setSelection(null, null);
  });

  $("zoom-in").addEventListener("click", function () {
    view.k = Math.min(2.5, view.k * 1.15);
    applyView();
  });
  $("zoom-out").addEventListener("click", function () {
    view.k = Math.max(0.25, view.k / 1.15);
    applyView();
  });
  $("fit").addEventListener("click", fitView);
  $("replay").addEventListener("click", startReveal);
  $("pause").addEventListener("click", function () {
    if (reveal.playing) stopReveal();
    else resumeReveal();
  });
  $("latest").addEventListener("click", function () {
    var board = activeBoard();
    if (!board) return;
    reveal.count = discoveryOrder(board).length;
    stopReveal();
    renderAll();
  });
  $("follow").addEventListener("click", function () {
    follow = !follow;
    updatePlayback();
  });
  $("inspector").addEventListener("click", function (event) {
    var button = event.target.closest("[data-node]");
    if (!button || button.disabled) return;
    focusNode(Number(button.dataset.node));
  });

  $("refresh").addEventListener("click", function () {
    var button = $("refresh");
    button.disabled = true;
    setTimeout(function () {
      renderAll();
      fitView();
      button.disabled = false;
      $("sr-status").textContent = "已刷新";
    }, 400);
  });

  document.querySelectorAll(".nav-item[data-page]").forEach(function (item) {
    item.addEventListener("click", function (event) {
      event.preventDefault();
      var name = item.dataset.page;
      $("page-title").textContent = name;
      $("ph-title").textContent = name;
      $("trace-shell").hidden = true;
      $("view-placeholder").hidden = false;
      document.querySelectorAll(".nav-item").forEach(function (nav) {
        nav.classList.toggle("is-active", nav === item);
        if (nav === item) nav.setAttribute("aria-current", "page");
        else nav.removeAttribute("aria-current");
      });
    });
  });

  $("ph-back").addEventListener("click", function () {
    $("page-title").textContent = "深度溯源";
    $("trace-shell").hidden = false;
    $("view-placeholder").hidden = true;
    document.querySelectorAll(".nav-item").forEach(function (nav) {
      var active = nav.getAttribute("href") === "trace.html";
      nav.classList.toggle("is-active", active);
      if (active) {
        nav.setAttribute("aria-current", "page");
        nav.focus();
      } else {
        nav.removeAttribute("aria-current");
      }
    });
  });

  var params = new URLSearchParams(window.location.search);
  var preset = params.get("target");
  if (preset) {
    $("target").value = preset;
    var found = BOARDS.findIndex(function (item) { return item.id === preset; });
    if (found >= 0) selected = found;
  }

  if (BOARDS.length) {
    selectBoard(selected);
  } else {
    renderAll();
    fitView();
  }
})();
</script>
</body>
</html>
