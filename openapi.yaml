openapi: 3.1.0
info:
  title: HIDS AI 研判平台 API
  version: 2026-11-11
  description: |
    依据 backend/server.js 和 backend/maintenance-server.js 的实际路由整理。
    客户前端默认运行于 8081，反向代理 /api/* 到业务后端 8080；维护页面默认运行于 18082，同源转发到仅允许本机访问的维护 API 18081。
    业务 Basic 认证仅在 HIDS_BASIC_AUTH_PASSWORD 已配置时启用。所有业务 API 都沿用该认证；业务认证失败返回纯文本 401。
    Syslog 是 15514/UDP 输入，不属于 HTTP OpenAPI；深度研判与常规研判的 HTTP 接口分别列出。

    启动闸门（P003-T025）：`CLOUDWALKER_URL`、`CLOUDWALKER_API_TOKEN`、`LLM_BASE_URL`、`LLM_API_KEY`、`LLM_MODEL` 五项必填，
    缺任一项 `node server.js` 不监听、把缺的键名逐个列到 stderr 并以非 0 退出码结束；进程起来后生效值与非机密状态看 `GET /api/config`。
    取值校验（同属闸门）：`HIDS_TRIAGE_INPUT_MODE` 只能是 `syslog` 或 `poll`（不设或空串＝缺省 `syslog`），
    其他值同样拒绝启动——stderr 点名键与坏值（`配置值无效：HIDS_TRIAGE_INPUT_MODE=<坏值>（只能是 syslog 或 poll）`），
    并落一条 `server.start_failed`（`what: "config"`，`invalid` 每条含 `key` / `value` / `allowed`）。
    **不许静默按 `poll` 跑**：打错一个字会让 syslog 接收器悄悄关掉。
    Basic 鉴权口令、两个管理员令牌与知识库凭据不是必填：不配只是那项能力空着。

    错误口径（P003-T024）：业务接口的失败分四类，每类一个稳定 `code`，状态码由类决定，同一类在哪条路由上都是同一对：
    `caller_error` → 4xx（400 参数/正文、403 权限、404 不存在、405 方法、409 状态冲突、410 已下线、422 无法溯源）；
    `not_configured` → 503；`upstream_error` → 502；`internal_error` → 500（正文固定「服务器内部错误」，异常原文与堆栈只进服务端日志）。
    正文一律 `{ error, code }`：`error` 是给人看的原话（上游失败时就是上游那句摘要），`code` 是给程序判的稳定标识。
    例外只有两处：业务认证失败的 401 是纯文本（见 `BusinessUnauthorized`）；`/api/status` 配了却连不上时 502 仍是业务体
    `{configured, connected, reason, code}`。任意路由都可能回 500 `internal_error`（本程序意外），响应里不逐条重复列。
servers:
  - url: http://127.0.0.1:8080
    description: 业务后端直连入口
  - url: http://127.0.0.1:8081
    description: 客户前端同源入口，转发业务 API
security:
  - basicAuth: []
tags:
  - name: 状态
  - name: 数据管理
  - name: 日志
  - name: 告警
  - name: 自动研判
  - name: 深度研判
  - name: 规则
  - name: Rego 规则
  - name: 知识库
  - name: 维护服务
paths:
  /api/session:
    get:
      tags: [状态]
      summary: 校验业务访问身份
      operationId: getSession
      description: |
        通过 Basic 认证后回账号与角色，供控制台壳显示"账号 + 角色"。
        业务侧只有一套 Basic 账号，角色固定为 `operator`（值守操作员）；管理员权限属于维护端令牌那条线，不在业务 API 内。
        未配置 `HIDS_BASIC_AUTH_PASSWORD`（Basic 认证未启用）时任何人都能访问，没有账号可报，`user` 与 `role` 都是 null。
      responses:
        '200':
          description: 已通过业务访问认证，或未启用 Basic 认证
          content:
            application/json:
              schema:
                type: object
                required: [authenticated, user, role]
                properties:
                  authenticated: { type: boolean, const: true }
                  user: { type: [string, 'null'], description: 业务 Basic 账号名；未启用 Basic 认证时为 null }
                  role: { type: [string, 'null'], enum: [operator, null], description: 固定 operator；未启用 Basic 认证时为 null }
        '401': { $ref: '#/components/responses/BusinessUnauthorized' }
  /api/config:
    get:
      tags: [状态]
      summary: 获取非机密的生效配置
      description: |
        报进程实际生效的配置：监听地址与端口、研判输入模式、牧云与模型「配了没有」、模型名。
        机密（`CLOUDWALKER_API_TOKEN`、`LLM_API_KEY`、`HIDS_BASIC_AUTH_PASSWORD`、`HIDS_PROMPT_ADMIN_TOKEN`、`HIDS_RULE_ADMIN_TOKEN`）
        只在 `secrets` 里给布尔值——响应正文里不出现任何 Token 与密码原文。
        `missing_required` 就是启动闸门用的那份必填差额（P003-T025）：正常起着的进程里恒为空数组。
        `triage_input_mode` 只报**生效值**（恒在 `syslog` / `poll` 里）：未设或空串报缺省 `syslog`；
        表外值（如 `pirate`）不会出现在这里——真进程已被启动闸门拒掉，进程内 `createServer()` 按缺省 `syslog` 生效。
        全部字段读环境变量，不读上游；不返回 503，也不做上游探测。
      operationId: getConfig
      responses:
        '200':
          description: 生效配置（机密只有布尔）
          content:
            application/json:
              schema:
                type: object
                required: [host, port, triage_input_mode, cloudwalker, model, auth, secrets, sources, missing_required]
                properties:
                  host: { type: string, description: 监听地址，缺省 127.0.0.1 }
                  port: { type: integer, description: 监听端口，缺省 8080 }
                  triage_input_mode:
                    type: string
                    enum: [syslog, poll]
                    description: 自动研判输入方式的生效值；未设或空串为 syslog，表外值不会出现（启动闸门已拒）
                  cloudwalker:
                    type: object
                    required: [configured]
                    properties:
                      configured: { type: boolean, description: CLOUDWALKER_URL 与 CLOUDWALKER_API_TOKEN 是否都在 }
                  model:
                    type: object
                    description: |
                      主判口径（`configured` / `name`）与分层后的角色口径（`roles`）在同一段里。
                      `roles` 是 P003-T042 的模型分层：五个角色各用一组配置，组里某个键空就**逐键**回退主判的同名后缀字段，
                      三个键全空时这一组与主判完全一致。只报模型名与来源，不报地址与密钥。
                    required: [configured, name, roles]
                    properties:
                      configured: { type: boolean, description: LLM_BASE_URL / LLM_API_KEY / LLM_MODEL 三项是否齐全 }
                      name: { type: [string, 'null'], description: LLM_MODEL 的值；未配为 null }
                      roles:
                        type: object
                        description: 五个角色各自 resolved 到的模型名与来源（P003-T042）
                        required: [triage, review, rule_maintainer, wiki_maintainer, trace_board]
                        properties:
                          triage: { $ref: '#/components/schemas/ModelRoleResolved' }
                          review: { $ref: '#/components/schemas/ModelRoleResolved' }
                          rule_maintainer: { $ref: '#/components/schemas/ModelRoleResolved' }
                          wiki_maintainer: { $ref: '#/components/schemas/ModelRoleResolved' }
                          trace_board: { $ref: '#/components/schemas/ModelRoleResolved' }
                  auth:
                    type: object
                    required: [basic_auth_enabled]
                    properties:
                      basic_auth_enabled: { type: boolean, description: 配了 HIDS_BASIC_AUTH_PASSWORD 才启用 Basic 认证 }
                  secrets:
                    type: object
                    description: 每条机密只报「有或没有」，不报值
                    required: [CLOUDWALKER_API_TOKEN, LLM_API_KEY, HIDS_BASIC_AUTH_PASSWORD, HIDS_PROMPT_ADMIN_TOKEN, HIDS_RULE_ADMIN_TOKEN]
                    properties:
                      CLOUDWALKER_API_TOKEN: { type: boolean }
                      LLM_API_KEY: { type: boolean }
                      HIDS_BASIC_AUTH_PASSWORD: { type: boolean }
                      HIDS_PROMPT_ADMIN_TOKEN: { type: boolean }
                      HIDS_RULE_ADMIN_TOKEN: { type: boolean }
                  sources:
                    type: object
                    description: |
                      P003-T084 B05：每项生效配置的来源三态——`override`（覆盖文件里的可写键）/
                      `env`（环境变量）/ `default`（都没配，用缺省）。
                    additionalProperties: { type: string, enum: [override, env, default] }
                  missing_required:
                    type: array
                    description: 缺哪几项必填；正常起着的进程是空数组
                    items:
                      type: string
                      enum: [CLOUDWALKER_URL, CLOUDWALKER_API_TOKEN, LLM_BASE_URL, LLM_API_KEY, LLM_MODEL]
        '401': { $ref: '#/components/responses/BusinessUnauthorized' }
    post:
      tags: [状态]
      summary: 写配置（运行中改牧云与模型，持久化且不回显）
      operationId: writeConfig
      description: |
        运行中改牧云与模型的十一项：`CLOUDWALKER_URL`、`CLOUDWALKER_API_TOKEN`、`LLM_BASE_URL`、`LLM_API_KEY`、`LLM_MODEL`，
        以及模型分层的复核组 `LLM_REVIEW_BASE_URL` / `LLM_REVIEW_API_KEY` / `LLM_REVIEW_MODEL` 与轻量组
        `LLM_LIGHT_BASE_URL` / `LLM_LIGHT_API_KEY` / `LLM_LIGHT_MODEL`（P003-T042，走同一套覆盖层）。
        新六键都是可选的：不写它们时五个角色逐键回退主判三项，行为与分层前一致。
        写成功之后：
        - `GET /api/config` 立刻报新值（不用重启进程）；
        - 后续牧云 / 模型调用立刻走新地址与新凭据（进程内客户端原地换值，不新建进程）；
        - 值落盘到**数据根**下的 `config-overrides.json`（`HIDS_DATA_DIR` 指到哪就落哪，没设就是
          `~/.local/share/hids-ai-console/config-overrides.json`；同目录临时文件 + `rename`，权限 0600，只存改过的键），
          **重启进程后仍然生效**；没被改过的键继续读环境变量。
        部分更新：只改正文里出现的键。表外的键一律 400——`HIDS_HOST`、`HIDS_PORT`、`HIDS_TRIAGE_INPUT_MODE`
        改起来必须重启进程；Basic 口令与两个管理员令牌是鉴权凭据本身，不通过这条接口改。
        值的形状按模块级装配处同一套构造器判（URL 必须 http(s)、`CLOUDWALKER_API_TOKEN` 至少 6 位、
        `LLM_API_KEY` 与 `LLM_MODEL` 非空）；校验对象是合并后的生效值。
        **不回显**：响应正文与错误正文里都不出现 Token / 密钥原文——机密只以布尔出现在 `config.secrets` 里；
        日志只落一条 `config.updated`（`keys` 是这次改了的键名），不带值。
        **鉴权**：和其它业务路由一样过 Basic 认证闸门。没配 `HIDS_BASIC_AUTH_PASSWORD`
        （Basic 认证未启用）时 `GET /api/config` 与这条写接口都放行——那是合法部署，不是推荐部署；
        要挡住写就把 Basic 认证配上。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                CLOUDWALKER_URL: { type: string, description: 牧云地址，必须以 http(s):// 开头 }
                CLOUDWALKER_API_TOKEN: { type: string, description: 牧云 API Token，至少 6 位 }
                LLM_BASE_URL: { type: string, description: 模型接口基址，必须以 http(s):// 开头 }
                LLM_API_KEY: { type: string, description: 模型密钥，非空 }
                LLM_MODEL: { type: string, description: 模型名，非空 }
                LLM_REVIEW_BASE_URL: { type: string, description: 复核组：独立复核用的地址，必须以 http(s):// 开头；空则回退 LLM_BASE_URL }
                LLM_REVIEW_API_KEY: { type: string, description: 复核组：独立复核用的密钥，非空；空则回退 LLM_API_KEY }
                LLM_REVIEW_MODEL: { type: string, description: 复核组：独立复核用的模型名，非空；空则回退 LLM_MODEL }
                LLM_LIGHT_BASE_URL: { type: string, description: 轻量组：两个维护者与溯源白板用的地址，必须以 http(s):// 开头；空则回退 LLM_BASE_URL }
                LLM_LIGHT_API_KEY: { type: string, description: 轻量组：密钥，非空；空则回退 LLM_API_KEY }
                LLM_LIGHT_MODEL: { type: string, description: 轻量组：模型名，非空；空则回退 LLM_MODEL }
                LLM_TEMPERATURE: { type: string, description: 'P003-T084：采样温度 0 到 2（缺省 0）' }
                LLM_MAX_TOKENS: { type: string, description: 'P003-T084：最大输出 token 1 到 200000（缺省不传）' }
                LLM_TIMEOUT_MS: { type: string, description: 'P003-T084：模型调用超时毫秒 1000 到 600000（缺省 90000）' }
                HIDS_AGENT_MAX_TURNS: { type: string, description: 'P003-T084：研判调查轮次上限 1 到 50（缺省 6）' }
                HIDS_AGENT_MAX_TOOL_CALLS: { type: string, description: 'P003-T084：单次调查工具调用上限 1 到 100（缺省 8）' }
                HIDS_AGENT_CONCLUSION_RETRIES: { type: string, description: 'P003-T084：结论引用校验退回次数 0 到 10（缺省 2）' }
            examples:
              changeModel:
                summary: 只换模型名（部分更新，其余四项不动）
                value: { 'LLM_MODEL': qwen2.5-72b-instruct }
      responses:
        '200':
          description: |
            写成功。`updated` 是这次改了哪几个键（正文里的顺序）；`config` 是写完之后的生效值，
            与 `GET /api/config` 的 200 正文同形状同机密口径（八键恒在、机密只布尔），字段表见该接口。
          content:
            application/json:
              schema:
                type: object
                required: [updated, config]
                properties:
                  updated:
                    type: array
                    items:
                      type: string
                      enum: [CLOUDWALKER_URL, CLOUDWALKER_API_TOKEN, LLM_BASE_URL, LLM_API_KEY, LLM_MODEL,
                        LLM_REVIEW_BASE_URL, LLM_REVIEW_API_KEY, LLM_REVIEW_MODEL,
                        LLM_LIGHT_BASE_URL, LLM_LIGHT_API_KEY, LLM_LIGHT_MODEL]
                  config:
                    type: object
                    additionalProperties: true
                    description: 生效配置快照，与 `GET /api/config` 的 200 正文同形状（字段表见该接口）
              examples:
                changed:
                  summary: 只换了模型名
                  value:
                    updated: [LLM_MODEL]
                    config:
                      host: 127.0.0.1
                      port: 8080
                      triage_input_mode: syslog
                      cloudwalker: { configured: true }
                      model:
                        configured: true
                        name: qwen2.5-72b-instruct
                        roles:
                          triage: { model: qwen2.5-72b-instruct, source: primary }
                          review: { model: qwen3-32b-review, source: own }
                          rule_maintainer: { model: qwen-flash, source: own }
                          wiki_maintainer: { model: qwen-flash, source: own }
                          trace_board: { model: qwen-flash, source: own }
                      auth: { basic_auth_enabled: true }
                      secrets:
                        CLOUDWALKER_API_TOKEN: true
                        LLM_API_KEY: true
                        HIDS_BASIC_AUTH_PASSWORD: true
                        HIDS_PROMPT_ADMIN_TOKEN: false
                        HIDS_RULE_ADMIN_TOKEN: false
                      missing_required: []
        '400':
          description: |
            调用方传错（`code=caller_error`）：正文不是 JSON、不是对象、没有可写项、键不在可写表里、
            值是空串或形状不合法。错误原话只点键名，不回显值。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/BusinessUnauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/data/inventory:
    get:
      tags: [数据管理]
      summary: 盘点七类运行态存储的条数与字节
      operationId: getDataInventory
      description: |
        七类存储各报**条数**与**字节量**，再给一个总数；只读本地运行态目录，不碰牧云、不碰模型、不读日志文件内容。

        | kind | 中文 | 什么算「一条」 | 路径来源 |
        | --- | --- | --- | --- |
        | `cases` | 案卷 | 案件目录下的一级子目录（字节按目录内文件递归累加） | `HIDS_CASES_DIR`，缺省 `<数据根>/cases` |
        | `investigations` | 研判记录 | 一个 `*.json` 文件 | `<数据根>/investigations` |
        | `boards` | 溯源白板 | 一个 `*.json` 文件 | `<数据根>/trace-boards` |
        | `wiki_sessions` | 知识库会话 | 一个 `*.json` 文件 | `<数据根>/wiki-sessions` |
        | `queue` | 研判队列 | 一条队列记录（有研判队列时按进程内记录数，否则读队列文件 `records`）；字节＝队列文件 + 同名 `.archive.jsonl` | `<数据根>/triage-monitor.json` |
        | `logs` | 日志 | 数据根目录**顶层**的一个 `*.log` 文件 | 后端自身不落日志文件（只上 stdout），正常部署下这里是 0 |
        | `config_overrides` | 配置覆盖层 | 那一个覆盖层文件（`config-overrides.json`） | `<数据根>/config-overrides.json` |

        `oldest_at` / `newest_at` 是这一类的条目时刻：文件取 mtime，案卷取目录内**文件**的最新 mtime（空目录退回目录 mtime），
        队列取记录上的 `updated_at`（没有则 `saved_at`、`created_at`）。没有条目时为 `null`。
        `exists` 表示那条存储路径在不在盘上（目录/文件缺失不报错，按 `count: 0` 返回，`exists: false`）。
        每次请求都现扫盘：`POST /api/data/cleanup` 执行完再调它，数字立刻是清理后的。
      responses:
        '200':
          description: 七类存储的占用明细与总数（`stores` 顺序固定，见 `DataStoreUsage.kind` 的枚举顺序）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataInventory'
        '401': { $ref: '#/components/responses/BusinessUnauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/data/cleanup:
    post:
      tags: [数据管理]
      summary: 按类型与阈值归档或删除老数据（默认 dry-run 只报清单）
      operationId: cleanData
      description: |
        按 `kind`（与盘点同一套七类）与阈值挑候选，再按 `action` **归档**或**删除**。
        **默认 dry-run**：`execute` 不给或为 `false` 时只回将清清单（`candidates`），盘上一个字节都不动；
        带 `"execute": true` 才真执行。

        阈值（两条都要给至少一条，一个都不给回 400——不许无阈值一把抹掉）：
        - `older_than`：ISO 8601 时间，**早于**它的条目进候选；
        - `keep`：保留**最新** N 条（按条目时刻倒序），排在它后面的进候选。
        两条同时给时取**并集**（不重复计）。

        动作：
        - `archive`（缺省）：文件/案卷目录 `rename` 进 `<数据根>/archive/<kind>/<执行时刻>-<原名>`；队列记录追加到
          `<数据根>/triage-monitor.json.archive.jsonl`（带 `archived_at`，与 TTL 归档同格式）再移出队列。
        - `delete`：直接删文件/目录；队列记录从内存与队列文件里删掉（同时失效对应去重条目）。

        **已完结案件才可清**：`queue` 的候选里只要有一条状态不是 `done`（`queued` / `running` / `failed` 都算没完），
        整个请求回 **409**，盘上一动不动；`cases` 的候选目录上挂着非 `done` 记录的同样 409。
        没有装配研判队列（没配牧云或模型）时清 `queue` 回 **503**（不拿队列文件硬删，那是另一条进程的状态）。

        **留痕**：`execute: true` 且真的执行时落一条 `data.cleaned` 日志，字段只有 `kind` / `action` / `count` / `bytes`——
        与 `config.updated` 同口径：不记文件名、不记记录内容。dry-run 不留痕。

        响应里的 `inventory` 是**执行之后**重新扫出来的盘点（dry-run 时就是当下未变的数字），
        与紧接着调 `GET /api/data/inventory` 的结果一致。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataCleanupRequest'
            examples:
              dryRunOldCases:
                summary: 只看早于 2026-11-01 的案卷会被清几个（不动盘）
                value: { kind: cases, older_than: '2026-11-01T00:00:00.000Z' }
              deleteExtraInvestigations:
                summary: 研判记录只留最新 200 条，多出来的删掉
                value: { kind: investigations, keep: 200, action: delete, execute: true }
              archiveOldWikiSessions:
                summary: 知识库会话早于一个月前的归档
                value: { kind: wiki_sessions, older_than: '2026-10-19T00:00:00.000Z', action: archive, execute: true }
      responses:
        '200':
          description: |
            `candidates` 是将清清单（`truncated: true` 表示超过 100 条只列了前 100）；
            `applied` 是这次真清掉的条数与字节（dry-run 恒为 0）；`inventory` 是执行后的盘点。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataCleanupResult'
        '400':
          description: |
            调用方传错（`code=caller_error`）：正文不是 JSON 对象、`kind` 不在七类里、`action` 不是 archive/delete、
            `execute` 不是布尔、`older_than` 解析不出时间、`keep` 不是非负整数、`older_than` 与 `keep` 一个都没给、带未知参数。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/BusinessUnauthorized' }
        '409':
          description: |
            状态冲突（`code=caller_error`）：候选里有还没完结的案件（`queued` / `running` / `failed`），
            或案卷对应的案件还在排/在跑。整个请求被拒绝，盘上没有任何变化；等研判收尾或把阈值调窄再试。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503':
          description: '`code=not_configured`：没装配研判队列（没配牧云或模型）时清 `queue` 会被拒（不拿队列文件硬删）。'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/dict:
    get:
      tags: [字典]
      summary: 事件类型 / 等级 / 结论 / 案件状态四张字典（机器值 + 中文名）
      operationId: getDictionaries
      description: |
        P003-T059 A09：前端不再硬编码 11 个类型名与等级名。四张表全部取自代码唯一真源
        （`src/shared/vocabulary.js` 的类型表与等级表、`src/contexts/triage/domain/triage-case.js` 的
        结论词表与状态词表）——接口不做第二份对照表。
      responses:
        '200':
          description: 四张字典
          content:
            application/json:
              schema:
                type: object
                required: [event_types, levels, verdicts, triage_statuses]
                properties:
                  event_types:
                    type: array
                    items:
                      type: object
                      required: [key, label]
                      properties:
                        key: { type: string, description: 机器值（如 webshell、honeypot） }
                        label: { type: string, description: 中文名（如 WebShell、蜜罐） }
                  levels:
                    type: array
                    items:
                      type: object
                      required: [key, rank, label]
                      properties:
                        key: { type: string, enum: [low, medium, high, critical] }
                        rank: { type: integer, minimum: 1, maximum: 4 }
                        label: { type: string, description: 中文名（低危/中危/高危/严重） }
                  verdicts:
                    type: array
                    description: 后端三态（前端的「待研判」是 review 投影，不是第四种结论）
                    items:
                      type: object
                      required: [key, label]
                      properties:
                        key: { type: string, enum: [threat, uncertain, false_positive] }
                        label: { type: string }
                  triage_statuses:
                    type: array
                    items: { type: string, enum: [not_queued, queued, running, done, failed] }
        '401': { $ref: '#/components/responses/BusinessUnauthorized' }
  /api/agent/triage/{alertId}/case-files:
    get:
      tags: [研判]
      summary: 列出一条案件的案卷材料清单（白名单文件 + 字节数 + mtime）
      operationId: listCaseFiles
      description: |
        P003-T059 A02。案卷的 9 个文件（原始告警 / 字段表 / 研判事实 / 判据索引 / 上下文 / 结果 / result.json /
        必查项）此前只有 `case_dir` 本地路径字符串外发，HTTP 侧读不到。清单只列白名单文件且盘上真实存在的；
        没有案卷目录（无 syslog 报文或未匹配）回 404。
      parameters:
        - { name: alertId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 案卷材料清单
          content:
            application/json:
              schema:
                type: object
                required: [alert_id, case_dir, files]
                properties:
                  alert_id: { type: string }
                  case_dir: { type: string, description: 数据根下的案卷目录（相对部署机） }
                  files:
                    type: array
                    items:
                      type: object
                      required: [name, bytes, mtime]
                      properties:
                        name: { type: string, description: 白名单文件名 }
                        bytes: { type: integer }
                        mtime: { type: string }
        '400':
          description: 告警 ID 无效（`code=caller_error`）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 该告警没有案卷目录（`code=caller_error`）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/BusinessUnauthorized' }
  /api/agent/triage/{alertId}/case-files/{name}:
    get:
      tags: [研判]
      summary: 读一份案卷材料正文（白名单精确匹配；按扩展名给 content-type）
      operationId: readCaseFileByName
      description: |
        P003-T059 A02。文件名必须在白名单内（精确匹配）——路径穿越（`../`、绝对路径、URL 编码变体）
        不可能命中白名单，一律 400；案卷目录内不存在该文件回 404。扩展名 → content-type：
        `.md` text/markdown、`.txt` text/plain、`.json` application/json。
      parameters:
        - { name: alertId, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string, description: 白名单文件名，URL 编码 } }
      responses:
        '200':
          description: 文件正文
          content:
            text/markdown:
              schema: { type: string }
            text/plain:
              schema: { type: string }
            application/json:
              schema: { type: object, additionalProperties: true }
        '400':
          description: 文件名不在白名单（含穿越变体）或告警 ID 无效（`code=caller_error`）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 无案卷目录或该案卷还没有这份材料（`code=caller_error`）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/BusinessUnauthorized' }
  /api/wiki/pages/{pagePath}:
    put:
      tags: [知识库]
      summary: 改写一页判据（乐观锁）
      operationId: updateWikiPage
      description: |
        通过控制台直接编辑判据页。乐观锁：`expected_revision` 必须与当前版本一致，不一致回 409。
        写入后旧版进 `wiki-history/`、`log.md` 记账。页面 ID 必须保持一致，状态须为 active、draft 或 deprecated。
        需要判据来源（evidence 或 source）。正文 1 到 30000 字。
      parameters:
        - { name: pagePath, in: path, required: true, schema: { type: string, description: '判据页路径（如 honeypot/HP-01.md），URL 编码' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content, expected_revision]
              properties:
                content: { type: string, description: 页面正文（含 frontmatter），1 到 30000 字 }
                expected_revision: { type: string, pattern: '^[0-9a-f]{16}$', description: 当前版本指纹（sha256 前 16 位） }
      responses:
        '200':
          description: 更新后的页面元数据
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WikiPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/BusinessUnauthorized' }
        '409':
          description: 页面版本已变（`code=caller_error`），请刷新后重试
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/batch/{action}:
    post:
      tags: [研判]
      summary: 业务级批量操作（入队 / 批量误报 / 批量处置）
      operationId: batchAction
      description: |
        P003-T069 A07。`action` 取 `enqueue` / `false-positive` / `dispose`。
        单次上限 100 条；重复 ID 自动去重（按首次出现顺序执行）；**部分失败不整体回滚**——
        返回 `accepted[]` 与 `rejected[{id, reason}]`，拒绝原因复用 caller 类错误口径。
      parameters:
        - { name: action, in: path, required: true, schema: { type: string, enum: [enqueue, false-positive, dispose] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alert_ids]
              properties:
                alert_ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: string }
                reason: { type: string, description: '仅 false-positive：10 到 4000 字' }
                who: { type: string, maxLength: 100 }
                disposition:
                  type: string
                  enum: [confirmed_threat, dismissed, escalated, parked]
                  description: '仅 dispose；缺省 dismissed'
      responses:
        '200':
          description: 逐条结果
          content:
            application/json:
              schema:
                type: object
                required: [action, accepted, rejected]
                properties:
                  action: { type: string }
                  accepted: { type: array, items: { type: string } }
                  rejected:
                    type: array
                    items:
                      type: object
                      required: [id, reason]
                      properties:
                        id: { type: string }
                        reason: { type: string }
        '400':
          description: 参数非法（空数组 / 超上限 / 无效 ID / 无效处置位），`code=caller_error`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/BusinessUnauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/agent/triage/{alertId}/raw:
    get:
      tags: [研判]
      summary: 读原始报文与完整载荷（分页，凭据字段擦除）
      operationId: getRawPayload
      description: |
        P003-T068 A14。返回原始 syslog 文本（≤60000 字）与载荷键值分页（count ≤200）。
        token / password / secret / api_key / cookie / authorization 类键的值一律 `[redacted]`（过现有擦除闸）。
        该告警没有原始报文（poll 入队）回 404。
      parameters:
        - { name: alertId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/Count' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: 原始报文与载荷页
          content:
            application/json:
              schema:
                type: object
                required: [alert_id, raw, payload_total, payload, truncated]
                properties:
                  alert_id: { type: string }
                  raw: { type: string }
                  msgid: { type: [string, 'null'] }
                  payload_total: { type: integer }
                  payload:
                    type: array
                    items:
                      type: object
                      required: [key, value]
                      properties:
                        key: { type: string }
                        value: {}
                  truncated: { type: boolean }
                  echo:
                    type: object
                    properties:
                      count: { type: integer }
                      offset: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/BusinessUnauthorized' }
        '404':
          description: 该告警没有原始报文（`code=caller_error`）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
