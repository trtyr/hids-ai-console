        P003-T089：一条连接承载四类进度，替代「各 Agent 各自轮询」。
        事件格式恒为 `{type, topic, at, ...}`：
        `type` ∈ `snapshot`（订阅时的当前态）/ `progress`（变化）/ `error`；
        `topic` ∈ `triage`（队列与案件）/ `board`（白板）/ `investigation`（深度研判）/ `fp`（误报维护）。
        `/api/agent/investigations?stream=1` 是「一次请求一路流」，本接口是「一条连接看全部」，两者并存。
        每 15 秒一条 `: heartbeat` 注释。
      parameters:
        - name: topics
          in: query
          description: 逗号分隔的 topic 列表，缺省全部四个
          schema: { type: string, default: 'triage,board,investigation,fp' }
        - name: interval_ms
          in: query
          description: 变化检测间隔（500 到 60000，缺省 2000）
          schema: { type: integer, minimum: 500, maximum: 60000, default: 2000 }
      responses:
        '200':
          description: SSE 流
          content:
            text/event-stream:
              schema: { type: string, description: 'data: {type, topic, at, ...}；: heartbeat 注释' }
        '400':
          description: topic 不认识或 interval_ms 越界（`code=caller_error`）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/BusinessUnauthorized' }
  /api/audit:
    get:
      tags: [审计]
      summary: 查审计流（谁在何时对什么做了什么；append-only，独立于技术日志）
      operationId: listAuditEvents
      description: |
        P003-T062 起所有**写接口**（POST/PUT/DELETE，dry-run 除外）都留审计事件；只读接口不产生事件。
        存储是 append-only 的按天 JSONL（`<数据根>/audit/audit-<日期>.jsonl`），**不随技术日志的轮转或清理消失**。

        事件形状：`{ at, actor: {kind, id}, action, object, before, after, result, request_id }`——
        `actor.kind` 取 `user`（登录身份或未鉴权部署的 anonymous）/ `token`（静态管理员令牌，不含明文）/ `system`；
        `result` 取 `ok` / `denied` / `error`；机密键的新旧值只记 `[redacted-changed]`，不落原文。

        `request_id` 与技术日志（`GET /api/logs?request_id=`）共用同一请求链 id：审计回答「谁做的」，
        日志回答「当时发生了什么」。

        过滤（都给就是 AND）：`from` / `to`（闭区间，与 /api/logs 同一套解析）、`actor` / `action` / `object`
        （不区分大小写的部分匹配）、`result`（精确，只能是 ok / denied / error，表外值回 400）。
        分页与 total 口径同 `/api/logs`。
      parameters:
        - { $ref: '#/components/parameters/Count' }
        - { $ref: '#/components/parameters/Offset' }
        - { name: from, in: query, description: 起始时间（含），ISO 8601 或 Unix 秒/毫秒, schema: { type: string } }
        - { name: to, in: query, description: 结束时间（含），ISO 8601 或 Unix 秒/毫秒, schema: { type: string } }
        - { name: actor, in: query, description: 按 actor（kind/id 合串）部分匹配, schema: { type: string } }
        - { name: action, in: query, description: 按动作名部分匹配（如 config.write、rule.write）, schema: { type: string } }
        - { name: object, in: query, description: 按 object JSON 部分匹配（如 alert_id）, schema: { type: string } }
        - { name: result, in: query, description: 精确筛选 ok / denied / error, schema: { type: string, enum: [ok, denied, error] } }
      responses:
        '200':
          description: 筛选后的审计事件页
          content:
            application/json:
              schema:
                type: object
                required: [events, total, truncated, echo]
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      required: [at, actor, action, result]
                      properties:
                        at: { type: string, description: 事件时刻（ISO 8601） }
                        actor:
                          type: object
                          required: [kind, id]
                          properties:
                            kind: { type: string, enum: [user, token, system] }
                            id: { type: string, description: 登录名 / 令牌用途标注（不含明文）/ backend }
                        action: { type: string, description: 审计动作名（见 description 的动作清单） }
                        object: { type: object, nullable: true, additionalProperties: true }
                        before: { nullable: true, additionalProperties: true }
                        after: { nullable: true, additionalProperties: true }
                        result: { type: string, enum: [ok, denied, error] }
                        request_id: { type: string, nullable: true, description: 与技术日志共用的请求链 id }
                  total: { type: integer, description: 筛选后、切页前的条数 }
                  truncated: { type: boolean, description: 扫描超过 20000 条时为 true }
                  echo:
                    type: object
                    properties:
                      count: { type: integer }
                      offset: { type: integer }
        '400':
          description: 调用方传错（count/offset/时间/result 非法），`code=caller_error`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/BusinessUnauthorized' }
  /api/logs:
    get:
      tags: [日志]
      summary: 查落盘的日志（按 event / level / 时间范围过滤，分页）
      operationId: getLogs
      description: |
        **读的是盘上的文件**，不是进程内存：当前活动文件（`HIDS_LOG_FILE`）加上轮转出来的历史文件
        （`<名>.<2026-11-20T02-44-01-123Z>.log`），现读现解析，每个请求都反映盘的当下状态。

        没配 `HIDS_LOG_FILE` 时进程不落文件、这里也没有东西可读——回 **503** `not_configured`，不拿空列表冒充「没有日志」。

        过滤（都给就是 AND）：
        - `event`：事件名精确匹配，逗号分隔可多选（与 `/api/alerts` 的 `level` 同一套写法）；
        - `level`：`info` / `warn` / `error`，逗号分隔可多选；表外值回 400；
        - `from` / `to`：时间范围，**闭区间**（含端点），ISO 8601 或秒/毫秒 Unix 时间（与 `/api/alerts` 同一套解析）；解析不出回 400，`from > to` 回 400。

        分页：`count` 缺省 20、1 到 50；`offset` 缺省 0、不小于 0——与其它分页路由同一套 400「分页参数无效」。
        `total` 是**筛选后、切页前**的条数，`echo` 回显本次分页参数。

        结果按 `time` 倒序（新的在前）。承载不住的情况只有一种：命中超过 20000 条时只收前 20000 条并回 `truncated: true`
        （先收满就停，不再往下扫文件）——调窄时间范围再查。

        响应里的每条就是落盘那行 JSON（`time` / `level` / `event` + 字段）。落盘时已经过脱敏两道闸，读的时候按同一套规则
        **再擦一遍**：`Authorization` / `Cookie` / `Token` 之类既不进文件，也不会出现在这里。
      parameters:
        - { $ref: '#/components/parameters/Count' }
        - { $ref: '#/components/parameters/Offset' }
        - name: event
          in: query
          description: 事件名，逗号分隔可多选（如 `http.request,triage.done`）
          schema: { type: string }
        - name: level
          in: query
          description: 日志级别，逗号分隔可多选（info/warn/error 之外的值回 400，实现不校验 enum 而按描述语义处理）
          schema: { type: string }
        - name: from
          in: query
          description: 起始时间（含），ISO 8601 或 Unix 秒/毫秒
          schema: { type: string }
        - name: to
          in: query
          description: 结束时间（含），ISO 8601 或 Unix 秒/毫秒
          schema: { type: string }
      responses:
        '200':
          description: 筛选后的日志页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogQueryResult'
        '400':
          description: |
            调用方传错（`code=caller_error`）：`count` 不在 1..50、`offset` 为负或非整数（`分页参数无效`）、
            `level` 不在 `info/warn/error` 里、`from`/`to` 解析不出时间、`from` 晚于 `to`。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/BusinessUnauthorized' }
        '503':
          description: '`code=not_configured`：没配 `HIDS_LOG_FILE`（日志只上 stdout，没有文件可读）。'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/logs/cleanup:
    post:
      tags: [日志]
      summary: 按时间 / 总大小清理轮转出来的旧日志文件（默认 dry-run 只报清单）
      operationId: cleanLogs
      description: |
        清的是**轮转出来的历史文件**；当前活动文件（`HIDS_LOG_FILE` 本身，正在追加的那一份）**永不在候选里**——
        删了它，正在写的那一行就断在半行上。

        阈值（两条都要给至少一条，一个都不给回 400——不许无阈值一把抹掉），同时给时取**并集**：
        - `older_than`：ISO 8601 时间，历史文件 **mtime 早于**它的进候选；
        - `max_bytes`：历史文件总字节上限；超了就从**最老的**删起，删到不超为止。

        **默认 dry-run**：`execute` 不给或为 `false` 时只回候选清单，盘上一个字节都不动；带 `"execute": true` 才真删。

        **留痕**：`execute: true` 时落一条 `log.cleaned` 日志，字段只有 `by`（`age` / `size` / `age+size`）、`count`、`bytes`——
        与 `data.cleaned` 同口径：不记文件名、不记日志内容。dry-run 不留痕。

        没配 `HIDS_LOG_FILE` 回 **503** `not_configured`（没有文件可清）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogCleanupRequest'
            examples:
              dryRunBySize:
                summary: 只看历史文件总字节压到 10 MiB 以内会删哪几个（不动盘）
                value: { max_bytes: 10485760 }
              deleteOlderThanAWeek:
                summary: 真删一周前的历史文件
                value: { older_than: '2026-11-13T00:00:00.000Z', execute: true }
      responses:
        '200':
          description: |
            `candidates` 是将清清单（`truncated: true` 表示超过 100 个文件只列了前 100）；
            `applied` 是这次真删掉的个数与字节（dry-run 恒为 0）；`remaining` 是执行后重新扫出来的历史文件余量。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogCleanupResult'
        '400':
          description: |
            调用方传错（`code=caller_error`）：正文不是 JSON 对象、`execute` 不是布尔、
            `older_than` 解析不出时间、`max_bytes` 不是非负整数、`older_than` 与 `max_bytes` 一个都没给、带未知参数。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/BusinessUnauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503':
          description: '`code=not_configured`：没配 `HIDS_LOG_FILE`（日志只上 stdout，没有文件可清）。'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/status:
    get:
      tags: [状态]
      summary: 检查牧云连接
      operationId: getCloudwalkerStatus
      responses:
        '200':
          description: |
            配置和连接状态。未配置牧云时 configured=false 且 connected=false；配置且连通时 connected=true。
            不返回 503：未配置不是服务不可用。
          content:
            application/json:
              schema:
                type: object
                required: [configured, connected]
                properties:
                  configured: { type: boolean }
                  connected: { type: boolean }
                  reason: { type: string }
                additionalProperties: true
        '502':
          description: |
            牧云连接失败（配置在、连不上）。状态码 502 在这里是业务体，不是「整个服务不可用」：
            正文仍是 {configured, connected, reason}，configured 恒为 true、connected 恒为 false，
            reason 是上游错误原文（截断与凭据擦除同其它错误体），末位多一个稳定 code=upstream_error。
            调用方按正文判断连接状态，不要只看状态码。
          content:
            application/json:
              schema:
                type: object
                required: [configured, connected, reason, code]
                properties:
                  configured: { type: boolean, const: true }
                  connected: { type: boolean, const: false }
                  reason: { type: string }
                  code: { type: string, const: upstream_error }
  /api/updates:
    get:
      tags: [状态]
      summary: 获取面向客户的版本与更新日志
      description: 不返回提示词正文和升级包明文。
      operationId: getUpdates
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
  /api/agent/status:
    get:
      tags: [状态]
      summary: 获取研判模型与提示词版本状态
      operationId: getAgentStatus
      responses:
        '200':
          description: 研判服务状态
          content:
            application/json:
              schema:
                type: object
                required: [configured, model, missing, prompt_version]
                properties:
                  configured: { type: boolean }
                  model: { type: [string, 'null'] }
                  missing: { type: array, items: { type: string } }
                  prompt_version: { type: string }
  /api/agent/tools:
    get:
      tags: [状态]
      summary: 列出牧云 API 只读取证工具
      operationId: listAgentTools
      responses:
        '200': { $ref: '#/components/responses/ToolCatalog' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/trace/tools:
    get:
      tags: [状态]
      summary: 列出牧云 MCP 只读取证工具
      operationId: listTraceTools
      responses:
        '200': { $ref: '#/components/responses/ToolCatalog' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/agent/prompts:
    get:
      tags: [状态]
      summary: 获取提示词版本元数据
      description: 仅元数据，不返回提示词正文。业务端不提供修改接口。
      operationId: getPromptMetadata
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
  /api/agent/prompts/upload:
    post:
      tags: [状态]
      summary: 已停用的业务端提示词上传入口
      description: 提示词升级改由独立维护 API 执行；此入口始终拒绝上传。
      operationId: legacyPromptUpload
      deprecated: true
      responses:
        '410':
          description: 入口已停用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/alerts:
    get:
      tags: [告警]
      summary: 分页获取牧云告警
      description: |
        11 类牧云事件按事件时间倒序合并后分页。筛选项全部可选：一个都不带时行为与只有 count/offset 的请求一致，
        total 为各类事件总数之和。

        过滤顺序固定为：type 下推（只查该类）→ 合并 → level / q / from / to 过滤 → offset/count 切页；
        此时 total 是过滤后条数。triage_status / verdict 要等研判记录挂上之后才能判，所以服务端逐页扫描后再过滤、再切页，
        total 是匹配条数。

        带 level / q / from / to 或 sort=level 时单次请求最多扫描 500 条原始事件（研判侧筛选同样最多扫 500 条）；
        扫到上限仍未到流末时返回 truncated=true，此时 total 只统计扫描窗口内的匹配。

        顶层 triage_configured 说明本进程是否配了自动研判：为 false 时 alerts[].triage 恒为 null，
        triage_status / verdict 筛选按「无研判记录」口径（全部算 not_queued / review）。
      operationId: listAlerts
      parameters:
        - $ref: '#/components/parameters/Count'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/AlertType'
        - $ref: '#/components/parameters/AlertLevel'
        - $ref: '#/components/parameters/AlertQuery'
        - $ref: '#/components/parameters/AlertFrom'
        - $ref: '#/components/parameters/AlertTo'
        - $ref: '#/components/parameters/AlertSort'
        - $ref: '#/components/parameters/TriageStatus'
        - $ref: '#/components/parameters/Verdict'
      responses:
        '200':
          description: 合并后的告警页；partial 为 true 时 errors 包含部分类型失败原因，truncated 为 true 时 total 只覆盖扫描窗口
          content:
            application/json:
              schema:
                type: object
                required: [alerts, total, totals, errors, partial, triage_configured]
                properties:
                  alerts: { type: array, items: { $ref: '#/components/schemas/Alert' } }
                  total:
                    type: integer
                    description: 不带 level/q/from/to/triage_status/verdict 时为各类事件 total 之和；带筛选时为过滤后的条数
                  totals: { type: object, additionalProperties: { type: integer } }
                  errors: { type: object, additionalProperties: { type: string } }
                  partial: { type: boolean }
                  triage_configured:
                    type: boolean
                    description: 是否配置了自动研判（有研判监视器）；false 时 alerts[].triage 恒为 null
                  truncated:
                    type: boolean
                    description: 扫描窗口被截断（仅带筛选或 sort=level 时可能为 true）；为 true 时 total 不是全量精确值
              examples:
                filtered:
                  value:
                    alerts: [{ id: 'webshell:1', title: WebShell, createdAt: '2026-11-01T08:00:00Z', asset: db-1,
                      level: 严重, levelKey: critical, verdict: 待研判, verdictKey: review, triage: null }]
                    total: 1
                    totals: { webshell: 1 }
                    errors: {}
                    partial: false
                    triage_configured: true
                    truncated: false
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/alerts/{alertId}:
    get:
      tags: [告警]
      summary: 获取指定牧云事件详情
      description: |
        返回告警摘要与牧云原始详情。错误码按「牧云可达性」分：
        - 牧云可达、但这条事件读不到（GetEvent 报错、返回空结果，或结果里没有事件身份）→ 404；
        - 连不上牧云（传输 / HTTP / JSON-RPC 失败，且同类事件列表也失败）→ 502；
        - 上游返回了别的事件 ID 属于自相矛盾 → 502，不归为 404。

        告警 ID 格式不对或事件类型不在枚举内 → 400；未配置牧云 → 503。
      operationId: getAlert
      parameters:
        - $ref: '#/components/parameters/AlertId'
      responses:
        '200':
          description: 告警摘要和牧云原始详情
          content:
            application/json:
              schema:
                type: object
                required: [alert, detail]
                properties:
                  alert: { $ref: '#/components/schemas/Alert' }
                  detail: { $ref: '#/components/schemas/AlertDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: 牧云可达但没有这条事件（ID 不存在或已不可见）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502': { $ref: '#/components/responses/BackendError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/agent/triage/status:
    get:
      tags: [自动研判]
      summary: 获取自动研判队列汇总
      description: |
        队列状态 + 三个聚合：`counts`（四种状态）、`verdict_counts`（结论分布）、`type_counts`（事件类型分布）。
        带 `since` 时三个聚合都只算「进入队列时刻（`created_at`）不早于该时刻」的记录；`initialized` / `enabled` /
        `input_mode` / `last_error` / `last_poll_at` / `syslog` 不受 `since` 影响。
        syslog 模式下没有轮询，`last_poll_at` 恒为 null，最后一条报文的到达时刻看 `last_received_at`。
      operationId: getTriageStatus
      parameters:
        - $ref: '#/components/parameters/TriageSince'
      responses:
        '200':
          description: 队列状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TriageSummary' }
        '400':
          description: since 解析不出来
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/agent/triage/cases:
    get:
      tags: [自动研判]
      summary: 分页读取 Syslog 案件
      description: |
        默认按收到顺序倒序（最新在前）；`sort=verdict` 改成结论排序：threat → uncertain → false_positive → 无结论，同档仍按时间倒序。
        `total` 是过滤后的条数，`cases` 是切出来的当前页。结论口径与 `GET /api/alerts?verdict=` 一致：记录上没有结论算 review。
        时间筛（`from`/`to`）按 syslog 事件时间（`event_time`，含部署端 `HIDS_SYSLOG_TIME_OFFSET_MINUTES` 偏移）比，时间解析不出来的案件在带时间筛选时被排除。
      operationId: listTriageCases
      parameters:
        - $ref: '#/components/parameters/Count'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Verdict'
        - $ref: '#/components/parameters/CaseType'
        - $ref: '#/components/parameters/CaseHost'
        - $ref: '#/components/parameters/AlertFrom'
        - $ref: '#/components/parameters/AlertTo'
        - $ref: '#/components/parameters/CaseSort'
      responses:
        '200':
          description: 案件列表，包含未匹配牧云事件的记录
          content:
            application/json:
              schema:
                type: object
                required: [total, cases]
                properties:
                  total: { type: integer, description: 过滤后的条数；不带筛选时是全部案件数 }
                  cases: { type: array, items: { $ref: '#/components/schemas/TriageCaseListItem' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/agent/triage/control:
    put:
      tags: [自动研判]
      summary: 暂停或恢复自动研判
      description: |
        暂停期间收到的 Syslog **不丢**：报文进暂停缓冲区排队（有上限，超出的丢弃并计数，见 `TriageSummary.paused.dropped`），
        恢复时先把缓冲区逐条回灌再继续出队。轮询模式下暂停期间不累游标，恢复后从原游标继续扫，暂停期间新增的告警同样会补判。
        已经在跑的研判会跑完；排队中的记录不会被清空。
      operationId: setTriageEnabled
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
              additionalProperties: false
      responses:
        '200':
          description: 更新后的队列状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TriageSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/agent/triage/{alertId}:
    parameters:
      - $ref: '#/components/parameters/TriageId'
    get:
      tags: [自动研判]
      summary: 查询单条研判任务和步骤
      operationId: getTriageRecord
      responses:
        '200':
          description: 任务状态；未入队时 status 为 not_queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TriageCase' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [自动研判]
      summary: 手动入队或重试指定告警
      operationId: retryTriage
      description: |
        按牧云事件 ID 入队——**现查告警送研判走的就是这一条**：`{alertId}` 是 `GET /api/alerts` 里那条事件的 `id`
        （形如 `webshell:62169`），不要求先有 syslog 报文。入队后由研判队列按事件 ID 从牧云读 `get_<类型>_event`
        详情、跑一轮常规研判（`mode=triage`），结果按同一 ID 落研判记录——与推送（syslog）入队同一套状态机、同一个
        `TriageCase` 形状，只是记录上没有 `syslog` / `case_dir` 键。

        **重复入队语义**：同一 alert ID 只有一条记录（键就是 `alert_id`），重复 POST 不会产生第二条、也不会排第二份工。
        - 排队中（`queued`）：幂等——刷新这条记录的排队信息，仍是一条，不返回 409；
        - 在跑中（`running`）：不重启，202 回当前记录（`status=running`）；
        - 已完成 / 失败（`done` / `failed`，含死信）：按**人工重试**处理——状态回到 `queued`，`attempts` 加 1，
          `created_at` 沿用原值，重跑一轮。

        重跑时 **人工登记过误报的记录**（`verdict=false_positive` 且 `decision_source=human`）只刷新 `report` / `evidence` / `saved_at` 等，
        `verdict` / `verdict_label` / `summary` / `decision_source` 与 `feedback` 原样保留；AI 自己判出的 `false_positive` 不在此列，照常被这次研判覆盖。
      responses:
        '202':
          description: 已接受任务；正在运行的任务不会重复启动
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TriageCase' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      tags: [自动研判]
      summary: 取消排队中的研判记录
      operationId: cancelTriage
      description: |
        把一条还没在研判的记录（`queued` 或 `failed`，含死信）从队列里撤掉：记录删除，同时失效指向它的去重条目，
        之后同一条 syslog 报文再来会作为新记录入队。已完成的（`done`）或正在跑的（`running`）不能取消。
        取消后 `GET` 这条回 `status=not_queued`。
      responses:
        '200':
          description: 已取消
          content:
            application/json:
              schema:
                type: object
                required: [alert_id, status, cancelled]
                properties:
                  alert_id: { type: string }
                  status: { type: string, enum: [not_queued] }
                  cancelled: { type: boolean }
                additionalProperties: false
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/agent/triage/{alertId}/false-positive:
    parameters:
      - $ref: '#/components/parameters/TriageId'
    post:
      tags: [自动研判]
      summary: 登记误报（带理由），规则与 wiki 两个维护者各自去改
      operationId: reportFalsePositive
      description: |
        值守分析员把一条**已完成**的研判判成误报时走这里。顺序是固定的：

        1. 校验 `reason`／`who`，案件必须存在且 `status` 为 `done`（未完成回 409：重跑会把人工结论覆盖掉）。
        2. **先把这一条写成误报**：`verdict=false_positive`、`verdict_label=误报`、`decision_source=human`，
           写入 `feedback{reason,who,recorded_at}`，并落盘（`monitor.persist()`）。
        3. 才回 202。两个维护者在后台跑，响应不等它们。

        两个维护者都不是跑研判的那个 Agent，各自只改自己的东西：

        - 规则维护者：按案件材料改一条 Rego 或在 `rules/` 新增一条，**一次只动一个文件**；写盘前用 `RuleStore`
          解析校验（子集外语法、id 不合法、`ready:false` 都算失败），过不了原文件一字不动，不留临时文件。
        - wiki 维护者：走知识维护会话产出方法论修订，再用 `publishBundle` 的发布前检查写进判据页；
          只出草案、页没写上算失败。

        维护失败不回滚结论：`verdict` 仍是 `false_positive`，失败只体现在 `maintenance`。
        维护进度用 `GET /api/agent/triage/{alertId}` 读同一个 `maintenance` 字段。
        同一轮维护还在跑时再次登记只回当前进度，不重起一轮。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 10
                  maxLength: 4000
                  description: 误报理由（原话），10 到 4000 字；短于 10 字回 400
                who:
                  type: string
                  maxLength: 100
                  description: 登记人，至少 2 字；省略时取业务账号名，未启用 Basic 认证时是 `operator`
                libraries:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: { type: string, enum: [rule, wiki] }
                  description: |
                    补跑选择器：只重跑指定的库。省略＝两侧都试（仍受幂等约束：已成功而且在同一库版本上的那一侧会跳过）。
                    不是数组、空数组、含 `rule`/`wiki` 之外的值、**含重复项**一律 400（`uniqueItems: true` 不静默去重：
                    幂等键是 `case_id:库:版本`，重复库等于把一次维护说成两次，客户端该看出自己写错了）。
      responses:
        '202':
          description: 结论已落盘为误报，统一维护 Agent 已开始（或已在跑）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FalsePositiveRecord' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/agent/investigations:
    get:
      tags: [深度研判]
      summary: 浏览历史研判记录（全量落盘研判，含 cases 列表列不出的记录）
      description: |
        P003-T059 A01。`GET /api/agent/triage/cases` 只列有原始报文的入队记录；这里列**全部落盘研判**
        （存储文件名是 sha256 不可枚举，浏览入口在这）。`cases_total` 并列给出案件列表口径的条数，
        两个口径的差异一目了然。分页与筛选口径与 /api/logs 一致（非法值 400 caller_error）。
      operationId: listInvestigations
      parameters:
        - { $ref: '#/components/parameters/Count' }
        - { $ref: '#/components/parameters/Offset' }
        - { name: verdict, in: query, description: '按结论筛，逗号分隔可多选（threat/uncertain/false_positive/review；review 匹配无结论记录）', schema: { type: string } }
        - { name: from, in: query, description: 起始时间（含，按 saved_at），ISO 8601 或 Unix 秒/毫秒, schema: { type: string } }
        - { name: to, in: query, description: 结束时间（含，按 saved_at），ISO 8601 或 Unix 秒/毫秒, schema: { type: string } }
      responses:
        '200':
          description: 研判记录摘要页（按 saved_at 倒序）
          content:
            application/json:
              schema:
                type: object
                required: [total, items, cases_total]
                properties:
                  total: { type: integer, description: 筛选后、切页前的条数 }
                  items:
                    type: array
                    items:
                      type: object
                      required: [alert_id, mode, saved_at, degraded]
                      properties:
                        alert_id: { type: [string, 'null'] }
                        mode: { type: [string, 'null'], enum: [deep, triage, null] }
                        verdict: { type: [string, 'null'], enum: [threat, uncertain, false_positive, null] }
                        verdict_label: { type: [string, 'null'] }
                        confidence: { type: [string, 'null'] }
                        saved_at: { type: [string, 'null'] }
                        degraded: { type: boolean, description: 降级存疑的结论（P003-T035） }
                        model: { type: [string, 'null'] }
                  cases_total:
                    type: [integer, 'null']
                    description: 案件列表口径（GET /api/agent/triage/cases）的条数；未配研判队列为 null
        '400':
          description: 调用方传错（count/offset/verdict/时间非法），`code=caller_error`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/BusinessUnauthorized' }
    post:
      tags: [深度研判]
      summary: 手动启动单告警研判
      description: |
        mode=deep 使用原有深度研判 API；mode=triage 使用常规研判。
        query stream=1 时返回 SSE，事件为 progress、result、error，15 秒心跳；否则返回 JSON。
        控制台深度溯源白板使用 /api/trace/boards，不依赖此接口的 deep 结果。
      operationId: createInvestigation
      parameters:
        - name: stream
          in: query
          schema: { type: string, enum: ['1'] }
          description: 设为 1 时启用 SSE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alert_id]
              properties:
                alert_id: { $ref: '#/components/schemas/TypedAlertId' }
                mode: { type: string, enum: [triage, deep], default: deep }
      responses:
        '200':
          description: 普通请求返回调查结果；stream=1 返回 SSE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Investigation' }
            text/event-stream:
              schema: { type: string, description: "data: JSON 对象；type 为 progress、result 或 error" }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/agent/investigations/{alertId}:
    get:
      tags: [深度研判]
      summary: 读取最近一次保存的调查结果
      operationId: getInvestigation
      parameters:
        - $ref: '#/components/parameters/TriageId'
        - name: mode
          in: query
          schema: { type: string, enum: [triage, deep], default: deep }
      responses:
        '200':
          description: 调查结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Investigation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/agent/investigations/{alertId}/replay:
    get:
      tags: [深度研判]
      summary: 回放一次已保存的研判会话（逐轮摘要 / 工具序列 / 结论变化）
      description: |
        按告警 ID 读**已保存**的研判记录（`<数据根>/investigations/<sha256>.json`）与其中的证据清单，
        **不重放模型、不重查牧云**。新记录带 `turns` 逐轮快照；P003-T046 之前落的旧记录没有快照，
        回 `turns: []` / `verdicts: []`，`tool_calls` 仍按 `trace` 给出——不 500，也不假装有逐轮数据。
        这条分支排在 `GET /api/agent/investigations/{alertId}` 之前（否则 `/replay` 会被当成告警 ID 的后半段）。
      operationId: replayInvestigation
      parameters:
        - $ref: '#/components/parameters/TriageId'
        - name: mode
          in: query
          description: 与 `GET /api/agent/investigations/{alertId}` 同一套：按告警 ID + 模式取那一份记录
          schema: { type: string, enum: [triage, deep], default: deep }
      responses:
        '200':
          description: 回放视图
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvestigationReplay' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/trace/boards:
    get:
      tags: [深度研判]
      summary: 列出已保存的溯源白板
      operationId: listTraceBoards
      description: |
        按更新时间倒序分页。先判白板服务有没有配（没配回 503），再判分页参数（不合法回 400「分页参数无效」），
        最后判筛选词表（不合法回 400）。筛选在服务层先做，再切页；`total` 是筛选后、切页前的白板总数。
      parameters:
        - $ref: '#/components/parameters/Count'
        - $ref: '#/components/parameters/Offset'
        - name: status
          in: query
          description: 按状态筛，可逗号分隔多选
          schema:
            type: array
            items: { type: string, enum: [running, done, failed, interrupted] }
          style: form
          explode: true
        - name: type
          in: query
          description: 按告警事件类型名筛（如 honeypot、webshell）；手填 IP 起的白板没有类型，不会被选中
          schema: { type: string }
        - name: host
          in: query
          description: 按告警主机地址精确筛
          schema: { type: string }
        - name: from
          in: query
          description: 告警时间起点（含端点）。RFC3339 或 Unix 秒/毫秒时间戳；没有告警时间的白板会被排除
          schema: { type: string }
        - name: to
          in: query
          description: 告警时间终点（含端点），口径同 from；起点晚于终点回 400
          schema: { type: string }
      responses:
        '200':
          description: 白板摘要列表
          content:
            application/json:
              schema:
                type: object
                required: [boards, total]
                properties:
                  boards: { type: array, items: { $ref: '#/components/schemas/TraceBoardSummary' } }
                  total: { type: integer, description: 筛选后、切页前的白板总数 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [深度研判]
      summary: 从一条告警或 IPv4 地址启动深度溯源
      operationId: startTraceBoard
      description: |
        已有白板直接返回那条（200），不重查事件、不覆盖；没有才创建并开始往回走（202）。
        syslog 形态的告警 ID 直接引用告警分析已经落盘的原始报文（研判记录 `case_dir` 下的 `01-原始告警.txt`，
        `origin_evidence.evidence_id` 取分析记录里的 `syslog:1`，`origin_evidence.reused = true`），不为同一份证据再查牧云；
        没有分析记录或案卷回 422。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: target 优先；兼容 alert_id 和 ip 字段
              properties:
                target: { type: string, description: "例如 revshell:1、syslog:honeypot:aaaaaaaaaaaaaaaa:1763392800:6f1b6a4e-4d3a-4b8e-9a4e-2f6f1b6a4e43、172.16.221.41 或 ip:172.16.221.41" }
                alert_id: { type: string, description: "告警 ID；与 target 同一套校验，也收 syslog 形态" }
                ip: { type: string, format: ipv4, description: "IPv4 地址；也接受 ip: 前缀写法（与 target 同一套校验）" }
                focus: { type: string }
      responses:
        '200':
          description: 该告警已有溯源白板，原样返回
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TraceBoard' }
        '202':
          description: 白板任务已启动（新建）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TraceBoard' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422':
          description: 告警没有可用于起板的资产/主机，或 syslog 告警还没有分析记录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502': { $ref: '#/components/responses/BackendError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/trace/boards/{target}:
    get:
      tags: [深度研判]
      summary: 读取溯源白板进度和结果
      operationId: getTraceBoard
      parameters:
        - name: target
          in: path
          required: true
          description: 告警 ID（含 syslog 形态）或 IPv4 地址；冒号需 URL 编码
          schema: { type: string }
      responses:
        '200':
          description: 白板详情。主数据是 hops / links / gaps / discovery；nodes / edges / activity 作为旧字段保留
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TraceBoard' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/triage/rules:
    get:
      tags: [规则]
      summary: 获取前置规则配置
      operationId: getRules
      responses:
        '200':
          description: 当前规则集、版本和是否可写
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuleSetResponse' }
    put:
      tags: [规则]
      summary: 以预期版本保存规则集
      description: 需要业务 Basic 认证，以及 X-Rule-Admin-Token。
      operationId: saveRules
      security:
        - basicAuth: []
          ruleAdminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config, expected_revision]
              properties:
                config: { $ref: '#/components/schemas/RuleSet' }
                expected_revision: { type: [string, 'null'], pattern: '^[0-9a-f]{16}$' }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/triage/rules/validate:
    post:
      tags: [规则]
      summary: 校验规则草稿
      operationId: validateRules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config]
              properties:
                config: { $ref: '#/components/schemas/RuleSet' }
      responses:
        '200':
          description: 校验通过
          content:
            application/json:
              schema:
                type: object
                required: [valid, count]
                properties:
                  valid: { type: boolean, const: true }
                  count: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/rules:
    get:
      tags: [Rego 规则]
      summary: 列出 Rego 规则库
      operationId: listRegoRules
      description: |
        一条规则一个 `.rego` 文件：规则 id 取 `package hids.rules.<id>` 的最后一段，显示名取 `# name:` 注释。
        列表只给元数据，原文用 `GET /api/rules/{id}` 取。空规则库回 `{count: 0, rules: []}`，不是 404。
        规则文件不合法（缺 `# name:`、用了子集外语法、id 重复）时整次读取失败：回 502，正文带 `rules/<文件>:<行>` 定位。
        支持的 Rego 子集见 `rule-store.js` 文件头。
      responses:
        '200':
          description: 规则元数据列表，按 id 排序
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegoRuleList' }
        '502': { $ref: '#/components/responses/RuleLibraryError' }
  /api/rules/evaluate:
    post:
      tags: [Rego 规则]
      summary: 用一条告警事实求值
      operationId: evaluateRegoRules
      description: |
        事实是 JSON 对象，约定字段：`host`（主机）、`peer`（对端）、`command`（命令）、`user`（用户）、
        `path`（路径）、`type`（类型）、`source_ip`（来源 IP）。规则只读它写到的字段，**没写的字段就是不限制**。
        比较是严格相等（`"1"` 不等于 `1`）；`contains` / `startswith` / `endswith` 只对字符串成立。
        事实缺字段时，引用该字段的条件不成立（`!=` 也一样，与 Rego 的 undefined 语义一致）；要「缺字段也算通过」写 `not input.<字段> == <值>`。
        没有规则命中时明确回空：`matched` 为空数组、`count` 为 0。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlertFact' }
      responses:
        '200':
          description: 命中结果；没命中时 matched 为空数组
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegoEvaluation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '502': { $ref: '#/components/responses/RuleLibraryError' }
  /api/rules/sessions:
    get:
      tags: [Rego 规则]
      summary: 列出规则维护会话（摘要）
      operationId: listRegoSessions
      description: |
        每次误报触发的规则维护落一份会话（形制对齐 `wiki-sessions`）：输入案卷引用、模型修订草案、校验结果、终态。
        会话全文在 `<数据根>/rule-sessions/<uuid>.json`；这里只回摘要，按 `updated_at` 倒序，不含规则正文与误报理由原文。
        路径必须排在 `/api/rules/{id}` 之前判断——`sessions` 本身是合法规则 id 形状，排后面会被当成规则读。
      responses:
        '200':
          description: 会话摘要列表，按 `updated_at` 倒序；没有会话时是空数组
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: { $ref: '#/components/schemas/RegoSessionSummary' }
                additionalProperties: false
        '502': { $ref: '#/components/responses/RuleLibraryError' }
  /api/false-positive/sessions:
    get:
      tags: [误报维护]
      summary: 列出误报维护会话（摘要）
      operationId: listFpMaintenanceSessions
      description: |
        一个案件一份多轮会话（读案卷 → 读两库 → 提修订 → 自校验），落 `<数据根>/fp-sessions/<uuid>.json`，形制对齐 `wiki-sessions`。
        这里只回摘要，按 `updated_at` 倒序，不含案卷快照与模型正文。读开放（与 `/api/rules/sessions` 同口径）；
        写只有误报入口一条路（`POST /api/agent/triage/{alertId}/false-positive`）。
      responses:
        '200':
          description: 会话摘要列表，按 `updated_at` 倒序；没有会话时是空数组
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: { $ref: '#/components/schemas/FpMaintenanceSessionSummary' }
                additionalProperties: false
        '502': { $ref: '#/components/responses/RuleLibraryError' }
  /api/false-positive/sessions/{id}:
    get:
      tags: [误报维护]
      summary: 读一份误报维护会话的全文
      operationId: getFpMaintenanceSession
      description: |
        整份会话：`turns[]`（四轮推进）、`messages[]`（人读得懂的上下文与决策）、`decision`（动哪几边、为什么）、
        `outcomes{rule, wiki}`（每侧实际动没动、幂等键、错误）、`validation`（自校验项）、
        `auto_verdict`（闭环自动判定的生效口径：以 Rego 规则库为准，见 `FpAutoVerdict`）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-fA-F-]{36}$' }
      responses:
        '200':
          description: 会话全文
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FpMaintenanceSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/RuleLibraryError' }
  /api/rules/{id}/history:
    get:
      tags: [Rego 规则]
      summary: 列一条规则的历史版本
      operationId: listRegoRuleHistory
      description: |
        每次覆盖一条规则前，旧版原件先落 `<数据根>/rules-history/<id>-<rev>.rego`，理由（备注）与它并排落在
        `<数据根>/rules-history/<id>-<rev>.json`（`{id, rev, note, saved_at, replaced_by}`）；`note` 就是那条副本的
        「为什么被替换」。这里列这些副本，按写入时间升序。
        规则不存在或还没改过时回空数组（不是 404）；正文一字未改的提交不会新增历史。
        没带备注归档、或本接口备注落盘之前留下的旧历史副本，`note` 是 `null`。同一版被归档第二次
        （回滚回去又回滚回来）时副本与备注都保留第一次的。
      parameters:
        - name: id
          in: path
          required: true
          description: 规则 id；小写字母开头的标识符，不合格式回 400
          schema: { type: string, pattern: '^[a-z][a-z0-9_]*$' }
      responses:
        '200':
          description: 该规则的历史版本列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegoRuleHistory' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '502': { $ref: '#/components/responses/RuleLibraryError' }
  /api/rules/{id}/rollback:
    post:
      tags: [Rego 规则]
      summary: 把一条规则回滚到某个历史版本
      operationId: rollbackRegoRule
      description: |
        回滚＝把历史里那一版当新版再写一次（走同一个 `RuleStore.save()`）：所以当前版也会进历史（它的备注就是
        `人工回滚（<who>）`），回滚本身可再回滚。
        历史里没有这一版回 404，且不动现网那份；正文写盘失败回 500。
        与 `PUT /api/rules/{id}` 同一道闸：要求规则管理员令牌 `x-rule-admin-token`，没配令牌回 503、令牌不对回 403。
        与 `PUT` 同一段写队列：并发的人工写 / 回滚按到达顺序串起来，不会交叉着读旧版各写一份。
      parameters:
        - name: id
          in: path
          required: true
          description: 规则 id；小写字母开头的标识符，不合格式回 400
          schema: { type: string, pattern: '^[a-z][a-z0-9_]*$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegoRollback' }
      responses:
        '200':
          description: 回滚结果（`action=rollback`，带 `rolled_back_to`）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegoSaveResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/rules/{id}:
    get:
      tags: [Rego 规则]
      summary: 按 id 读规则的 Rego 原文
      operationId: getRegoRule
      description: |
        返回规则元数据与整份 .rego 文件原文（逐字返回，含注释与空行）。id 不存在回 404，id 不合格式回 400。
        `revision` 是正文指纹，`PUT` 的 `expected_revision` 就填它。
        规则库是数据根里的活数据（`<数据根>/rules/`），不是随部署的只读副本。
      parameters:
        - name: id
          in: path
          required: true
          description: 规则 id，即 `package hids.rules.<id>` 的最后一段；小写字母开头的标识符，不合格式回 400
          schema: { type: string, pattern: '^[a-z][a-z0-9_]*$' }
      responses:
        '200':
          description: 规则元数据与整份 .rego 原文（逐字返回）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegoRule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/RuleLibraryError' }
    put:
      tags: [Rego 规则]
      summary: 写一条规则（人工维护入口，与维护者 Agent 共用同一套校验与版本化）
      operationId: putRegoRule
      description: |
        写盘走 `RuleStore.save()`——与规则维护者 Agent 是同一个方法，没有第二套直写文件的函数。
        顺序：语法校验（规则子集，报错带 `<id>.rego:<行>`）→ 旧版进 `<数据根>/rules-history/<id>-<rev>.rego`
        及其备注 `<id>-<rev>.json` → 临时文件 + rename 原子替换。正文与原样一致时回 `action=unchanged`，不写盘也不刷历史。
        已有规则的 id 可能住在别的文件名里：写回它自己那份，不另起同 id 的第二个文件。
        **读—比对 `expected_revision`—写在同一个写队列任务里**（与 `WikiStore.update()` 同一口径）：并发两个 PUT
        只有一个能落盘，后到的拿 409，不会拿旧版本悄悄盖掉前一份。
        要求规则管理员令牌 `x-rule-admin-token`：没配令牌回 503、令牌不对回 403。
      parameters:
        - name: id
          in: path
          required: true
          description: 规则 id，必须与正文里 `package hids.rules.<id>` 一致，否则回 400
          schema: { type: string, pattern: '^[a-z][a-z0-9_]*$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegoRuleWrite' }
      responses:
        '200':
          description: 写入结果（`action` 是 add / update / unchanged）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegoSaveResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/wiki/pages:
    get:
      tags: [知识库]
      summary: 浏览已发布知识库页面
      operationId: listWikiPages
      description: |
        不带 `count` 时照旧返回全部页面（向后兼容：控制台知识库页现在一次取全量），此时 `offset` 仍可用来跳过前 N 条。
        分页顺序是「筛选 → 切页 → 算 total」：先按 `q` 过滤（有查询词时最多 50 条），再按 `offset` / `count` 切页，`total` 是切页前的条数。
        分页参数不合法回 400「分页参数无效」。
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: 标题、编号或路径筛选；有查询词时最多 50 条
        - $ref: '#/components/parameters/WikiPageCount'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: 页面目录
          content:
            application/json:
              schema:
                type: object
                required: [pages, total]
                properties:
                  pages: { type: array, items: { $ref: '#/components/schemas/WikiPageSummary' } }
                  total:
                    type: integer
                    description: 切页前的条数；带 q 时是过滤后（且被 50 条上限截断后）的条数
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/wiki/pages/{pagePath}:
    get:
      tags: [知识库]
      summary: 读取指定 Wiki 页面
      operationId: getWikiPage
      parameters:
        - name: pagePath
          in: path
          required: true
          description: 相对路径，如 common/GEN-12.md；斜杠需 URL 编码
          schema: { type: string }
      responses:
        '200':
          description: 一页的元数据与含 frontmatter 的全文
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WikiPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/wiki/health:
    get:
      tags: [知识库]
      summary: 检查 Wiki 文件和索引
      description: 需要 X-Prompt-Admin-Token。
      operationId: getWikiHealth
      security:
        - basicAuth: []
          promptAdminToken: []
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/wiki/sessions:
    get:
      tags: [知识库]
      summary: 列出知识维护会话
      operationId: listWikiSessions
      security:
        - basicAuth: []
          promptAdminToken: []
      responses:
        '200':
          description: 会话列表
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions: { type: array, items: { type: object, additionalProperties: true } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [知识库]
      summary: 创建知识维护会话或从已完成案件创建复盘
      operationId: createWikiSession
      security:
        - basicAuth: []
          promptAdminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                page: { type: string }
                case_id: { type: string }
                reason: { type: string }
                expected_verdict: { type: string }
                who: { type: string }
              description: page 或 case_id 至少提供一个
      responses:
        '201': { $ref: '#/components/responses/JsonObject' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/wiki/sessions/{sessionId}:
    get:
      tags: [知识库]
      summary: 获取知识维护会话
      operationId: getWikiSession
      security:
        - basicAuth: []
          promptAdminToken: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/wiki/sessions/{sessionId}/messages:
    post:
      tags: [知识库]
      summary: 向知识维护会话提交材料或回答
      operationId: replyWikiSession
      security:
        - basicAuth: []
          promptAdminToken: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: 上一轮知识整理仍在进行（同一会话的重入被挡）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: |
            维护者判定这条反馈不归判据库管（data_gap / prompt_gap / source_gap / case_specific / needs_info），
            或者判据缺口但草案没成形，本回合没有改判据。正文 error 是失败原因原文：诊断（如 `data_gap·数据缺口`）、
            `rationale` 摘录与后续责任方，整条不超过 300 字，调用方原封写进 `maintenance.wiki.error`。
            会话记录仍会落盘（诊断、`follow_up`、原始输入、失败消息都在），拿 sessionId 读 `GET /api/wiki/sessions/{sessionId}` 可查。
            这一类按上游失败归类：`code` 恒为 `upstream_error`（模型这回合没给出可用的维护结论）。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/wiki/sessions/{sessionId}/replay:
    post:
      tags: [知识库]
      summary: 重放当前草稿的历史案件核对
      operationId: replayWikiSession
      security:
        - basicAuth: []
          promptAdminToken: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
  /api/wiki/sessions/{sessionId}/publish:
    post:
      tags: [知识库]
      summary: 审核并发布知识库草稿
      operationId: publishWikiSession
      security:
        - basicAuth: []
          promptAdminToken: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: 审核结论、有效期、审核备注等；依草稿类型校验
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/maintenance/session:
    servers: [{ url: 'http://127.0.0.1:18081', description: 独立维护服务，仅允许本机或 SSH 隧道 }]
    get:
      tags: [维护服务]
      summary: 查询维护登录状态
      operationId: getMaintenanceSession
      security: []
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
  /api/maintenance/login:
    servers: [{ url: 'http://127.0.0.1:18081' }]
    post:
      tags: [维护服务]
      summary: 登录独立维护服务
      operationId: loginMaintenance
      security: []
      parameters:
        - $ref: '#/components/parameters/MaintenanceWrite'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200':
          description: 登录成功并设置 HttpOnly、SameSite=Strict 会话 Cookie
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceIdentity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/maintenance/logout:
    servers: [{ url: 'http://127.0.0.1:18081' }]
    post:
      tags: [维护服务]
      summary: 退出维护会话
      operationId: logoutMaintenance
      security:
        - maintenanceCookie: []
        - maintenanceBasic: []
      parameters:
        - $ref: '#/components/parameters/MaintenanceWrite'
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/maintenance/overview:
    servers: [{ url: 'http://127.0.0.1:18081' }]
    get:
      tags: [维护服务]
      summary: 获取维护端版本和升级包列表
      operationId: getMaintenanceOverview
      security:
        - maintenanceCookie: []
        - maintenanceBasic: []
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/maintenance/packages:
    servers: [{ url: 'http://127.0.0.1:18081' }]
    post:
      tags: [维护服务]
      summary: 上传加密签名的策略包并暂存
      operationId: stageMaintenancePackage
      security:
        - maintenanceCookie: []
        - maintenanceBasic: []
      parameters:
        - $ref: '#/components/parameters/MaintenanceWrite'
        - name: X-Package-Filename
          in: header
          required: true
          description: URL 编码的文件名
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '201':
          description: 暂存成功，尚未替换运行策略
          content:
            application/json:
              schema:
                type: object
                required: [id, version]
                properties:
                  id: { type: string, pattern: '^[0-9a-f]{64}$' }
                  version: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/BadRequest' }
        '415': { $ref: '#/components/responses/BadRequest' }
  /api/maintenance/packages/{packageId}:
    servers: [{ url: 'http://127.0.0.1:18081' }]
    get:
      tags: [维护服务]
      summary: 查看暂存包公开详情与兼容性
      operationId: getMaintenancePackage
      security:
        - maintenanceCookie: []
        - maintenanceBasic: []
      parameters:
        - $ref: '#/components/parameters/PackageId'
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/maintenance/packages/{packageId}/apply:
    servers: [{ url: 'http://127.0.0.1:18081' }]
    post:
      tags: [维护服务]
      summary: 核对版本后应用暂存包
      operationId: applyMaintenancePackage
      security:
        - maintenanceCookie: []
        - maintenanceBasic: []
      parameters:
        - $ref: '#/components/parameters/PackageId'
        - $ref: '#/components/parameters/MaintenanceWrite'
        - name: If-Match
          in: header
          required: true
          schema: { type: string }
          description: 当前运行策略的 revision
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/BadRequest' }
        '428': { $ref: '#/components/responses/BadRequest' }
components:
  securitySchemes:
    basicAuth: { type: http, scheme: basic, description: 业务端 HIDS_BASIC_AUTH_USER/PASSWORD；未配置密码时不启用 }
    ruleAdminToken: { type: apiKey, in: header, name: X-Rule-Admin-Token }
    promptAdminToken: { type: apiKey, in: header, name: X-Prompt-Admin-Token }
    maintenanceBasic: { type: http, scheme: basic, description: 独立维护账号 }
    maintenanceCookie: { type: apiKey, in: cookie, name: hids_maintenance_session }
  parameters:
    Count:
      name: count
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    WikiPageCount:
      name: count
      in: query
      description: 每页条数。不带这个参数时返回全部页面（向后兼容），只有显式传才切页
      schema: { type: integer, minimum: 1, maximum: 50 }
    AlertType:
      name: type
      in: query
      required: false
      description: 事件类型；只查询该类事件，totals 与 total 只含该类。不在枚举内回 400
      schema:
        type: string
        enum: [webshell, malware, revshell, memory_webshell, brute_force, abnormal_login, elevation_process,
          network_audit, suspicious_operation, honeypot, memory_security]
      example: webshell
    AlertLevel:
      name: level
      in: query
      required: false
      description: 风险等级，逗号分隔可多选；既收 levelKey（low/medium/high/critical）也收 1–4 序号。其他值回 400
      schema: { type: string }
      example: 'high,critical'
    AlertQuery:
      name: q
      in: query
      required: false
      description: 关键字，大小写不敏感；对 id / title / asset / source / target / account / command 做包含匹配
      schema: { type: string }
      example: shell
    AlertFrom:
      name: from
      in: query
      required: false
      description: 起始时间（含）。RFC3339 或秒/毫秒时间戳；解析不了回 400。没有事件时间的告警在带时间筛选时被排除
      schema: { type: string }
      example: '2026-11-01T00:00:00Z'
    AlertTo:
      name: to
      in: query
      required: false
      description: 结束时间（含），格式同 from；晚于 from 之外的情况（to 早于 from）回 400
      schema: { type: string }
      example: '2026-11-02T00:00:00Z'
    AlertSort:
      name: sort
      in: query
      required: false
      description: time=事件时间倒序（默认，同老行为）；level=等级降序，同级按事件时间倒序。其他值回 400
      schema: { type: string, enum: [time, level], default: time }
      example: level
    TriageStatus:
      name: triage_status
      in: query
      required: false
      description: 研判状态，逗号分隔可多选；没有研判记录的告警算 not_queued。其他值回 400
      schema: { type: string }
      example: 'queued,running'
    Verdict:
      name: verdict
      in: query
      required: false
      description: |
        研判结论，逗号分隔可多选。`/api/alerts` 里没有研判记录的告警算 review；`/api/agent/triage/cases` 里记录上没有结论的案件算 review。其他值回 400
      schema: { type: string }
      example: threat
    CaseType:
      name: type
      in: query
      required: false
      description: 事件类型；按 syslog MsgId 经 `eventTypeFor` 映射出的类型比（例如 cloudwalker-revshell → revshell）。不在枚举内回 400
      schema:
        type: string
        enum: [webshell, malware, revshell, memory_webshell, brute_force, abnormal_login, elevation_process,
          network_audit, suspicious_operation, honeypot, memory_security]
      example: revshell
    CaseHost:
      name: host
      in: query
      required: false
      description: 主机 IP，与案件里 syslog 的 `host_ip` 精确相等才算命中；没有 host_ip 的案件不会被匹配到
      schema: { type: string }
      example: 10.0.0.5
    CaseSort:
      name: sort
      in: query
      required: false
      description: |
        time=按收到顺序倒序（默认，同老行为）；verdict=结论排序，threat 在前，依次 uncertain / false_positive / 无结论，同档按时间倒序。其他值回 400
      schema: { type: string, enum: [time, verdict], default: time }
      example: verdict
    TriageSince:
      name: since
      in: query
      required: false
      description: |
        聚合起点（含）：RFC3339 或秒/毫秒时间戳，与 `created_at`（记录进入队列的时刻）比，不早于它的记录才计入
        `counts` / `verdict_counts` / `type_counts`。解析不了回 400「筛选起始时间无效：<值>」；空值等于不带筛。
        没有 `created_at` 的旧记录在带 since 时不会被计入
      schema: { type: string }
      example: '2026-11-04T00:00:00Z'
    AlertId:
      name: alertId
      in: path
      required: true
      description: 形如 revshell:1 的牧云事件 ID；冒号需 URL 编码
      schema: { $ref: '#/components/schemas/TypedAlertId' }
    TriageId:
      name: alertId
      in: path
      required: true
      description: 牧云事件 ID 或 syslog 案件 ID；深度模式仅接受牧云事件 ID
      schema: { type: string }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PackageId:
      name: packageId
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9a-f]{64}$' }
    MaintenanceWrite:
      name: X-Hids-Maintenance
      in: header
      required: true
      schema: { type: string, const: '1' }
      description: 写入请求还会校验 Origin 和 Sec-Fetch-Site
  schemas:
    ModelRoleResolved:
      type: object
      description: |
        一个角色 resolved 到的模型名与这一组配置的来源（P003-T042）。
        `source`：`primary` = 这一组三个键全空、逐键回退主判；`own` = 三个键全有、全用自己那组；
        `mixed` = 部分有、逐键回退主判。只报模型名，不报地址与密钥。
      required: [model, source]
      properties:
        model: { type: [string, 'null'], description: '这个角色实际用的模型名：先取这一组的模型名，没设就逐键回退主判 LLM_MODEL，两者都没设才是 null（不看实例是否装配；主判未配而该组自带模型名时仍是那个名字）' }
        source: { type: string, enum: [primary, own, mixed], description: 这一组配置的来源三态 }
    DataStoreUsage:
      type: object
      description: 一类运行态存储的占用：条数与字节，外加这一类的条目时刻区间。
      required: [kind, label, path, exists, count, bytes, oldest_at, newest_at]
      properties:
        kind:
          type: string
          enum: [cases, investigations, boards, wiki_sessions, queue, logs, config_overrides]
          description: 存储类型；`GET /api/data/inventory` 的 `stores` 按这个枚举的顺序返回
        label: { type: string, description: 这一类的中文名（案卷 / 研判记录 / 溯源白板 / 知识库会话 / 研判队列 / 日志 / 配置覆盖层） }
        path: { type: string, description: 这一类在盘上的绝对路径（队列是队列文件路径，日志是数据根目录本身） }
        exists: { type: boolean, description: 那条路径在不在盘上；不在时 count 恒为 0 }
        count: { type: integer, minimum: 0, description: 条数：文件 = 文件个数，案卷 = 一级子目录个数，配置覆盖层 = 0/1，队列 = 记录数 }
        bytes: { type: integer, minimum: 0, description: 字节量：目录/案卷递归累加；队列是队列文件 + `.archive.jsonl` }
        oldest_at:
          type: [string, 'null']
          format: date-time
          description: 这一类最早的条目时刻；没有条目为 null
        newest_at:
          type: [string, 'null']
          format: date-time
          description: 这一类最新的条目时刻；没有条目为 null
    DataInventory:
      type: object
      required: [data_dir, stores, total]
      properties:
        data_dir: { type: string, description: 运行态根目录（`HIDS_DATA_DIR`，没设就是 `~/.local/share/hids-ai-console`；缺省取配置覆盖层文件所在目录）的绝对路径 }
        stores:
          type: array
          description: 七类存储，顺序固定为 cases → investigations → boards → wiki_sessions → queue → logs → config_overrides
          items: { $ref: '#/components/schemas/DataStoreUsage' }
        total:
          type: object
          required: [count, bytes]
          description: 七类之和
          properties:
            count: { type: integer, minimum: 0 }
            bytes: { type: integer, minimum: 0 }
    DataCleanupRequest:
      type: object
      required: [kind]
      additionalProperties: false
      description: |
        按类型与阈值清理。`older_than` 与 `keep` 至少给一个（都空回 400）；两条同给时取并集。
        默认 `action: archive`、`execute: false`（只报清单不动盘）。
      properties:
        kind:
          type: string
          enum: [cases, investigations, boards, wiki_sessions, queue, logs, config_overrides]
          description: 要清理的存储类型（与盘点同一套）
        action:
          type: string
          enum: [archive, delete]
          default: archive
          description: 归档（移进 `<数据根>/archive/<kind>/`，队列追加到 `.archive.jsonl`）或删除
        execute:
          type: boolean
          default: false
          description: 不给或 false 是 dry-run（只报将清清单）；true 才真动盘
        older_than:
          type: string
          format: date-time
          description: 早于这个时刻的条目进候选（ISO 8601）
        keep:
          type: integer
          minimum: 0
          description: 保留最新 N 条；排在 N 条之后的进候选
    LogEntry:
      type: object
      description: |
        落盘那一行 JSON。`time` / `level` / `event` 三键恒在；其余字段是写日志时给的（已过脱敏，读的时候又擦一遍）。
        `additionalProperties: true` 是有意的：事件字段各不相同，按事件名表（docs/architecture.md §3.6）取用。
      required: [time, level, event]
      additionalProperties: true
      properties:
        time: { type: string, format: date-time, description: 写这一行的时刻（ISO 8601 UTC） }
        level: { type: string, enum: [info, warn, error] }
        event: { type: string, description: 事件名，取值见 docs/architecture.md §3.6 的事件名表 }
    LogQueryResult:
      type: object
      required: [logs, total, files, truncated, echo]
      properties:
        logs:
          type: array
          description: 本页日志，按 `time` 倒序；每页最多 50 条
          items: { $ref: '#/components/schemas/LogEntry' }
        total: { type: integer, minimum: 0, description: 筛选后、切页前的条数 }
        files: { type: integer, minimum: 0, description: 这次读了几个文件（当前活动文件 + 轮转出的历史文件） }
        truncated: { type: boolean, description: 命中超过 20000 条时为 true，只收了前 20000 条 }
        echo:
          type: object
          required: [count, offset]
          properties:
            count: { type: integer, minimum: 1, maximum: 50 }
            offset: { type: integer, minimum: 0 }
    LogCleanupRequest:
      type: object
      description: 阈值至少给一条；`execute` 缺省 false（dry-run）。
      additionalProperties: false
      properties:
        older_than: { type: string, format: date-time, description: 历史文件 mtime 早于它的进候选 }
        max_bytes: { type: integer, minimum: 0, description: 历史文件总字节上限；超了从最老的删起 }
        execute: { type: boolean, default: false, description: 不给或 false 时只报清单，盘上不动 }
    LogCleanupResult:
      type: object
      required: [dry_run, threshold, candidates, applied, remaining]
      properties:
        dry_run: { type: boolean, description: 没有真动盘时为 true }
        threshold:
          type: object
          required: [older_than, max_bytes]
          properties:
            older_than: { type: [string, 'null'], format: date-time, description: 回显请求里的 older_than；没给为 null }
            max_bytes: { type: [integer, 'null'], minimum: 0, description: 回显请求里的 max_bytes；没给为 null }
        candidates:
          type: object
          required: [count, bytes, items, truncated]
          properties:
            count: { type: integer, minimum: 0, description: 候选历史文件个数（当前活动文件永不在其中） }
            bytes: { type: integer, minimum: 0 }
            items:
              type: array
              description: 最多 100 个（按 mtime 从老到新）；多出来的只体现在 count/bytes 与 truncated
              items:
                type: object
                required: [name, bytes, at]
                properties:
                  name: { type: string, description: 文件名（不含目录） }
                  bytes: { type: integer, minimum: 0 }
                  at: { type: string, format: date-time, description: 文件的 mtime }
            truncated: { type: boolean }
        applied:
          type: object
          required: [count, bytes]
          properties:
            count: { type: integer, minimum: 0, description: dry-run 恒为 0 }
            bytes: { type: integer, minimum: 0, description: dry-run 恒为 0 }
        remaining:
          type: object
          required: [count, bytes]
          description: 执行后重新扫出来的历史文件余量
          properties:
            count: { type: integer, minimum: 0 }
            bytes: { type: integer, minimum: 0 }
    DataCleanupResult:
      type: object
      required: [dry_run, kind, action, threshold, candidates, applied, inventory]
      properties:
        dry_run: { type: boolean, description: 没有真动盘时为 true（请求里 execute 不给或 false） }
        kind: { type: string, enum: [cases, investigations, boards, wiki_sessions, queue, logs, config_overrides] }
        action: { type: string, enum: [archive, delete] }
        threshold:
          type: object
          required: [older_than, keep]
          properties:
            older_than: { type: [string, 'null'], format: date-time, description: 回显请求里的 older_than；没给为 null }
            keep: { type: [integer, 'null'], minimum: 0, description: 回显请求里的 keep；没给为 null }
        candidates:
          type: object
          description: 将清清单（dry-run 时是预测，execute 时是刚被清掉的那些）
          required: [count, bytes, items, truncated]
          properties:
            count: { type: integer, minimum: 0 }
            bytes: { type: integer, minimum: 0, description: 候选的字节合计（队列按记录 JSON 序列化字节估算） }
            items:
              type: array
              description: 最多 100 条（按条目时刻从老到新）；多出来的只体现在 count/bytes 与 truncated
              items:
                type: object
                required: [name, bytes, at]
                properties:
                  name: { type: string, description: 文件名 / 案卷目录名；队列是告警 ID }
                  bytes: { type: integer, minimum: 0 }
                  at: { type: [string, 'null'], format: date-time, description: 条目时刻 }
                  status:
                    type: string
                    enum: [done]
                    description: 只有队列条目带这个字段；能进候选的一律是 done（非 done 会 409）
            truncated: { type: boolean, description: 候选多于 100 条时为 true }
        applied:
          type: object
          required: [count, bytes]
          description: 这次真清掉的条数与字节；dry-run 恒为 0
          properties:
            count: { type: integer, minimum: 0 }
            bytes: { type: integer, minimum: 0 }
        inventory:
          allOf:
            - $ref: '#/components/schemas/DataInventory'
            - description: 执行之后重新扫出来的盘点（dry-run 时是当下未变的数字）
    ClaimCitation:
      type: object
      description: 一条证据引用，指向本次取证记录里的某个原始字段（`agent-tools.js:79-90` 逐条核：证据存在、pointer 是 JSON Pointer、字段能解出、值相等）。
      required: [evidence_id, pointer, value]
      properties:
        evidence_id:
          type: string
          description: 本次取证会话里的证据编号，形如 cw:1；syslog 未匹配旁路固定为 syslog:1
          examples: [cw:1, syslog:1]
        pointer:
          type: string
          pattern: '^/'
          description: 相对该证据原始返回的 JSON Pointer，必须以 / 开头；~ 与 / 按 RFC 6901 转义
          examples: ['/facts/source_ip/value']
        value:
          description: 该 Pointer 处的原始值（任意 JSON 类型）；校验要求与证据原文逐值相等，语义相近不算通过
      additionalProperties: true
    Claim:
      type: object
      description: 一条已核验事实。claims 里每条都必须带至少一条可用引用，否则在降级时被剔除。
      required: [text, citations]
      properties:
        text: { type: string, description: 事实的自然语言描述 }
        citations:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ClaimCitation' }
      additionalProperties: true
    TriageStep:
      type: object
      description: 研判任务的一步进度，按发生顺序追加；只保留最近 80 条（超出时丢最早的）。
      required: [stage, detail, at]
      properties:
        stage: { type: string, description: 阶段名，如 关联事件、规则评估、AI 分析、完成研判 }
        detail: { type: string, description: 这一阶段的说明；规则评估阶段写命中或跳过的原因（规则评估抛错时是固定文案 + 原文字符量，P003-T052） }
        at: { type: string, format: date-time, description: 写入时间（UTC ISO 串） }
      additionalProperties: false
    TriageEvidence:
      type: object
      description: |
        队列记录里的证据条目（P003-T040 A6 起）。工具入参只在「RPC 形态」时保留（{id} / {count,offset} 这类短参数），
        含原文的（长字符串或大对象）剥掉并置 args_omitted，摘要不动；未配置研判或记录仍在排队时是空数组。
      required: [evidence_id, tool, fetched_at, sha256]
      properties:
        evidence_id: { type: string }
        tool: { type: string }
        fetched_at: { type: string, format: date-time }
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: 证据原始内容的 SHA-256，64 位小写十六进制
        args:
          type: object
          additionalProperties: true
          description: 实际传给工具的参数，只在不含原文且序列化后不超过 200 字时出现（含原文的剥掉）
        args_omitted:
          type: boolean
          description: args 因含原文被剥离时为 true；与 args 互斥
      additionalProperties: false
    EvidenceRecord:
      type: object
      description: |
        研判记录里保存的取证条目（P003-T040 A2/A3 起带 view）。sha256 只能证明「是同一条记录」，
        view 回答「当时取到了什么」——引用里的 pointer/value 能在 view 里复算，不需要重新查询牧云。
      required: [evidence_id, tool, args, fetched_at, sha256, view]
      properties:
        evidence_id: { type: string, examples: [cw:1] }
        tool: { type: string, description: 取证工具名 }
        args: { type: object, additionalProperties: true, description: 本次实际传给工具的参数（原样回写，模型没有直接持有） }
        fetched_at: { type: string, format: date-time }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$', description: '对 {name,args,result} 序列化后的 SHA-256' }
        view:
          type: [object, 'null']
          additionalProperties: true
          description: |
            证据的投影视图原文（projectEvidence + boundEvidenceView 的结果），单条不超过 6000 字；
            deep 模式的原始事件（cw:1）同样带 view。只读视图，不是原始结果全集：被省略的行/字段以计数与 omitted_fields 记账。
      additionalProperties: false
    Validation:
      type: object
      description: 引用校验结果；核的是 claims 与 evidence_facts 里的 citations 能否从取证记录解出且值相等。
      required: [ok, errors]
      properties:
        ok: { type: boolean, description: 全部引用都通过时为 true }
        errors:
          type: array
          items: { type: string }
          description: 失败明细；ok 为 true 时是空数组
        removed_unverified_facts:
          type: boolean
          description: 只在两次退回修订仍不通过、已删掉未通过校验的事实后出现，恒为 true
      additionalProperties: false
    Review:
      type: object
      description: 独立复核结果；客户经验复用与未匹配 syslog 两条捷径不跑完整复核，但有固定取值。
      required: [assessment, concerns, missing_evidence]
      properties:
        assessment:
          type: string
          enum: [supported, needs_revision, unavailable, knowledge_reuse]
          description: |
            supported = 复核支持原结论；needs_revision = 要求按质疑重出结论；
            unavailable = 复核没跑成（模型报错，或 syslog 未匹配到牧云事件）；
            knowledge_reuse = 走了客户经验复用捷径，没有跑独立复核。
            实现只把 supported 当通过，其余取值（含枚举外的值）一律按未通过处理。
        concerns: { type: array, items: { type: string }, description: 复核提出的质疑 }
        missing_evidence: { type: array, items: { type: string }, description: 复核认为还缺的证据 }
      additionalProperties: true
    RequiredEvidence:
      type: object
      description: 一个必查项及其执行结果；常规研判与深度研判都生成（P003-T035 起），深度研判只进 missing_evidence，不进客户报告。
      required: [id, label, tool, scope, status]
      properties:
        id:
          type: string
          enum: [related_events, command_history, network_connections, source_history, authorization, file_invocation]
          description: 必查项标识；authorization 与 file_invocation 按本次 MCP 目录动态判定，目录未提供该工具时标 catalog_absent（不算缺口）
        label: { type: string, description: 中文名，如 同主机关联事件 }
        tool: { type: string, description: 计划调用的工具名 }
        scope: { type: string, description: 这次查询的边界说明（例如当前返回页不能代表全部历史） }
        status:
          type: string
          enum: [records_returned, empty_page, source_unavailable, missing_identifier, query_failed]
          description: |
            五个取值互不混同：records_returned = 查到记录；empty_page = 查了但当前页为空；
            source_unavailable = 没有可用数据源；missing_identifier = 原始事件缺少主机或来源标识；
            query_failed = 查询抛错，或接口没返回可确认数量的列表。
        reason: { type: string, description: 原因说明；records_returned 也可能带（例如接口报告部分类型查询失败） }
        args: { type: object, additionalProperties: true, description: 实际调用参数；source_unavailable 与 missing_identifier 没有这个键 }
        evidence_id: { type: string, description: 查到记录时的证据编号 }
        returned_count: { type: integer, description: 当前页返回条数 }
        total_reported: { type: [integer, 'null'], description: 平台自报总数；接口没给时为 null }
        platform_total_consistent: { type: [boolean, 'null'], description: 平台自报总数与当前返回是否自洽；平台没报总数时为 null（evidence-view.js:218） }
        catalog_absent: { type: boolean, description: 只有 true 时出现：本次 MCP 目录未提供该工具（牧云暂无此数据源），不算缺口、不进客户报告 }
      additionalProperties: false
    TraceBoardNode:
      type: object
      description: 白板节点。kind 决定后续查询口径：asset 按 host_ip 查，external_ip 按 source_ip 查并额外查防火墙连接记录。
      required: [id, label, address, kind, status]
      properties:
        id: { type: string, pattern: '^(asset|ip):', description: 资产节点 asset:<IP>，外部或来源节点 ip:<IP> }
        label: { type: string, description: 展示名；资产节点优先主机名 }
        address: { type: string, format: ipv4 }
        kind: { type: string, enum: [asset, external_ip] }
        status: { type: string, enum: [pending, done], description: pending 待查；done 已调查 }
        why: { type: string, description: AI 给出继续追这个节点的理由；调查收尾时写入 }
        profile:
          type: object
          additionalProperties: true
          description: 资产档案，字段来自命中的主机行（name、ip、os 等）；外部 IP 节点只有 name 与 ip
        findings:
          type: array
          description: 每条工具结果的摘要，调查收尾时写入
          items:
            type: object
            required: [evidence_id, tool, total, returned, rows]
            properties:
              evidence_id: { type: string }
              tool: { type: string }
              total: { type: [integer, 'null'], description: 平台自报总数；单对象结果记 1，没有总数记 null }
              returned: { type: integer, description: 落在时间窗内的行数 }
              page_returned: { type: integer, description: 本页原始行数；只有列表结果有 }
              truncated: { type: boolean, description: 结果被上下文裁剪过；只有单对象结果有 }
              rows: { type: array, items: { type: object, additionalProperties: true } }
            additionalProperties: false
        finding_count: { type: integer, description: 命中记录数 }
        investigated_at: { type: string, format: date-time, description: 收尾时间；未调查没有这个键 }
        touched_hosts: { type: array, items: { type: string }, description: 调查外部 IP 时命中的内网主机地址 }
        discovered_from:
          type: array
          description: 这个节点从哪条证据的哪个字段发现；起点节点是空数组
          items:
            type: object
            required: [evidence_id, pointer]
            properties:
              evidence_id: { type: string }
              pointer: { type: [string, 'null'], description: 原始字段的 JSON Pointer；取不到时为 null }
      additionalProperties: false
    TraceBoardEdge:
      type: object
      description: 白板关系。by=program 是程序按同一事件记录画的粗筛线索，by=ai 是模型连的关系。
      required: [from, to, rel, why, strength, by, citations, at]
      properties:
        from: { type: string, description: 起点节点 ID，与节点 id 同一套编号 }
        to: { type: string, description: 终点节点 ID }
        rel: { type: string, description: 关系性质；程序边固定为 触达线索 }
        why: { type: string, description: 关系理由 }
        strength: { type: number, minimum: 0, maximum: 1, description: 关系强度；程序边固定 0.3 }
        by: { type: string, enum: [program, ai] }
        citations:
          type: array
          minItems: 1
          description: AI 边的引用必须覆盖两端地址；程序边是同一记录里的来源 IP 与目标主机两个字段
          items: { $ref: '#/components/schemas/ClaimCitation' }
        at: { type: string, format: date-time }
      additionalProperties: false
    TraceBoardActivity:
      type: object
      description: 白板活动流水，按发生顺序追加。kind 的取值见枚举。
      required: [at, kind, title]
      properties:
        at: { type: string, format: date-time }
        kind:
          type: string
          enum: [seed, tool, tool_error, investigate, look, link, conclude, thinking, model_error, error]
          description: |
            seed = 建板；tool = 一次牧云查询；tool_error = 查询或动作校验失败；investigate = 调查一个节点；
            look = 模型查看白板；link = 模型连边；conclude = 模型收尾；thinking = 模型选下一步；
            model_error = 模型输出格式错误正在重试；error = 调查中断或整板失败。
        title: { type: string }
        detail: { type: string }
        node: { type: string, description: 关联的节点 ID（investigate 等） }
        edge: { type: integer, description: 关联的边在 edges 里的下标（link） }
        result: { type: string, description: 这一轮的结果摘要（investigate、look） }
      additionalProperties: false
    RuleSetCondition:
      type: object
      description: 一条条件。字段可用范围随 event_type 变化；条件条数落在「该类型必需字段数」与「该类型可用字段数」之间。
      required: [field, operator, value]
      properties:
        field:
          type: string
          enum: [source_ip, destination_ip, network_type, process_path, command_line, detection_reference,
                 user_name, auth_type, rule_subject, abnormal_type, auth_service, success_count, failure_count,
                 file_path, sha256, shell_command, server_name, class_name, origin_uid, target_uid,
                 privilege_escalation_type, connection_type, rule_name, session_id, honeypot_address,
                 honeypot_type, plugin_id, strategy_id, origin_method]
          description: 该事件类型可用的字段；同一规则内不重复
        operator:
          type: string
          enum: [equals, cidr, lte]
          description: cidr 只允许 source_ip（IPv4 /24 至 /32）；lte 只允许 failure_count（1 至 200）
        value:
          oneOf: [{ type: string, maxLength: 512 }, { type: integer, minimum: 0 }]
          description: equals 的 IP 类字段要求合法 IP 且不是 0.0.0.0 或 ::；sha256 要求 64 位十六进制；abnormal_type 只收 1、2、3
      additionalProperties: false
    RuleSetRule:
      type: object
      required: [id, enabled, action, event_type, host_id, reason, approved_by, valid_from, expires_at, conditions]
      properties:
        id: { type: string, pattern: '^[A-Za-z0-9_-]{3,64}$' }
        enabled: { type: boolean }
        action:
          type: string
          enum: [observe, review_false_positive, classify_false_positive]
          description: 只有这三种；规则只产生建议，不产生处置动作
        event_type:
          type: string
          enum: [webshell, malware, revshell, memory_webshell, brute_force, abnormal_login, elevation_process,
                 network_audit, suspicious_operation, honeypot, memory_security]
        host_id: { type: integer, minimum: 1, description: 只对这一台主机生效 }
        source_alert_id:
          type: string
          pattern: '^[a-z_]+:[1-9][0-9]*$'
          description: action=review_false_positive 时必填；非空时必须形如 <event_type>:<正整数>
        reason: { type: string, description: 去空白后非空 }
        approved_by: { type: string, description: 去空白后非空 }
        valid_from: { type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?Z$', description: UTC ISO 串，且必须早于 expires_at }
        expires_at: { type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?Z$' }
        conditions:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/RuleSetCondition' }
      additionalProperties: false
    RuleSet:
      type: object
      description: 规则集文件内容。顶层只有这三个键，多一个键整份判为无效。
      required: [schema_version, enabled, rules]
      properties:
        schema_version: { type: integer, const: 1, description: 只接受 1；其它值整份判为无效 }
        enabled: { type: boolean, description: false 时不进入规则评估，evaluate 直接回 disabled }
        rules:
          type: array
          maxItems: 200
          description: 规则 ID 不得重复；空数组合法
          items: { $ref: '#/components/schemas/RuleSetRule' }
      additionalProperties: false
    AlertDetail:
      type: object
      description: |
        牧云原始事件对象（`raw.event || raw`），本仓不裁字段、不归一化成固定结构——**字段随事件类型变化**，同一键在不同类型里含义也不同
        （例如 `type` 在 network_audit 是网络类型，在 suspicious_operation 是连接类型）。消费方只按需读键，不假设字段齐全。

        通用可读键（详情证据只挑这 10 个，见 `cloudwalker.js:68-81`）：
        `cmdline` / `shell_cmdline` / `process_path` / `uname` / `remote_addr` / `local_addr` / `file_path` / `description` /
        `process_tree`（数组，只取节点数）/ `cmdlines`（数组，只取条数）。

        按事件类型读到的原生键（规则预筛的映射表，见 `triage-rules.js:36-46`）：
        - `webshell` / `malware`：`path`、`sha256`、`detect_reason`
        - `revshell`：`local_addr`、`remote_addr`、`shell_cmdline`、`process_path`
        - `memory_webshell`：`server_name`、`class_name`、`sha256`、`detect_reason`
        - `elevation_process`：`exepath`、`cmdline`、`origin_uid`、`target_uid`、`privilege_escalation_type`
        - `suspicious_operation`：`ssh_client_ip`、`type`、`rule_name`、`path`、`cmdline`、`uname`、`session_id`
        - `honeypot`：`source_ip`、`address`、`type`、`time_aix`/`time_axis`（数组，含 `source_ip`）
        - `memory_security`：`plugin_id`、`strategy_id`、`origin_method`、`detect_reason`
        - `network_audit`：`local_addr`、`target`、`type`、`process_path`、`cmdline`、`reference`、`uname`
        - `abnormal_login`：`login_ip`、`login_username`、`auth_type`、`rule_subject`、`login_abnormal_type`
        - `brute_force`：从 `time_aix`/`time_axis` 行里取 `source_ip`

        身份校验：`event_id ?? id` 必须是正的安全整数且等于请求的事件号，否则按 404（牧云可达但没有这条事件）处理。
      additionalProperties: true
    TypedAlertId:
      type: string
      pattern: '^[a-z_]+:[1-9][0-9]*$'
      examples: [revshell:1, suspicious_operation:8]
    Alert:
      type: object
      required: [id]
      properties:
        id: { $ref: '#/components/schemas/TypedAlertId' }
        title: { type: string }
        createdAt: { type: [string, 'null'], format: date-time }
        asset: { type: string }
        assetIp: { type: string }
        level: { type: string }
        levelKey:
          type: string
          enum: [low, medium, high, critical, unknown]
          description: 机器可读等级；level 下的 1–4 分别对应 low/medium/high/critical，其他值为 unknown
        verdict: { type: string, description: 中文结论展示值；未研判为「待研判」 }
        verdictKey:
          type: string
          description: 机器可读结论；未研判为 review，研判记录有结论时为 threat / uncertain / false_positive
        triage: { oneOf: [{ $ref: '#/components/schemas/TriageCase' }, { type: 'null' }] }
      additionalProperties: true
    TriageSummary:
      type: object
      required: [initialized, enabled, input_mode, since, counts, verdict_counts, type_counts, queue, failure_reasons, retry, paused, archived, persist]
      properties:
        initialized: { type: boolean }
        enabled: { type: boolean }
        input_mode: { type: string, enum: [syslog, poll] }
        syslog:
          type: object
          description: |
            仅 input_mode=syslog 时出现；poll 模式没有这个键（改带 interval_ms）。
            三种状态可区分：未尝试绑定 {listening:false, bind:null, error:null}；绑上 {listening:true, bind:"udp://…", error:null}；
            绑定失败 {listening:false, bind:null, error:"<原因>"}。listening=false 表示这条输入一条消息也收不到。
          required: [listening, bind, error]
          properties:
            listening: { type: boolean, description: 是否已绑上 UDP 端口 }
            bind: { type: [string, 'null'], description: 绑上时的 udp://<address>:<port>；否则为 null }
            error: { type: [string, 'null'], description: 绑定失败原因（截 300 字），如 bind EADDRINUSE 127.0.0.1:15514；未失败为 null }
          additionalProperties: false
        last_poll_at:
          type: [string, 'null']
          description: 最近一次轮询牧云的时刻；syslog 模式没有轮询，恒为 null（最后一条报文的到达时刻看 last_received_at）
        last_received_at:
          type: [string, 'null']
          description: |
            仅 input_mode=syslog 时出现；最后一条入队 syslog 报文**到达接收服务器**的时刻（接收端时钟，不是牧云事件时间），
            重启后不丢。还没收到过任何报文时为 null；报文解析失败、MsgId 无对应研判场景、暂停期间被跳过的报文都不算收到，不推进这个值
        last_error: { type: [string, 'null'] }
        backoff_ms:
          type: integer
          description: |
            下一轮轮询的延迟（毫秒）。P003-T037：空轮按 `intervalMs × 2^empty_polls` 翻倍，见到新告警立刻回到 interval_ms；
            syslog 模式没有轮询，恒为缺省 interval。上限 maxBackoffMs（缺省 intervalMs × 16）
        empty_polls:
          type: integer
          description: 连续空轮数（含失败轮）；见到新告警清零。P003-T037
        concurrency:
          type: integer
          description: |
            实际生效的同时研判条数：`HIDS_TRIAGE_CONCURRENCY` 规范化后的值（缺省 2，env 里的 `0` / 负数 / 小数 / 非数回落 2）。
            `poll` 与 `syslog` 两种输入模式同一口径，装配处不覆盖。构造参数显式传数字 `0` 表示「只排队不执行」（测试与停机维护用），
            此时本字段回 `0`；生产装配不覆盖该参数，只按 env 生效。P003-T037
        queue_limit:
          type: integer
          description: 队列上限（排队 + 在跑，HIDS_TRIAGE_QUEUE_MAX，缺省 1000）。P003-T037
        dropped:
          type: integer
          description: 因队列上限被丢弃的告警累计条数（进程重启归零）。P003-T037
        since:
          type: [string, 'null']
          description: 本次聚合的起点（请求里的 since 归一成 RFC3339）；不带 since 时为 null。三个聚合都按它算
        counts:
          type: object
          description: 四种队列状态的条数；带 since 时只算该时刻后进入队列的记录。四键恒在，没有记录的为 0
          properties:
            queued: { type: integer }
            running: { type: integer }
            done: { type: integer }
            failed: { type: integer }
        verdict_counts:
          type: object
          description: |
            结论分布。四键恒在（没有记录时为 0）。口径与 `GET /api/agent/triage/cases?verdict=` 一致：
            记录上没有结论的算 review；记录上的结论不在三态里（历史快照里的 undetermined / needs_review 之类）同样算 review
          required: [threat, uncertain, false_positive, review]
          properties:
            threat: { type: integer, description: 真实威胁 }
            uncertain: { type: integer, description: 存疑 }
            false_positive: { type: integer, description: 误报 }
            review: { type: integer, description: 待研判 / 没有结论 }
          additionalProperties: false
        type_counts:
          type: object
          description: |
            事件类型分布，键是 syslog MsgId 经 `eventTypeFor` 映射出的类型（如 revshell / honeypot）。
            只列出现过的类型，没出现过的键不出现（空队列为 `{}`）；没有事件类型的记录（轮询入口入队、没有 input，
            或 MsgId 不在映射表里）计入 `unknown`
          additionalProperties: { type: integer }
        queue:
          type: object
          description: 此刻的队列深度与最老等待。**不跟 since 走**（与上面三个聚合口径不同）
          required: [depth, running, oldest_wait_ms, oldest_alert_id, retry_waiting]
          properties:
            depth: { type: integer, description: 排队中的记录条数（status=queued） }
            running: { type: integer, description: 正在研判的条数 }
            oldest_wait_ms:
              type: [integer, 'null']
              description: 排队中那条等得最久的已经等了多久（毫秒，从它最近一次回到 queued 的时刻算）；没有排队时为 null
            oldest_alert_id: { type: [string, 'null'], description: 等得最久的那条；没有排队时为 null }
            retry_waiting: { type: integer, description: 失败但还没到死信上限、等自动重排的条数 }
          additionalProperties: false
        failure_reasons:
          type: object
          description: |
            失败原因分布：键是失败记录上的失败原因（P003-T052 起只写固定文案 + 原文字符量，如 `上游调用失败，原文 26 字未落盘`；
            不再含错误原文、也不再截断；取 `failure.reason`，没有时取 `detail`），值是条数。
            死信也算在里面（它与“还能重试”只差 `retry.dead_letters` 那个计数）。空对象表示没有失败记录。
            不跟 since 走。
          additionalProperties: { type: integer }
        retry:
          type: object
          description: 失败重排的上限（可直接告诉运维“还能自动跑几次”）。不跟 since 走
          required: [base_ms, max_ms, max_attempts, dead_letters]
          properties:
            base_ms: { type: integer, description: 第 1 次失败后的等待毫秒数；第 n 次是 base * 2^(n-1) }
            max_ms: { type: integer, description: 单次退避的上限毫秒数 }
            max_attempts: { type: integer, description: attempts 到这个数就进死信，不再自动重跑 }
            dead_letters: { type: integer, description: 死信条数（status 仍是 failed，记录上带 dead_letter=true） }
          additionalProperties: false
        paused:
          type: object
          description: 暂停窗口的计数：暂停期间收到多少、多少在缓冲里、多少因缓冲上限丢了、恢复后回灌了多少
          required: [active, since, received, buffered, dropped, replayed]
          properties:
            active: { type: boolean, description: 当前是否在暂停（enabled 的反面，给一眼看） }
            since: { type: [string, 'null'], description: 本轮暂停开始的时刻；从未暂停过为 null }
            received: { type: integer, description: 本轮暂停期间收到的报文条数（含因上限丢弃的） }
            buffered: { type: integer, description: 当前缓冲区里还排着多少条（持久化，重启不丢） }
            dropped: { type: integer, description: 本轮暂停期间因缓冲区满丢弃的条数 }
            replayed: { type: integer, description: 最近一次恢复时回灌的条数 }
          additionalProperties: false
        archived:
          type: object
          description: done 记录的 TTL 归档（过期的移出内存队列，追加到 `<队列文件>.archive.jsonl`）
          required: [count, ttl_ms]
          properties:
            count: { type: integer, description: 本进程已归档的条数（持久化） }
            ttl_ms: { type: integer, description: done 记录在内存里保留多久（毫秒），缺省 24 小时 }
          additionalProperties: false
        persist:
          type: object
          description: 队列快照的落盘节奏（合并写窗口）
          required: [interval_ms, unflushed]
          properties:
            interval_ms: { type: integer, description: 合并写窗口：热路径标脏，最多 1 次 / 这个毫秒数落盘 }
            unflushed: { type: boolean, description: 是否还有没落盘的脏状态 }
          additionalProperties: false
        syslog_stats:
          type: object
          description: |
            仅 input_mode=syslog 时出现。收包计数（本进程累计）：`inbound` = 进处理器的报文数，其余按结果分开计。
            内核 socket 缓冲满导致的丢包在进程内拿不到，不在这个计数里（进程里看得见的丢弃是 `dropped`：暂停缓冲区溢出）。
            与 `syslog` 分开：那个是“能不能收到”（绑定状态），这个是“收了多少 / 丢了多少”。
          required: [inbound, accepted, collapsed, buffered, dropped, rejected, failed]
          properties:
            inbound: { type: integer, description: 进入处理器的报文总数 }
            accepted: { type: integer, description: 建成新研判记录的条数 }
            collapsed: { type: integer, description: 同秒重复投递被合并到已有记录的条数 }
            buffered: { type: integer, description: 暂停期间进缓冲区的条数 }
            dropped: { type: integer, description: 暂停缓冲区满丢弃的条数 }
            rejected: { type: integer, description: 解析失败或 MsgId 无对应研判场景的条数 }
            failed: { type: integer, description: 处理链抛错的条数 }
          additionalProperties: false
    TriageCase:
      type: object
      required: [alert_id, status]
      properties:
        alert_id: { type: string }
        matched_alert_id: { type: [string, 'null'] }
        status: { type: string, enum: [not_queued, queued, running, done, failed] }
        attempts: { type: integer, description: 已经跑了几轮（失败与成功都算）；每次进入 running 加 1 }
        dead_letter:
          type: boolean
          description: |
            是否已进死信：失败次数到 `TriageSummary.retry.max_attempts` 后置 true，不再自动重排，原因留在 `failure`。
            status 仍是 failed（不新增状态值），要重跑走 POST /api/agent/triage/{alertId} 人工重试。
        next_attempt_at: { type: [string, 'null'], description: 下一次自动重排的时刻；死信中或不在等重试时为 null }
        failure:
          type: [object, 'null']
          description: 最近一次失败的原因；status 不是 failed 时为 null / 不带
          properties:
            reason: { type: string, description: 失败原因（P003-T052 起是固定文案 + 原文字符量，不再含错误原文、不再截断；与 detail 同源） }
            code: { type: string, description: 错误自带的 code 或 name（如 ETIMEDOUT） }
            at: { type: string, format: date-time }
          additionalProperties: false
        stage: { type: string }
        detail: { type: string }
        verdict_label: { type: [string, 'null'], enum: [真实威胁, 存疑, 误报, null] }
        verdict:
          type: [string, 'null']
          enum: [threat, uncertain, false_positive, null]
          description: 机器可读结论；人工登记误报后就是 `false_positive`，此后重试也不会被那次研判改回去
        decision_source:
          type: [string, 'null']
          description: 结论来源；人工登记误报后是 `human`，研判产出是 `ai`／`rule`
        feedback:
          $ref: '#/components/schemas/FalsePositiveFeedback'
        maintenance:
          $ref: '#/components/schemas/CaseMaintenance'
        report: { type: [string, 'null'] }
        verified_facts: { type: integer }
        evidence_sources: { type: integer }
        evidence:
          type: array
          description: |
            本次研判实际取到的证据条目，按取证顺序。工具入参只在 RPC 形态时保留，
            含原文的剥掉并置 args_omitted（见 TriageEvidence）；未配置研判或记录仍在排队时是空数组。
          items: { $ref: '#/components/schemas/TriageEvidence' }
        steps:
          type: array
          description: |
            研判步骤流水，按发生顺序；只保留最近 80 条。
            出现在三处：单条研判查询 GET /api/agent/triage/{alertId}；告警列表与详情里内嵌的 triage（server.js 把 status() 全量塞进每条告警）；仅 GET /api/agent/triage/cases 的列表项没有这个键。
            未入队的记录没有这个键；排队中、失败的记录是空数组。
          items: { $ref: '#/components/schemas/TriageStep' }
      additionalProperties: true
    FalsePositiveFeedback:
      type: object
      description: 人工误报登记：值守分析员给的原话理由与登记人。
      required: [reason, who, recorded_at]
      properties:
        reason: { type: string, description: 误报理由，10 到 4000 字 }
        who: { type: string, description: 登记人，2 到 100 字 }
        recorded_at: { type: string, format: date-time }
      additionalProperties: false
    MaintenanceSide:
      type: object
      description: |
        单边维护状态。`status` 仍是三个值（`updating` / `updated` / `failed`），表示「这一边收尾了没有、失败了没有」；
        **到底动没动这个库**看 `state`（P003-T047）：`updated` 真写了库、`no_change` 判断不需要改、
        `skipped` 幂等跳过或本次没请求、`failed` 失败。`updated` 的语义按边不同：规则那边表示那一份 Rego 已经写进
        `<数据根>/rules/` 并通过解析；wiki 那边表示判据页已经过发布闸写进去（`page` / `revision`）。
      required: [status]
      properties:
        status: { type: string, enum: [updating, updated, failed] }
        state: { type: string, enum: [updated, no_change, skipped, failed], description: 这一侧实际动没动库（见本 schema 说明） }
        why: { type: string, description: 这一侧这样收尾的理由（`no_change`/`skipped` 时是决策理由或「本次只补跑…」） }
        idempotency_key: { type: string, description: '幂等键 `case_id:库:版本`；补跑时按它判「已成功过」' }
        checks:
          type: array
          description: 自校验项（读回版本、旧版是否进历史、知识库会话是否终态）；注入的替身缺读接口时该项带 skipped=true
          items: { type: object, additionalProperties: true }
        wiki_session_status: { type: string, description: 知识库侧那份维护会话在收尾时的状态（`published` 为终态） }
        at: { type: string, format: date-time }
        error: { type: string, description: failed 时的原因（截 300 字） }
        id: { type: string, description: 规则维护者改的 Rego 规则 id }
        file: { type: string, description: 写进 rules/ 的文件名；只动这一个文件 }
        action: { type: string, enum: [add, update], description: add=新增一条，update=改已有的那条 }
        rationale: { type: string, description: 维护者给的修改理由（截 500 字） }
        session_id: { type: string, description: wiki 维护会话 id }
        page: { type: string, description: wiki 维护者写的方法论页路径 }
        revision: { type: string, description: 写入后这一侧的库版本：知识库侧是页面新 revision，规则侧是规则库摘要（幂等键的第三段） }
        pages: { type: array, items: { type: string }, description: 本次发布涉及的页面路径 }
      additionalProperties: true
    CaseMaintenance:
      type: object
      description: |
        误报登记后的维护进度（P003-T047 收成一个统一维护 Agent，`rule` / `wiki` 两格照旧）。
        总态：还有一边在跑就是 `updating`；都收尾后任一边失败即 `failed`，否则 `updated`。
        维护失败**不改变**案件结论——`verdict` 仍是 `false_positive`。
        一个案件一份多轮会话，全文用 `GET /api/false-positive/sessions/{id}` 读（`session_id` 就是那个 id）。
      required: [status, rule, wiki]
      properties:
        status: { type: string, enum: [updating, updated, failed] }
        updated_at: { type: string, format: date-time }
        session_id: { type: string, description: 这份误报维护会话的 id（`<数据根>/fp-sessions/<id>.json`） }
        sides:
          type: array
          items: { type: string, enum: [rule, wiki] }
          description: 这一轮真的写了库的边；只动规则就是 [rule]，都没动是空数组
        decision:
          type: object
          description: 这一次动哪几边、为什么（决策轮的产出）
          properties:
            source:
              type: string
              enum: [model, fallback, idempotent]
              description: 'model=决策模型给的；fallback=没配模型或回包解不出来，按请求的库逐个尝试；idempotent=请求的库都已在同一版本维护过，本轮没写盘、没调决策模型'
            libraries: { type: array, items: { type: string, enum: [rule, wiki] } }
            why: { type: [string, 'null'] }
          additionalProperties: true
        auto_verdict: { $ref: '#/components/schemas/FpAutoVerdict' }
        libraries:
          type: array
          items: { type: string, enum: [rule, wiki] }
          description: 这一次请求跑哪几边（单腿补跑时只有一项）
        rule: { $ref: '#/components/schemas/MaintenanceSide' }
        wiki: { $ref: '#/components/schemas/MaintenanceSide' }
      additionalProperties: true
    FpAutoVerdict:
      type: object
      description: |
        闭环自动判定的生效口径（P003-T047 A7；A/B 已拍板）。生效判据是 Rego 规则库：研判管线读的和规则维护写的
        是同一本库（同源），信任链只走这一条（单源）；JSON 规则集（`triage-rules.json`）的修订照写留痕，但不是生效判据。
      required: [enabled, criterion]
      properties:
        enabled: { type: boolean, description: 闭环自动判定是否启用（A/B 拍板后为 true） }
        criterion: { type: string, enum: [rego], description: 生效判据：`rego`＝规则库（研判管线同源） }
        trust: { type: string, enum: [single], description: 信任链：`single`＝只认 Rego 这一条源 }
        note: { type: string, description: 一句话口径说明（含「JSON 规则集修订照写留痕、不作为生效判据」） }
      additionalProperties: false
    FpMaintenanceSessionSummary:
      type: object
      description: "GET /api/false-positive/sessions 的列表项：误报维护会话摘要，按 updated_at 倒序。"
      required: [id, case_id, status, terminal]
      properties:
        id: { type: string }
        case_id: { type: string, description: 案件 ID（就是误报入口路径里的 alertId） }
        event_type: { type: [string, 'null'] }
        who: { type: string }
        status: { type: string, enum: [collecting, done, partial, failed], description: 'done|partial|failed 是终态' }
        terminal: { type: boolean, description: 终态会话不会再自动写入（补跑会开一份新会话） }
        libraries: { type: array, items: { type: string, enum: [rule, wiki] }, description: 这一轮请求的库 }
        sides: { type: array, items: { type: string, enum: [rule, wiki] }, description: 真写了库的边 }
        decision_source: { type: [string, 'null'], enum: [model, fallback, idempotent, null] }
        updated_at: { type: string, format: date-time }
      additionalProperties: false
    FpMaintenanceSession:
      type: object
      description: |
        一份误报维护会话的全文（`GET /api/false-positive/sessions/{id}`）。多轮：`case`（读案卷）→ `libraries`（读两库）→
        `propose`（提修订，一次模型调用）→ `verify`（写入 + 自校验）。`messages[]` 形制对齐 wiki-sessions。
      required: [id, case_id, status, turns, messages, outcomes]
      properties:
        id: { type: string }
        case_id: { type: string }
        case_dir: { type: [string, 'null'], description: 案卷目录（旧案件可能没有） }
        event_type: { type: [string, 'null'] }
        who: { type: string }
        reason: { type: string }
        libraries_requested: { type: array, items: { type: string, enum: [rule, wiki] } }
        status: { type: string, enum: [collecting, done, partial, failed] }
        terminal: { type: boolean }
        turns:
          type: array
          items:
            type: object
            required: [n, phase, at, summary]
            properties:
              n: { type: integer }
              phase: { type: string, enum: [case, libraries, propose, verify, skip] }
              at: { type: string, format: date-time }
              summary: { type: string }
            additionalProperties: false
        messages:
          type: array
          items:
            type: object
            required: [role, content]
            properties:
              role: { type: string, enum: [user, assistant] }
              kind: { type: string, description: 'case / libraries / decision / verify（人工可读的那几句话没有 kind）' }
              content: { type: string }
              at: { type: string, format: date-time }
            additionalProperties: true
        decision: { $ref: '#/components/schemas/CaseMaintenance/properties/decision' }
        outcomes:
          type: object
          description: 单边 outcome：`state` / `why` / `error` / `idempotency_key` / `revision`，规则侧另有 `id`/`file`/`action`，知识库侧另有 `page`/`pages`/`session_id`。
          properties:
            rule: { $ref: '#/components/schemas/MaintenanceSide' }
            wiki: { $ref: '#/components/schemas/MaintenanceSide' }
          additionalProperties: false
        validation:
          type: object
          properties:
            ok: { type: boolean }
            checks: { type: array, items: { type: object, additionalProperties: true } }
          additionalProperties: false
        auto_verdict: { $ref: '#/components/schemas/FpAutoVerdict' }
        error: { type: string, description: 会话级失败原因（单边失败落在 `outcomes.<边>.error` 上） }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      additionalProperties: true
    FalsePositiveRecord:
      type: object
      description: 误报登记的响应：结论、理由、两个维护者的进度。
      required: [alert_id, verdict, feedback, maintenance]
      properties:
        alert_id: { type: string }
        verdict:
          type: object
          required: [verdict, verdict_label, source]
          properties:
            verdict: { type: string, enum: [false_positive] }
            verdict_label: { type: string, enum: [误报] }
            source: { type: string, enum: [human], description: 人工登记（研判时的 AI 结论会写成 ai / rule） }
        feedback: { $ref: '#/components/schemas/FalsePositiveFeedback' }
        maintenance: { $ref: '#/components/schemas/CaseMaintenance' }
      additionalProperties: false
    TriageCaseListItem:
      type: object
      description: |
        `GET /api/agent/triage/cases` 的列表项。只列有原始 syslog 报文的记录；字段是记录上的现状快照，`total` 为过滤后条数。
        与单条查询（`TriageCase`）的区别：这里带 `msgid` / `event_time` / `host_ip` / `source_ip` / `command` / `repeat_count`，但没有 `steps`。
      required: [alert_id, status, repeat_count]
      properties:
        alert_id:
          type: string
          description: syslog 案件 ID，形如 `syslog:<类型>:<指纹16位>:<秒|unknown>:<uuid>`；用它就能打开本条研判（`GET /api/agent/triage/{alertId}`），不要求先有牧云事件号
        matched_alert_id:
          type: [string, 'null']
          description: 关联到的牧云事件 ID；未匹配为 null
        result_alert_id:
          type: [string, 'null']
          description: 研判记录存盘时的 ID（`history.save()` 的返回）；未落盘为 null
        status: { type: string, enum: [not_queued, queued, running, done, failed] }
        stage: { type: string, description: 当前阶段中文名，如 等待研判、关联事件、研判完成、研判失败 }
        detail: { type: string, description: 阶段说明；完成后是结论摘要，失败时是失败原因（P003-T052 起是固定文案 + 原文字符量，不再含错误原文、不再截断） }
        created_at: { type: string, format: date-time, description: 记录创建时间（收到 syslog 的时刻） }
        updated_at: { type: string, format: date-time }
        saved_at: { type: [string, 'null'], format: date-time }
        case_dir: { type: [string, 'null'], description: 案件目录绝对路径；还没写材料时为 null }
        repeat_count:
          type: integer
          minimum: 1
          description: |
            重复投递次数，直接沿用记录上的 `repeat_count`（同秒重复投递合并时累加，1 表示只投递过一次）。
            本列表不另造计数：没有 `delivery_count` / `occurrence_count` 这类第二条口径。
        verdict:
          type: [string, 'null']
          enum: [threat, uncertain, false_positive, null]
          description: 机器可读结论；还没结论为 null（结论筛里按 review 算）
        verdict_label: { type: [string, 'null'], enum: [真实威胁, 存疑, 误报, null] }
        summary: { type: [string, 'null'], description: 结论摘要 }
        report: { type: [string, 'null'] }
        missing_evidence: { type: array, items: { type: string } }
        next_actions: { type: array, items: { type: string } }
        evidence_refs:
          type: array
          description: 结论引用到的证据指针，最多 10 条
          items:
            type: object
            properties:
              evidence_id: { type: string }
              pointer: { type: string }
        evidence:
          type: array
          description: 本次研判实际取到的证据条目；未入队或排队中是空数组
          items: { $ref: '#/components/schemas/TriageEvidence' }
        verified_facts: { type: integer, description: 通过校验的事实条数 }
        evidence_sources: { type: integer, description: 去重后的证据编号个数 }
        msgid: { type: string, description: syslog MsgId，如 cloudwalker-webshell；类型筛就按它映射出的类型比 }
        decision_source: { type: string, description: 结论来源，如 ai / rule }
        rule_id: { type: [string, 'null'], description: 规则评估命中的规则 ID }
        event_time:
          type: [string, integer]
          description: syslog 事件时间，取值 `payload.event_create_time` → `payload.event_start_time` → 报文头 `ts`；时间筛就按它（换算成秒后比）
        host_ip: { type: [string, 'null'], description: syslog 里的主机 IP；主机筛按它精确匹配 }
        source_ip: { type: [string, 'null'], description: 来源 IP（source_ip 或 login_ip） }
        command: { type: [string, 'null'], description: 进程命令行 }
      additionalProperties: true
    Investigation:
      type: object
      required: [alert_id, mode, verdict]
      properties:
        alert_id: { type: string }
        mode: { type: string, enum: [triage, deep] }
        saved_at: { type: string, format: date-time }
        verdict:
          type: object
          properties:
            verdict: { type: string, enum: [threat, uncertain, false_positive] }
            verdict_label: { type: string, enum: [真实威胁, 存疑, 误报] }
            report: { type: string, maxLength: 300 }
            summary: { type: string }
            claims:
              type: array
              description: 已核验事实；常规研判下未通过校验的条目会被删掉，条数可以变少。
              items: { $ref: '#/components/schemas/Claim' }
            missing_evidence:
              type: array
              description: 证据缺口，纯字符串数组；常规研判会把必查项缺口去重后并进来。
              items: { type: string }
          additionalProperties: true
        review: { $ref: '#/components/schemas/Review' }
        validation: { $ref: '#/components/schemas/Validation' }
        evidence:
          type: array
          description: 本次取证会话的全部记录，按取证顺序；syslog 未匹配旁路固定一条 syslog:1。
          items: { $ref: '#/components/schemas/EvidenceRecord' }
        trace: { type: array, items: { type: object, additionalProperties: true } }
        turns:
          type: array
          description: |
            本次会话的逐轮快照（P003-T046）：每次模型调用一条，只记计量与结论，不含消息正文。
            回放接口 `GET /api/agent/investigations/{alertId}/replay` 读的就是它；旧记录没有这个键。
          items: { $ref: '#/components/schemas/InvestigationTurn' }
        required_evidence:
          type: array
          description: 必查项及其结果；常规研判与深度研判都有（P003-T035 起），经验复用捷径也带（它先采必查项再核经验）。
          items: { $ref: '#/components/schemas/RequiredEvidence' }
      additionalProperties: true
    InvestigationTurn:
      type: object
      description: |
        一次模型调用的逐轮快照（P003-T046）。只记计量与结论，**消息正文一个字都不在这里**。
        `turn` 是调查轮次；循环外的单发调用顺延：捷径=1、独立复核=调查轮数+1、修订=+2、引用校验退回=+3+第几次。
      required: [turn, phase, role, attempt, messages, input_chars, reply_chars, tools, outcome, conclusion, note]
      properties:
        turn: { type: integer, description: 轮次（1 起） }
        phase: { type: string, enum: [shortcut, investigate, review, revision, validation, narrative] }
        role: { type: string, enum: [triage, review], description: review＝独立复核那一轮用的复核模型 }
        attempt: { type: integer, description: 同一轮同一 phase 的第几次调用（超时重试＝2） }
        messages: { type: integer, description: 这一轮发给模型的消息条数 }
        input_chars: { type: [integer, 'null'], description: 请求体（messages 与 tools）序列化后的字符数；调用本身挂掉、拿不到计量时为 null }
        reply_chars: { type: [integer, 'null'], description: 回包 content 字符数（tool_calls 不计入） }
        tools:
          type: array
          description: 这一轮模型**点了**哪些工具（不是请求里给了哪些可选工具——工具目录整轮不变，列它没意义）
          items: { type: string }
        outcome: { type: string, enum: [ok, timeout, invalid_json, error] }
        conclusion: { $ref: '#/components/schemas/InvestigationTurnConclusion' }
        note: { type: [string, 'null'], description: 这一轮的附注（解析失败 / 结论被退回 / 复核结论 / 修订失败的原因摘要） }
      additionalProperties: false
    InvestigationTurnConclusion:
      type: [object, 'null']
      description: 这一轮模型给出的结论摘要；没有结论（点了工具 / 解析失败 / 复核轮）时为 null。
      required: [verdict, verdict_label, confidence]
      properties:
        verdict: { type: string, enum: [threat, uncertain, false_positive] }
        verdict_label: { type: string, enum: [真实威胁, 存疑, 误报] }
        confidence: { type: [string, 'number'] }
      additionalProperties: false
    InvestigationReplay:
      type: object
      description: 一次研判会话的回放视图（P003-T046）：读已落盘的研判记录与证据，不重放模型。
      required: [alert_id, mode, degraded, counts, turns, tool_calls, verdicts, final, evidence]
      properties:
        alert_id: { type: string }
        mode: { type: string, enum: [triage, deep] }
        model: { type: [string, 'null'], description: 当时用的模型名 }
        saved_at: { type: [string, 'null'], format: date-time }
        prompt_version: { type: [string, 'null'] }
        degraded: { type: boolean, description: 这轮是不是降级结论（调查轮数用尽 / 引用校验未通过） }
        counts:
          type: object
          required: [turns, tool_calls, evidence]
          properties:
            turns: { type: integer, description: 逐轮快照条数＝这次会话里落过事件的模型调用数（旧记录为 0） }
            tool_calls: { type: integer }
            evidence: { type: integer }
          additionalProperties: false
        turns:
          type: array
          items: { $ref: '#/components/schemas/InvestigationTurn' }
        tool_calls:
          type: array
          description: 工具调用序列，按发生顺序；含重复查询（kind=tool_reuse）、失败的那次（kind=tool_error）、读回证据与读判据页
          items: { $ref: '#/components/schemas/ReplayToolCall' }
        verdicts:
          type: array
          description: 各轮结论变化——只列模型真给出结论的轮（调查轮 / 修订轮 / 引用校验退回轮）
          items: { $ref: '#/components/schemas/ReplayVerdict' }
        final:
          type: object
          required: [verdict, verdict_label, confidence, summary]
          properties:
            verdict: { type: [string, 'null'], description: threat / uncertain / false_positive；没有结论时为 null }
            verdict_label: { type: [string, 'null'], description: 真实威胁 / 存疑 / 误报 }
            confidence: { type: [string, 'number', 'null'] }
            summary: { type: [string, 'null'] }
          additionalProperties: false
        review: { type: [object, 'null'], additionalProperties: true, description: 独立复核结论（assessment / concerns / missing_evidence） }
        validation: { type: [object, 'null'], additionalProperties: true, description: 引用校验结果（ok / errors / degraded） }
        evidence:
          type: array
          description: 本次取证会话的证据清单（编号 / 工具 / 取到时刻 / 指纹），不带证据正文
          items: { $ref: '#/components/schemas/ReplayEvidence' }
      additionalProperties: false
    ReplayToolCall:
      type: object
      description: 回放里的工具调用序列一项。只白名单取字段（req 参数与正文一律不进回放）。
      required: [step, kind]
      properties:
        step: { type: integer, description: 第几次（1 起） }
        kind: { type: string, enum: [tool, tool_reuse, tool_error, read_evidence, case_file, wiki] }
        turn: { type: integer, description: 发生在调查第几轮；取证前的原始事件读取没有轮次 }
        name: { type: string, description: 工具名（kind=case_file 时是案卷文件名，kind=wiki 时没有这个名字） }
        action: { type: string, description: kind=wiki 时的动作：index / context / page / search / required }
        id: { type: string, description: kind=wiki 时的判据页编号 }
        keyword: { type: string, description: kind=wiki 且 action=search 时的关键词 }
        evidence_id: { type: string, description: 这次调用产出的证据编号 }
        found: { type: boolean, description: kind=read_evidence 时：证据取回来了没有 }
        error: { type: string, description: kind=tool_error 时的失败原因（≤200 字） }
        matches: { type: integer, description: kind=wiki 且 action=search 时命中几页 }
      additionalProperties: false
    ReplayVerdict:
      type: object
      required: [turn, verdict]
      properties:
        turn: { type: [integer, 'null'] }
        phase: { type: [string, 'null'] }
        verdict: { type: string, enum: [threat, uncertain, false_positive] }
        verdict_label: { type: string, enum: [真实威胁, 存疑, 误报] }
        confidence: { type: [string, 'number'] }
      additionalProperties: false
    ReplayEvidence:
      type: object
      required: [evidence_id, tool, fetched_at, sha256]
      properties:
        evidence_id: { type: string }
        tool: { type: string }
        fetched_at: { type: [string, 'null'], format: date-time }
        sha256: { type: [string, 'null'] }
      additionalProperties: false
    TraceBoardAlert:
      type: object
      description: 白板绑定的那条告警；手填 IP 起的白板 type / occurred_at 为 null。
      properties:
        id: { type: string }
        type: { type: [string, 'null'], description: 事件类型名，如 honeypot }
        title: { type: string }
        host: { type: [string, 'null'], description: 告警主机地址 }
        occurred_at: { type: [string, 'null'], format: date-time, description: 告警发生时间 }
      additionalProperties: true
    TraceBoardSummary:
      type: object
      description: 溯源列表的一行。不含链本身，也不放结论（威胁 / 误报是告警分析的事）。
      required: [id, status, chain_length, has_gaps]
      properties:
        id: { type: string }
        alert_id: { type: [string, 'null'] }
        title: { type: string }
        type: { type: [string, 'null'], description: 告警事件类型名 }
        host: { type: [string, 'null'], description: 告警主机地址 }
        occurred_at: { type: [string, 'null'], format: date-time, description: 告警时间，筛选 from/to 就按它比 }
        status: { type: string, enum: [running, done, failed, interrupted] }
        chain_length: { type: integer, description: 链长＝hops 个数（含告警那一跳） }
        has_gaps: { type: boolean, description: 有没有断点（gaps 非空） }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      additionalProperties: true
    TraceBoardHop:
      type: object
      description: 触发链上的一跳。告警那一跳用 kind=alert；其余按当前取证能力是主机（kind=host）。
      required: [id, kind, label, host, occurred_at, evidence_id, discovered]
      properties:
        id: { type: string }
        kind: { type: string, enum: [alert, host, process, file, account, request] }
        label: { type: string }
        host: { type: [string, 'null'], description: 这一跳在哪台机器上 }
        occurred_at: { type: [string, 'null'], format: date-time, description: 这一跳发生时间；未知为 null }
        evidence_id: { type: [string, 'null'], description: 撑着这一跳的原始证据 ID }
        discovered: { type: integer, description: 第几个被发现（1 起） }
      additionalProperties: true
    TraceBoardLink:
      type: object
      description: 触发链上的一条线。方向固定：from 是更晚的一端（靠告警），to 是更早的原因。
      required: [id, from, to, rel, evidence_id]
      properties:
        id: { type: string }
        from: { type: string, description: 更晚的一跳的 hop id }
        to: { type: string, description: 更早的原因的 hop id }
        rel: { type: string, description: 关系标签 }
        evidence_id: { type: [string, 'null'], description: 撑着这条线的原始证据 ID }
      additionalProperties: true
    TraceBoardGap:
      type: object
      description: 一个断点：断在哪一跳的左边，为什么断。hop_id 为 null 表示整条链层面的缺口。
      required: [hop_id, reason]
      properties:
        hop_id: { type: [string, 'null'], description: 往回的链在这一跳的左侧断了 }
        reason: { type: string, description: 为什么断（如 HIDS 上没有更早的记录） }
      additionalProperties: false
    TraceBoardDiscovery:
      type: object
      description: 发现顺序的一项，重放只播这个数组。
      required: [step, kind, id]
      properties:
        step: { type: integer, description: 第几步（1 起） }
        kind: { type: string, enum: [hop, link] }
        id: { type: string, description: hop id 或 link id }
      additionalProperties: false
    TraceBoard:
      type: object
      properties:
        id: { type: string }
        alert_id: { type: [string, 'null'] }
        title: { type: string }
        seed: { type: string, description: 起点节点 ID }
        run_id: { type: string, format: uuid, description: 本次运行 ID }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        status:
          type: string
          enum: [running, done, failed, interrupted]
          description: 进程重启后读到 running 而未在跑的任务会被改写成 interrupted
        alert: { $ref: '#/components/schemas/TraceBoardAlert' }
        hops:
          type: array
          description: 往回的链上的一跳一跳；告警那一跳在最前（discovered=1，kind=alert）
          items: { $ref: '#/components/schemas/TraceBoardHop' }
        links:
          type: array
          description: 线由更晚指向更早（from 更晚、to 更早）
          items: { $ref: '#/components/schemas/TraceBoardLink' }
        discovery:
          type: array
          description: 发现顺序；实时运行时往数组后面追加
          items: { $ref: '#/components/schemas/TraceBoardDiscovery' }
        chain_length: { type: integer, description: 链长＝hops 个数（含告警那一跳） }
        has_gaps: { type: boolean, description: 有没有断点（gaps 非空） }
        nodes: { type: array, items: { $ref: '#/components/schemas/TraceBoardNode' }, description: 旧字段：节点；与 hops 一一对应，保留兼容 }
        edges: { type: array, items: { $ref: '#/components/schemas/TraceBoardEdge' }, description: 旧字段：关系；links 由它定向得出 }
        activity: { type: array, items: { $ref: '#/components/schemas/TraceBoardActivity' }, description: 旧字段：调查过程；不再是主数据 }
        summary: { type: string }
        gaps:
          type: array
          description: '断点；旧白板里的字符串缺口读取时归一成 {hop_id: null, reason}'
          items: { $ref: '#/components/schemas/TraceBoardGap' }
        investigations: { type: integer, description: 已调查的节点数 }
        window:
          type: object
          properties:
            since: { type: string, format: date-time }
            until: { type: string, format: date-time }
            hours: { type: integer, description: 口径提示值；告警起点实际是观测前 24 小时到后 48 小时 }
        model: { type: [string, 'null'] }
        focus: { type: string }
        origin_evidence: { type: [object, 'null'], additionalProperties: true }
      additionalProperties: true
    RuleSetResponse:
      type: object
      properties:
        config: { $ref: '#/components/schemas/RuleSet' }
        revision: { type: [string, 'null'] }
        writable: { type: boolean }
      additionalProperties: true
    RegoRuleSummary:
      type: object
      description: 规则库列表里的一条规则元数据，不含 Rego 原文。
      required: [id, name, description, file]
      properties:
        id: { type: string, pattern: '^[a-z][a-z0-9_]*$', description: 取 `package hids.rules.<id>` 的最后一段；也是读取原文时的路径参数 }
        name: { type: string, description: '`# name:` 注释里的显示名，必填' }
        description: { type: [string, 'null'], description: '`# description:` 注释；没写是 null' }
        file: { type: string, description: 规则文件名（相对 rules/ 目录），只用于定位，不参与寻址 }
      additionalProperties: false
    RegoRule:
      type: object
      description: 单条规则：元数据加 Rego 原文。
      required: [id, name, description, file, rego, revision]
      properties:
        id: { type: string, pattern: '^[a-z][a-z0-9_]*$' }
        name: { type: string }
        description: { type: [string, 'null'] }
        file: { type: string }
        rego: { type: string, description: 整份 .rego 文件原文，逐字返回 }
        revision:
          type: string
          pattern: '^[0-9a-f]{16}$'
          description: 正文 sha256 的前 16 位；`PUT /api/rules/{id}` 的 `expected_revision` 就填它
      additionalProperties: false
    RegoSaveResult:
      type: object
      description: |
        一次规则写入的结果（`PUT /api/rules/{id}` 与 `POST /api/rules/{id}/rollback` 同形）。
        `action` 三态之外多一个 `rollback`：回滚是「把历史里那一版当新版再写一次」，所以当前版也会进历史，回滚可再回滚。
      required: [id, file, name, rev, previous_rev, action]
      properties:
        id: { type: string, pattern: '^[a-z][a-z0-9_]*$' }
        file: { type: string, description: 写回的规则文件名（沿用该 id 原来的文件名，不另起同 id 的第二个文件） }
        name: { type: string }
        rev: { type: string, pattern: '^[0-9a-f]{16}$', description: 新正文的版本指纹 }
        previous_rev:
          type: [string, 'null']
          description: 被覆盖那一版的版本指纹；新增规则时是 null，`action=unchanged` 时也是 null（没写盘、没进历史）
        action: { type: string, enum: [add, update, unchanged, rollback] }
        rolled_back_to: { type: string, pattern: '^[0-9a-f]{16}$', description: 只在 `action=rollback` 时出现：回滚到的历史版本 }
      additionalProperties: false
    RegoHistoryEntry:
      type: object
      description: |
        历史版本的一条：正文副本 `<数据根>/rules-history/<id>-<rev>.rego`，备注在并排的 `<id>-<rev>.json`。
      required: [id, rev, file, bytes, saved_at, note]
      properties:
        id: { type: string }
        rev: { type: string, pattern: '^[0-9a-f]{16}$' }
        file: { type: string, description: 历史文件名，形如 `<id>-<rev>.rego` }
        bytes: { type: integer, minimum: 0 }
        saved_at: { type: string, format: date-time, description: 该历史文件的写入时间 }
        note:
          type: [string, 'null']
          description: |
            这一版为什么被替换掉（`PUT` 的 `note` 存成 `人工维护：<note>`，回滚存成 `人工回滚（<who>）`，
            维护者 Agent 存成 `误报维护（<who>）：<理由>`）。没备注的归档与旧副本是 `null`。
      additionalProperties: false
    RegoRuleHistory:
      type: object
      required: [id, history]
      properties:
        id: { type: string }
        history:
          type: array
          description: 按写入时间升序；规则不存在或还没改过时是空数组，不是 404。
          items: { $ref: '#/components/schemas/RegoHistoryEntry' }
      additionalProperties: false
    RegoSessionSummary:
      type: object
      description: 规则维护会话摘要（不含规则正文与误报理由原文；全文在 `<数据根>/rule-sessions/<uuid>.json`）。
      required: [id, case_id, event_type, who, status, rule_id, validated, updated_at]
      properties:
        id: { type: string, description: 会话 ID（UUID），也是会话文件名 }
        case_id: { type: [string, 'null'], description: 触发的案卷 ID }
        event_type: { type: [string, 'null'] }
        who: { type: [string, 'null'], description: 登记误报的人 }
        status:
          type: string
          enum: [collecting, validating, updated, no_change, failed]
          description: 终态是 updated / no_change / failed；collecting 与 validating 是过程态（进程半路挂掉会停在这里）
        rule_id: { type: [string, 'null'], description: 模型草案改的是哪条规则 }
        validated: { type: boolean, description: 校验是否通过（`status=failed` 时为 false） }
        updated_at: { type: string, format: 'date-time' }
      additionalProperties: false
    RegoRuleWrite:
      type: object
      description: |
        人工维护一条规则。校验与写盘由 `RuleStore.save()` 完成，与规则维护者 Agent 走同一套：
        语法必须在规则子集内（`rule-store.js` 文件头）、包名必须与 id 一致、旧版先进 `<数据根>/rules-history/` 再原子替换。
      required: [rego, expected_revision]
      properties:
        rego: { type: string, minLength: 1, description: 整份 .rego 原文 }
        expected_revision:
          type: [string, 'null']
          description: |
            乐观并发：读到的当前正文指纹（`GET /api/rules/{id}` 的 `revision`）。与当前不一致回 409，别让后写的悄悄盖掉前一份。
            新增规则时传 null（要求当前不存在）。
        note: { type: string, maxLength: 200, description: 写进历史备注的一句话：被替换那一版的历史条目里存成 `人工维护：<note>`（没传就是 `人工维护`） }
      additionalProperties: false
    RegoRollback:
      type: object
      required: [rev]
      properties:
        rev: { type: string, pattern: '^[0-9a-f]{16}$', description: 回滚到的历史版本；历史里没有这一版回 404 }
        who: { type: string, maxLength: 100, description: 操作人，写进被替换那一版的历史备注（`人工回滚（<who>）`）；不传就用当前登录用户名 }
      additionalProperties: false
    RegoRuleList:
      type: object
      required: [count, rules]
      properties:
        count: { type: integer, minimum: 0 }
        rules:
          type: array
          items: { $ref: '#/components/schemas/RegoRuleSummary' }
      additionalProperties: false
    RegoRuleMatch:
      type: object
      description: 求值命中项：规则名字加 Rego 原文。
      required: [id, name, rego]
      properties:
        id: { type: string }
        name: { type: string }
        rego: { type: string }
      additionalProperties: false
    RegoEvaluation:
      type: object
      description: 求值结果。没有规则命中时 `matched` 是空数组、`count` 是 0，不是 null。
      required: [count, matched]
      properties:
        count: { type: integer, minimum: 0 }
        matched:
          type: array
          items: { $ref: '#/components/schemas/RegoRuleMatch' }
      additionalProperties: false
    AlertFact:
      type: object
      description: |
        一条告警事实。七个约定字段都可省略：规则只读自己写到的字段，没写的字段就是不限制；多余的键被忽略。
        字段与规则条件里的名字一一对应（`input.host`、`input.source_ip` …）。
      properties:
        host: { type: string, description: 主机 }
        peer: { type: string, description: 对端 }
        command: { type: string, description: 命令 }
        user: { type: string, description: 用户 }
        path: { type: string, description: 路径 }
        type: { type: string, description: 类型 }
        source_ip: { type: string, description: 来源 IP }
      additionalProperties: true
    WikiPageSummary:
      type: object
      description: 知识库页面元数据（不含正文）。浏览接口一次返回目录下全部页，含 deprecated 页。
      required: [path, id, title, status, updated, revision, characters]
      properties:
        path: { type: string, description: 相对 wiki 根目录的路径，如 common/GEN-12.md }
        id: { type: string, description: frontmatter 的 id；缺省取文件名 }
        title: { type: string, description: frontmatter 的 title；缺省取一级标题 }
        status:
          type: string
          enum: [active, draft, deprecated, reference]
          description: frontmatter 的 status；缺这个字段时读作 reference。写入（PUT）只接受 active、draft、deprecated
        updated: { type: string, description: frontmatter 的 updated（YYYY-MM-DD）；缺省是空串，不是 null }
        revision: { type: string, pattern: '^[0-9a-f]{16}$', description: 正文全文 SHA-256 的前 16 位十六进制 }
        characters: { type: integer, description: 正文全文（含 frontmatter）长度，按 UTF-16 码元计：一个汉字算 1，一个基本平面外字符算 2 }
      additionalProperties: true
    WikiPage:
      description: 单个知识库页面：元数据加全文。
      allOf:
        - $ref: '#/components/schemas/WikiPageSummary'
        - type: object
          required: [content]
          properties:
            content: { type: string, description: 含 frontmatter 的完整 Markdown 正文 }
          additionalProperties: true
    MaintenanceIdentity:
      type: object
      required: [user, role]
      properties:
        user: { type: string }
        role: { type: string, enum: [viewer, updater] }
    Error:
      description: |
        业务错误体：`error` 是给人看的原话，`code` 是给程序判断的稳定标识。四类各一个 code，取值只有四个：
        caller_error（调用方传错，对应 4xx）/ not_configured（没配置，503）/ upstream_error（上游失败，502）/
        internal_error（本程序失败，500）。`internal_error` 的 `error` 恒为「服务器内部错误」，异常原文与堆栈只进服务端日志。
      type: object
      required: [error, code]
      properties:
        error:
          type: string
          description: 失败原因原话；上游失败时是上游那句摘要（已做凭据擦除），本程序失败时恒为「服务器内部错误」。规则库错误额外在 error 里含 rules/<file>:<行> 定位（P003-T067 B10）
        code:
          type: string
          enum: [caller_error, not_configured, upstream_error, internal_error]
          description: 四类失败之一的稳定标识；同一类在任何路由上都是同一个值
  responses:
    BusinessUnauthorized:
      description: |
        业务 Basic 认证失败（P003-T073 起为 JSON 体）：`code: unauthorized` 与维护端同一命名风格；
        Basic 弹窗行为不变——浏览器认的是 WWW-Authenticate 头，不是正文。
      headers:
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/json:
          schema:
            type: object
            required: [error, code]
            properties:
              error:
                type: string
                description: 固定文案「需要登录后访问」
              code:
                type: string
                enum: [unauthorized]
    ToolCatalog:
      description: 当前可用的只读取证工具目录
      content:
        application/json:
          schema:
            type: object
            required: [provider, readOnly, count, tools]
            properties:
              provider: { type: string }
              readOnly: { type: boolean, const: true }
              count: { type: integer }
              tools: { type: array, items: { type: object, additionalProperties: true } }
    JsonObject:
      description: JSON 对象；详细字段随具体资源变化，不包含提示词正文或升级包明文
      content:
        application/json:
          schema: { type: object, additionalProperties: true }
    BadRequest:
      description: 请求参数、内容或版本无效（调用方传错，`code=caller_error`）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: 未通过身份认证（调用方传错，`code=caller_error`）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: 没有该接口的权限（调用方传错，`code=caller_error`）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 指定资源不存在（调用方传错，`code=caller_error`）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: |
        乐观并发冲突或状态不允许（调用方传错，`code=caller_error`）：`expected_revision` / `expected` 与当前版本不一致时回它，
        调用方刷新后重提。正文 `error` 是校验原话，如「规则已更新，请刷新后再提交」。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServiceUnavailable:
      description: 依赖的牧云、模型或管理令牌尚未配置（没配置，`code=not_configured`）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BackendError:
      description: 上游查询或研判失败（上游失败，`code=upstream_error`）；正文 `error` 是上游那句摘要，调用方可原样上屏
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RuleLibraryError:
      description: |
        规则文件读取或解析失败（上游失败，`code=upstream_error`）：规则库是数据根里的活数据
        （`<数据根>/rules/`，P003-T041），读不出来按上游类处理。正文 `error` 里带 `rules/<文件>:<行>` 定位。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalError:
      description: |
        本程序失败（`code=internal_error`）：没预料到的异常或本地运行态读写失败。正文固定为
        `{"error":"服务器内部错误","code":"internal_error"}`，异常原文与堆栈只进服务端日志，不回给调用方。
        任意业务接口都可能返回它，所以各路径下不逐条重复声明。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: |
        请求被拒（调用方传错，`code=caller_error`）。两个来源：登录失败次数过多；
        自动研判队列（排队 + 在跑）已达 `HIDS_TRIAGE_QUEUE_MAX`，正文 `研判队列已满（上限 N），稍后再试`。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
