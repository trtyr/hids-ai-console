openapi: 3.1.0
info:
  title: HIDS AI 研判平台 API
  version: 2026-11-11
  description: |
    依据 backend/server.js 和 backend/maintenance-server.js 的实际路由整理。
    客户前端默认运行于 8081，反向代理 /api/* 到业务后端 8080；维护页面默认运行于 18082，同源转发到仅允许本机访问的维护 API 18081。
    业务 Basic 认证仅在 HIDS_BASIC_AUTH_PASSWORD 已配置时启用。所有业务 API 都沿用该认证；业务认证失败返回纯文本 401。
    Syslog 是 15514/UDP 输入，不属于 HTTP OpenAPI；深度研判与常规研判的 HTTP 接口分别列出。
servers:
  - url: http://127.0.0.1:8080
    description: 业务后端直连入口
  - url: http://127.0.0.1:8081
    description: 客户前端同源入口，转发业务 API
security:
  - basicAuth: []
tags:
  - name: 状态
  - name: 告警
  - name: 自动研判
  - name: 深度研判
  - name: 规则
  - name: 知识库
  - name: 维护服务
paths:
  /api/session:
    get:
      tags: [状态]
      summary: 校验业务访问身份
      operationId: getSession
      responses:
        '200':
          description: 已通过业务访问认证，或未启用 Basic 认证
          content:
            application/json:
              schema:
                type: object
                required: [authenticated]
                properties:
                  authenticated: { type: boolean, const: true }
        '401': { $ref: '#/components/responses/BusinessUnauthorized' }
  /api/status:
    get:
      tags: [状态]
      summary: 检查牧云连接
      operationId: getCloudwalkerStatus
      responses:
        '200':
          description: 配置和连接状态
          content:
            application/json:
              schema:
                type: object
                required: [configured, connected]
                properties:
                  configured: { type: boolean }
                  connected: { type: boolean }
                  reason: { type: string }
                additionalProperties: true
        '502':
          description: 牧云连接失败，仍返回配置与连接状态
          content:
            application/json:
              schema:
                type: object
                required: [configured, connected, reason]
                properties:
                  configured: { type: boolean, const: true }
                  connected: { type: boolean, const: false }
                  reason: { type: string }
  /api/updates:
    get:
      tags: [状态]
      summary: 获取面向客户的版本与更新日志
      description: 不返回提示词正文和升级包明文。
      operationId: getUpdates
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
  /api/agent/status:
    get:
      tags: [状态]
      summary: 获取研判模型与提示词版本状态
      operationId: getAgentStatus
      responses:
        '200':
          description: 研判服务状态
          content:
            application/json:
              schema:
                type: object
                required: [configured, model, missing, prompt_version]
                properties:
                  configured: { type: boolean }
                  model: { type: [string, 'null'] }
                  missing: { type: array, items: { type: string } }
                  prompt_version: { type: string }
  /api/agent/tools:
    get:
      tags: [状态]
      summary: 列出牧云 API 只读取证工具
      operationId: listAgentTools
      responses:
        '200': { $ref: '#/components/responses/ToolCatalog' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/trace/tools:
    get:
      tags: [状态]
      summary: 列出牧云 MCP 只读取证工具
      operationId: listTraceTools
      responses:
        '200': { $ref: '#/components/responses/ToolCatalog' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/agent/prompts:
    get:
      tags: [状态]
      summary: 获取提示词版本元数据
      description: 仅元数据，不返回提示词正文。业务端不提供修改接口。
      operationId: getPromptMetadata
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
  /api/agent/prompts/upload:
    post:
      tags: [状态]
      summary: 已停用的业务端提示词上传入口
      description: 提示词升级改由独立维护 API 执行；此入口始终拒绝上传。
      operationId: legacyPromptUpload
      deprecated: true
      responses:
        '410':
          description: 入口已停用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/alerts:
    get:
      tags: [告警]
      summary: 分页获取牧云告警
      operationId: listAlerts
      parameters:
        - $ref: '#/components/parameters/Count'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: 按时间合并各类事件；partial 为 true 时 errors 包含部分类型失败原因
          content:
            application/json:
              schema:
                type: object
                required: [alerts, total, totals, errors, partial]
                properties:
                  alerts: { type: array, items: { $ref: '#/components/schemas/Alert' } }
                  total: { type: integer }
                  totals: { type: object, additionalProperties: { type: integer } }
                  errors: { type: object, additionalProperties: { type: string } }
                  partial: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/alerts/{alertId}:
    get:
      tags: [告警]
      summary: 获取指定牧云事件详情
      operationId: getAlert
      parameters:
        - $ref: '#/components/parameters/AlertId'
      responses:
        '200':
          description: 告警摘要和牧云原始详情
          content:
            application/json:
              schema:
                type: object
                required: [alert, detail]
                properties:
                  alert: { $ref: '#/components/schemas/Alert' }
                  detail: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '502': { $ref: '#/components/responses/BackendError' }
  /api/agent/triage/status:
    get:
      tags: [自动研判]
      summary: 获取自动研判队列汇总
      operationId: getTriageStatus
      responses:
        '200':
          description: 队列状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TriageSummary' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/agent/triage/cases:
    get:
      tags: [自动研判]
      summary: 分页读取 Syslog 案件
      operationId: listTriageCases
      parameters:
        - $ref: '#/components/parameters/Count'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: 案件列表，包含未匹配牧云事件的记录
          content:
            application/json:
              schema:
                type: object
                required: [total, cases]
                properties:
                  total: { type: integer }
                  cases: { type: array, items: { $ref: '#/components/schemas/TriageCase' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/agent/triage/control:
    put:
      tags: [自动研判]
      summary: 暂停或恢复自动研判
      description: 暂停期间收到的 Syslog 不会自动补判；已有运行任务会完成。
      operationId: setTriageEnabled
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
              additionalProperties: false
      responses:
        '200':
          description: 更新后的队列状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TriageSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/agent/triage/{alertId}:
    parameters:
      - $ref: '#/components/parameters/TriageId'
    get:
      tags: [自动研判]
      summary: 查询单条研判任务和步骤
      operationId: getTriageRecord
      responses:
        '200':
          description: 任务状态；未入队时 status 为 not_queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TriageCase' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [自动研判]
      summary: 手动入队或重试指定告警
      operationId: retryTriage
      responses:
        '202':
          description: 已接受任务；正在运行的任务不会重复启动
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TriageCase' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/agent/investigations:
    post:
      tags: [深度研判]
      summary: 手动启动单告警研判
      description: |
        mode=deep 使用原有深度研判 API；mode=triage 使用常规研判。
        query stream=1 时返回 SSE，事件为 progress、result、error，15 秒心跳；否则返回 JSON。
        控制台深度溯源白板使用 /api/trace/boards，不依赖此接口的 deep 结果。
      operationId: createInvestigation
      parameters:
        - name: stream
          in: query
          schema: { type: string, enum: ['1'] }
          description: 设为 1 时启用 SSE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alert_id]
              properties:
                alert_id: { $ref: '#/components/schemas/TypedAlertId' }
                mode: { type: string, enum: [triage, deep], default: deep }
      responses:
        '200':
          description: 普通请求返回调查结果；stream=1 返回 SSE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Investigation' }
            text/event-stream:
              schema: { type: string, description: "data: JSON 对象；type 为 progress、result 或 error" }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/agent/investigations/{alertId}:
    get:
      tags: [深度研判]
      summary: 读取最近一次保存的调查结果
      operationId: getInvestigation
      parameters:
        - $ref: '#/components/parameters/TriageId'
        - name: mode
          in: query
          schema: { type: string, enum: [triage, deep], default: deep }
      responses:
        '200':
          description: 调查结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Investigation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/trace/boards:
    get:
      tags: [深度研判]
      summary: 列出已保存的溯源白板
      operationId: listTraceBoards
      responses:
        '200':
          description: 白板摘要列表
          content:
            application/json:
              schema:
                type: object
                required: [boards]
                properties:
                  boards: { type: array, items: { $ref: '#/components/schemas/TraceBoard' } }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [深度研判]
      summary: 从告警 ID 或 IPv4 地址启动深度溯源
      operationId: startTraceBoard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: target 优先；兼容 alert_id 和 ip 字段
              properties:
                target: { type: string, description: "例如 revshell:1、172.16.221.41 或 ip:172.16.221.41" }
                alert_id: { $ref: '#/components/schemas/TypedAlertId' }
                ip: { type: string, format: ipv4 }
                focus: { type: string }
      responses:
        '202':
          description: 白板任务已启动
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TraceBoard' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/trace/boards/{target}:
    get:
      tags: [深度研判]
      summary: 读取溯源白板进度和结果
      operationId: getTraceBoard
      parameters:
        - name: target
          in: path
          required: true
          description: 告警 ID 或 IPv4 地址；冒号需 URL 编码
          schema: { type: string }
      responses:
        '200':
          description: 白板及其节点、关系、活动记录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TraceBoard' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/triage/rules:
    get:
      tags: [规则]
      summary: 获取前置规则配置
      operationId: getRules
      responses:
        '200':
          description: 当前规则集、版本和是否可写
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuleSetResponse' }
    put:
      tags: [规则]
      summary: 以预期版本保存规则集
      description: 需要业务 Basic 认证，以及 X-Rule-Admin-Token。
      operationId: saveRules
      security:
        - basicAuth: []
          ruleAdminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config, expected_revision]
              properties:
                config: { type: object, additionalProperties: true }
                expected_revision: { type: [string, 'null'], pattern: '^[0-9a-f]{16}$' }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/triage/rules/validate:
    post:
      tags: [规则]
      summary: 校验规则草稿
      operationId: validateRules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config]
              properties:
                config: { type: object, additionalProperties: true }
      responses:
        '200':
          description: 校验通过
          content:
            application/json:
              schema:
                type: object
                required: [valid, count]
                properties:
                  valid: { type: boolean, const: true }
                  count: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/wiki/pages:
    get:
      tags: [知识库]
      summary: 浏览已发布知识库页面
      operationId: listWikiPages
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: 标题、编号或路径筛选；有查询词时最多 50 条
      responses:
        '200':
          description: 页面目录
          content:
            application/json:
              schema:
                type: object
                required: [pages]
                properties:
                  pages: { type: array, items: { $ref: '#/components/schemas/WikiPageSummary' } }
  /api/wiki/pages/{pagePath}:
    get:
      tags: [知识库]
      summary: 读取指定 Wiki 页面
      operationId: getWikiPage
      parameters:
        - name: pagePath
          in: path
          required: true
          description: 相对路径，如 common/GEN-12.md；斜杠需 URL 编码
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/wiki/health:
    get:
      tags: [知识库]
      summary: 检查 Wiki 文件和索引
      description: 需要 X-Prompt-Admin-Token。
      operationId: getWikiHealth
      security:
        - basicAuth: []
          promptAdminToken: []
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/wiki/sessions:
    get:
      tags: [知识库]
      summary: 列出知识维护会话
      operationId: listWikiSessions
      security:
        - basicAuth: []
          promptAdminToken: []
      responses:
        '200':
          description: 会话列表
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions: { type: array, items: { type: object, additionalProperties: true } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [知识库]
      summary: 创建知识维护会话或从已完成案件创建复盘
      operationId: createWikiSession
      security:
        - basicAuth: []
          promptAdminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                page: { type: string }
                case_id: { type: string }
                reason: { type: string }
                expected_verdict: { type: string }
                who: { type: string }
              description: page 或 case_id 至少提供一个
      responses:
        '201': { $ref: '#/components/responses/JsonObject' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/wiki/sessions/{sessionId}:
    get:
      tags: [知识库]
      summary: 获取知识维护会话
      operationId: getWikiSession
      security:
        - basicAuth: []
          promptAdminToken: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/wiki/sessions/{sessionId}/messages:
    post:
      tags: [知识库]
      summary: 向知识维护会话提交材料或回答
      operationId: replyWikiSession
      security:
        - basicAuth: []
          promptAdminToken: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/wiki/sessions/{sessionId}/replay:
    post:
      tags: [知识库]
      summary: 重放当前草稿的历史案件核对
      operationId: replayWikiSession
      security:
        - basicAuth: []
          promptAdminToken: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
  /api/wiki/sessions/{sessionId}/publish:
    post:
      tags: [知识库]
      summary: 审核并发布知识库草稿
      operationId: publishWikiSession
      security:
        - basicAuth: []
          promptAdminToken: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: 审核结论、有效期、审核备注等；依草稿类型校验
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/maintenance/session:
    servers: [{ url: 'http://127.0.0.1:18081', description: 独立维护服务，仅允许本机或 SSH 隧道 }]
    get:
      tags: [维护服务]
      summary: 查询维护登录状态
      operationId: getMaintenanceSession
      security: []
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
  /api/maintenance/login:
    servers: [{ url: 'http://127.0.0.1:18081' }]
    post:
      tags: [维护服务]
      summary: 登录独立维护服务
      operationId: loginMaintenance
      security: []
      parameters:
        - $ref: '#/components/parameters/MaintenanceWrite'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200':
          description: 登录成功并设置 HttpOnly、SameSite=Strict 会话 Cookie
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceIdentity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/maintenance/logout:
    servers: [{ url: 'http://127.0.0.1:18081' }]
    post:
      tags: [维护服务]
      summary: 退出维护会话
      operationId: logoutMaintenance
      security:
        - maintenanceCookie: []
        - maintenanceBasic: []
      parameters:
        - $ref: '#/components/parameters/MaintenanceWrite'
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/maintenance/overview:
    servers: [{ url: 'http://127.0.0.1:18081' }]
    get:
      tags: [维护服务]
      summary: 获取维护端版本和升级包列表
      operationId: getMaintenanceOverview
      security:
        - maintenanceCookie: []
        - maintenanceBasic: []
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/maintenance/packages:
    servers: [{ url: 'http://127.0.0.1:18081' }]
    post:
      tags: [维护服务]
      summary: 上传加密签名的策略包并暂存
      operationId: stageMaintenancePackage
      security:
        - maintenanceCookie: []
        - maintenanceBasic: []
      parameters:
        - $ref: '#/components/parameters/MaintenanceWrite'
        - name: X-Package-Filename
          in: header
          required: true
          description: URL 编码的文件名
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '201':
          description: 暂存成功，尚未替换运行策略
          content:
            application/json:
              schema:
                type: object
                required: [id, version]
                properties:
                  id: { type: string, pattern: '^[0-9a-f]{64}$' }
                  version: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/BadRequest' }
        '415': { $ref: '#/components/responses/BadRequest' }
  /api/maintenance/packages/{packageId}:
    servers: [{ url: 'http://127.0.0.1:18081' }]
    get:
      tags: [维护服务]
      summary: 查看暂存包公开详情与兼容性
      operationId: getMaintenancePackage
      security:
        - maintenanceCookie: []
        - maintenanceBasic: []
      parameters:
        - $ref: '#/components/parameters/PackageId'
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/maintenance/packages/{packageId}/apply:
    servers: [{ url: 'http://127.0.0.1:18081' }]
    post:
      tags: [维护服务]
      summary: 核对版本后应用暂存包
      operationId: applyMaintenancePackage
      security:
        - maintenanceCookie: []
        - maintenanceBasic: []
      parameters:
        - $ref: '#/components/parameters/PackageId'
        - $ref: '#/components/parameters/MaintenanceWrite'
        - name: If-Match
          in: header
          required: true
          schema: { type: string }
          description: 当前运行策略的 revision
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/BadRequest' }
        '428': { $ref: '#/components/responses/BadRequest' }
components:
  securitySchemes:
    basicAuth: { type: http, scheme: basic, description: 业务端 HIDS_BASIC_AUTH_USER/PASSWORD；未配置密码时不启用 }
    ruleAdminToken: { type: apiKey, in: header, name: X-Rule-Admin-Token }
    promptAdminToken: { type: apiKey, in: header, name: X-Prompt-Admin-Token }
    maintenanceBasic: { type: http, scheme: basic, description: 独立维护账号 }
    maintenanceCookie: { type: apiKey, in: cookie, name: hids_maintenance_session }
  parameters:
    Count:
      name: count
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    AlertId:
      name: alertId
      in: path
      required: true
      description: 形如 revshell:1 的牧云事件 ID；冒号需 URL 编码
      schema: { $ref: '#/components/schemas/TypedAlertId' }
    TriageId:
      name: alertId
      in: path
      required: true
      description: 牧云事件 ID 或 syslog 案件 ID；深度模式仅接受牧云事件 ID
      schema: { type: string }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PackageId:
      name: packageId
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9a-f]{64}$' }
    MaintenanceWrite:
      name: X-Hids-Maintenance
      in: header
      required: true
      schema: { type: string, const: '1' }
      description: 写入请求还会校验 Origin 和 Sec-Fetch-Site
  schemas:
    TypedAlertId:
      type: string
      pattern: '^[a-z_]+:[1-9][0-9]*$'
      examples: [revshell:1, suspicious_operation:8]
    Alert:
      type: object
      required: [id]
      properties:
        id: { $ref: '#/components/schemas/TypedAlertId' }
        title: { type: string }
        createdAt: { type: [string, 'null'], format: date-time }
        asset: { type: string }
        assetIp: { type: string }
        level: { type: string }
        triage: { oneOf: [{ $ref: '#/components/schemas/TriageCase' }, { type: 'null' }] }
      additionalProperties: true
    TriageSummary:
      type: object
      required: [initialized, enabled, input_mode, counts]
      properties:
        initialized: { type: boolean }
        enabled: { type: boolean }
        input_mode: { type: string, enum: [syslog, poll] }
        last_poll_at: { type: [string, 'null'] }
        last_error: { type: [string, 'null'] }
        counts:
          type: object
          properties:
            queued: { type: integer }
            running: { type: integer }
            done: { type: integer }
            failed: { type: integer }
    TriageCase:
      type: object
      required: [alert_id, status]
      properties:
        alert_id: { type: string }
        matched_alert_id: { type: [string, 'null'] }
        status: { type: string, enum: [not_queued, queued, running, done, failed] }
        stage: { type: string }
        detail: { type: string }
        verdict_label: { type: [string, 'null'], enum: [真实威胁, 存疑, 误报, null] }
        report: { type: [string, 'null'] }
        verified_facts: { type: integer }
        evidence_sources: { type: integer }
        steps: { type: array, items: { type: object, additionalProperties: true } }
      additionalProperties: true
    Investigation:
      type: object
      required: [alert_id, mode, verdict]
      properties:
        alert_id: { type: string }
        mode: { type: string, enum: [triage, deep] }
        saved_at: { type: string, format: date-time }
        verdict:
          type: object
          properties:
            verdict: { type: string, enum: [threat, uncertain, false_positive] }
            verdict_label: { type: string, enum: [真实威胁, 存疑, 误报] }
            report: { type: string, maxLength: 300 }
            summary: { type: string }
            claims: { type: array, items: { type: object, additionalProperties: true } }
            missing_evidence: { type: array, items: { type: string } }
          additionalProperties: true
        review: { type: object, additionalProperties: true }
        validation: { type: object, additionalProperties: true }
        trace: { type: array, items: { type: object, additionalProperties: true } }
        required_evidence: { type: array, items: { type: object, additionalProperties: true } }
      additionalProperties: true
    TraceBoard:
      type: object
      properties:
        id: { type: string }
        status: { type: string }
        nodes: { type: array, items: { type: object, additionalProperties: true } }
        edges: { type: array, items: { type: object, additionalProperties: true } }
        activity: { type: array, items: { type: object, additionalProperties: true } }
        summary: { type: string }
        gaps: { type: array, items: { type: string } }
      additionalProperties: true
    RuleSetResponse:
      type: object
      properties:
        config: { type: object, additionalProperties: true }
        revision: { type: [string, 'null'] }
        writable: { type: boolean }
      additionalProperties: true
    WikiPageSummary:
      type: object
      properties:
        id: { type: string }
        path: { type: string }
        title: { type: string }
        status: { type: string }
      additionalProperties: true
    MaintenanceIdentity:
      type: object
      required: [user, role]
      properties:
        user: { type: string }
        role: { type: string, enum: [viewer, updater] }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
  responses:
    BusinessUnauthorized:
      description: 业务 Basic 认证失败
      headers:
        WWW-Authenticate:
          schema: { type: string }
      content:
        text/plain:
          schema: { type: string }
    ToolCatalog:
      description: 当前可用的只读取证工具目录
      content:
        application/json:
          schema:
            type: object
            required: [provider, readOnly, count, tools]
            properties:
              provider: { type: string }
              readOnly: { type: boolean, const: true }
              count: { type: integer }
              tools: { type: array, items: { type: object, additionalProperties: true } }
    JsonObject:
      description: JSON 对象；详细字段随具体资源变化，不包含提示词正文或升级包明文
      content:
        application/json:
          schema: { type: object, additionalProperties: true }
    BadRequest:
      description: 请求参数、内容或版本无效
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: 未通过身份认证
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: 没有该接口的权限
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 指定资源不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServiceUnavailable:
      description: 依赖的牧云、模型或管理令牌尚未配置
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BackendError:
      description: 上游查询或研判失败
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: 登录失败次数过多
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
